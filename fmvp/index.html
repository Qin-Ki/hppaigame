function initTriangleSVG() {

    setTimeout(updateTriangleSVG, 50);

}

function updateTriangleSVG() {
  var stage = document.querySelector('.cyber-pyramid-stage');
  var svg = document.querySelector('.triangle-neon-skeleton svg');
  if (!stage || !svg) return;

  var stageW = stage.offsetWidth;
  var stageH = stage.offsetHeight;
  svg.setAttribute('viewBox', stageW + ' ' + stageH);

  var slotPositions = [];
  var allSlots = document.querySelectorAll('.slot');
  var stageRect = stage.getBoundingClientRect();
  
  for (var i = 0; i < allSlots.length; i++) {
    var rect = allSlots[i].getBoundingClientRect();
    var cx = rect.left + rect.width / 2 - stageRect.left;
    var cy = rect.top + rect.height / 2 - stageRect.top;
    slotPositions.push({ cx: cx, cy: cy });
  }

  if (slotPositions.length === 0) return;

  var firstCircle = document.querySelector('.final-slot .slot-circle-backer');
    var itemSize = firstCircle ? firstCircle.offsetWidth : parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--item-size'));
  var r = itemSize / 2;

  var minCx = Infinity, maxCx = -Infinity, minCy = 0, maxCy = 0;
  for (var j = 0; j < slotPositions.length; j++) {
    var p = slotPositions[j];
    if (p.cx < minCx) { minCx = p.cx; minCy = p.cy; }
    if (p.cx > maxCx) { maxCx = p.cx; maxCy = p.cy; }
  }

  var topCy = Infinity, topCx = 0;
  for (var k = 0; k < slotPositions.length; k++) {
    var p2 = slotPositions[k];
    if (p2.cy < topCy) { topCy = p2.cy; topCx = p2.cx; }
  }

  var apexX = topCx;
  var apexY = topCy - r;
  var bottomLeftX = minCx - r;
  var bottomLeftY = minCy;
  var bottomRightX = maxCx + r;
  var bottomRightY = maxCy;

  var points = apexX + ',' + apexY + ' ' + bottomLeftX + ',' + bottomLeftY + ' ' + bottomRightX + ',' + bottomRightY;
  
  var ids = ['glow-far', 'glow-mid', 'glow-flow', 'glow-core'];
  for (var m = 0; m < ids.length; m++) {
    var el = document.getElementById(ids[m]);
    if (el) el.setAttribute('points', points);
  }
}

function findCachedRectHit(rects, x, y, padding) {
  if (!rects) return null;
  padding = padding || 0;
  for (var i = 0; i < rects.length; i++) {
    var r = rects[i];
    if (x >= r.left - padding && x <= r.right + padding && y >= r.top - padding && y <= r.bottom + padding) {
      return r.el;
    }
  }
  return null;
}

    dragRafId = null;
    if (!touchGhost) return;

    touchGhost.style.transform = 'translate3d(' + pendingGhostX + 'px,' + pendingGhostY + 'px,0) scale(1.05)';

    var hitSlot = findCachedRectHit(cachedSlotRects, pendingHitX, pendingHitY, 10);
    if (hitSlot !== lastHighlightSlot) {
      if (lastHighlightSlot) lastHighlightSlot.classList.remove('drag-over');
      if (hitSlot) hitSlot.classList.add('drag-over');
      lastHighlightSlot = hitSlot;
    }
  });
}

function resetTouchDragState() {
  if (dragRafId !== null) {
    cancelAnimationFrame(dragRafId);
    dragRafId = null;
  }
  if (lastHighlightSlot) lastHighlightSlot.classList.remove('drag-over');
  cachedSlots = null;
  cachedSlotRects = null;
  cachedGridSlotRects = null;
  lastHighlightSlot = null;
  document.body.classList.remove('is-touch-dragging');
}

function bindItemEvents(item) {
  item.addEventListener('dragstart', function() {
    clearSelection();
    draggedItem = this;
    originalParentSlot = this.parentNode;
    setTimeout(function() { item.classList.add('dragging'); }, 0);
  });
  
  item.addEventListener('dragend', function() {
    item.classList.remove('dragging');
    draggedItem = null;
  });

  // 妗岄潰绔偣鍑婚€変腑
  item.addEventListener('click', function(e) {
    if (draggedItem) return;
    if (this.classList.contains('selected')) {
      clearSelection();
    } else {
      setSelectedItem(this);
    }
    e.stopPropagation();
  });

  item.addEventListener('touchstart', function(e) {
    if (e.touches.length > 1) return;
    e.preventDefault();
    
    var touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchStartTime = Date.now();
    touchMoved = false;
    lastTouchClientX = touch.clientX;
    lastTouchClientY = touch.clientY;
    
    draggedItem = this;
    originalParentSlot = this.parentNode;
    document.body.classList.add('is-touch-dragging');
    
    var rect = this.getBoundingClientRect();
    var avatar = this.querySelector('.item-avatar');
    var avatarRect = avatar ? avatar.getBoundingClientRect() : rect;
    touchOffsetX = touch.clientX - avatarRect.left;
    touchOffsetY = touch.clientY - avatarRect.top;

    // 缂撳瓨鎵€鏈夋Ы浣嶇殑浣嶇疆淇℃伅锛岄伩鍏?touchmove 涓噸澶嶆煡璇?
    cachedSlots = document.querySelectorAll('.slot');
    cachedSlotRects = [];
    for (var si = 0; si < cachedSlots.length; si++) {
      var sr = cachedSlots[si].getBoundingClientRect();
      cachedSlotRects.push({ el: cachedSlots[si], left: sr.left, top: sr.top, right: sr.right, bottom: sr.bottom });
    }
    var gridSlots = document.querySelectorAll('.pool-grid-slot');
    cachedGridSlotRects = [];
    for (var gi = 0; gi < gridSlots.length; gi++) {
      var gr = gridSlots[gi].getBoundingClientRect();
      cachedGridSlotRects.push({ el: gridSlots[gi], left: gr.left, top: gr.top, right: gr.right, bottom: gr.bottom });
    }
    lastHighlightSlot = null;

    touchGhost = avatar ? avatar.cloneNode(true) : this.cloneNode(true);
    touchGhost.classList.add('touch-ghost');
    touchGhost.style.width = avatarRect.width + 'px';
    touchGhost.style.height = avatarRect.height + 'px';
    // 浣跨敤 transform 瀹氫綅锛圙PU鍔犻€燂級锛屽垵濮嬩綅缃€氳繃 CSS 鍙橀噺璁剧疆
    var initX = avatarRect.left;
    var initY = avatarRect.top;
    pendingGhostX = initX;
    pendingGhostY = initY;
    pendingHitX = touch.clientX;
    pendingHitY = touch.clientY;
    touchGhost.style.transform = 'translate3d(' + initX + 'px,' + initY + 'px,0) scale(1.05)';
    touchGhost.style.display = 'none';
    document.body.appendChild(touchGhost);

    this.classList.add('dragging');
  }, { passive: false });

  item.addEventListener('touchmove', function(e) {
    if (!touchGhost) return;
    e.preventDefault(); 
    
    var touch = e.touches[0];
    lastTouchClientX = touch.clientX;
    lastTouchClientY = touch.clientY;
    var dx = touch.clientX - touchStartX;
    var dy = touch.clientY - touchStartY;
    if (!touchMoved) {
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
        touchMoved = true;
        touchGhost.style.display = '';
      } else {
        return; // 杩樻病绉诲姩瓒冲璺濈锛屼笉鍋氫换浣曚簨
      }
    }
    
    pendingGhostX = touch.clientX - touchOffsetX;
    pendingGhostY = touch.clientY - touchOffsetY;
    pendingHitX = touch.clientX;
    pendingHitY = touch.clientY;
    scheduleTouchDragFrame();
  }, { passive: false });

  item.addEventListener('touchend', function(e) {
    if (!draggedItem) return;
    this.classList.remove('dragging');

    // 鐭寜 = 鐐归€夋ā寮?
    var elapsed = Date.now() - touchStartTime;
    if (!touchMoved && elapsed < 300) {
      if (touchGhost) { touchGhost.remove(); touchGhost = null; }
      draggedItem = null;
      if (this.classList.contains('selected')) {
        clearSelection();
      } else {
        setSelectedItem(this);
      }
      resetTouchDragState();
      return;
    }

    if (touchGhost) {
      if (dragRafId !== null) {
        cancelAnimationFrame(dragRafId);
        dragRafId = null;
        touchGhost.style.transform = 'translate3d(' + pendingGhostX + 'px,' + pendingGhostY + 'px,0) scale(1.05)';
      }

      var endTouch = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : null;
      var endX = endTouch ? endTouch.clientX : lastTouchClientX;
      var endY = endTouch ? endTouch.clientY : lastTouchClientY;
      var currentSlot = lastHighlightSlot || findCachedRectHit(cachedSlotRects, endX, endY, 10);
      var currentGridSlot = currentSlot ? null : findCachedRectHit(cachedGridSlotRects, endX, endY, 8);

      if (currentSlot) {
        currentSlot.classList.remove('drag-over');
        handleItemPlacement(currentSlot, draggedItem);
      } else if (currentGridSlot) {
        handleItemPlacement(currentGridSlot, draggedItem);
      } else {
        if (endY > window.innerHeight * 0.6) {
          var emptyGrid = findFirstEmptyGridSlot();
          if (emptyGrid) emptyGrid.appendChild(draggedItem);
        } else {
          originalParentSlot.appendChild(draggedItem);
        }
      }

      touchGhost.remove();
      touchGhost = null;
    }
    resetTouchDragState();
    draggedItem = null;
  });

  item.addEventListener('touchcancel', function() {
    this.classList.remove('dragging');
    if (touchGhost) {
      touchGhost.remove();
      touchGhost = null;
    }
    resetTouchDragState();
    draggedItem = null;
  });
}

function handleItemPlacement(targetContainer, incomingItem) {
  var sourceParent = incomingItem.parentNode;
  var targetExistingItem = targetContainer.querySelector('.item');

  if (targetExistingItem && targetExistingItem !== incomingItem) {
    sourceParent.appendChild(targetExistingItem);
  }
  targetContainer.appendChild(incomingItem);
  
  if (targetContainer.classList.contains('slot')) {
    updateSlotGlow(targetContainer);
  }
  if (sourceParent.classList.contains('slot')) {
    updateSlotGlow(sourceParent);
  }
}

function updateSlotGlow(slot, animate) {
  if (animate === undefined) animate = true;
  var backer = slot.querySelector('.slot-circle-backer');
  var item = slot.querySelector('.item');
  if (!backer) return;
  
  if (item && item.dataset.theme) {
    var theme = themeGlowMap[item.dataset.theme];
    if (theme && animate) {
      triggerSlotFlash(backer, theme);
      triggerAvatarFlash(item);
    }
  }
}

function triggerSlotFlash(backer, theme) {
  backer.style.setProperty('--flash-color', theme.color);
  backer.style.setProperty('--flash-glow', theme.glow);
  
  backer.classList.remove('flash-active');
  void backer.offsetWidth;
  backer.classList.add('flash-active');
  setTimeout(function() {
    backer.classList.remove('flash-active');
    backer.style.removeProperty('--flash-color');
    backer.style.removeProperty('--flash-glow');
  }, 800);
}

function triggerAvatarFlash(item) {
  item.classList.remove('flash-active');
  void item.offsetWidth;
  item.classList.add('flash-active');
  setTimeout(function() { item.classList.remove('flash-active'); }, 800);
}

function findFirstEmptyGridSlot() {
  var gridSlots = document.querySelectorAll('.pool-grid-slot');
  for (var i = 0; i < gridSlots.length; i++) {
    if (!gridSlots[i].querySelector('.item')) return gridSlots[i];
  }
  return null;
}

/* ===== 鍒濆鍖?===== */
window.startGame = startGame;
window.showFinal = showFinal;
window.showToast = showToast;
renderHome();
</script>
