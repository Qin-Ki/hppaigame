        const isDisabled = !isSelected && selected.size >= MAX_SELECT;

          <button class="item ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}" onclick="toggleItem('${item.id}')">

            <div class="emoji">${item.emoji}</div>

    function toggleItem(id) {
      if (selected.has(id)) selected.delete(id);
      else {

        selected.add(id);
      }
      renderItems();
      updateOffer();

    function clearItems() {
      selected.clear();
      renderItems();
      updateOffer();

      return items.filter(i => selected.has(i.id));

      return selectedItems().reduce((sum, item) => sum + item.score, 0);

      return ids.every(id => selected.has(id));
    }

      return specials.find(s => hasAll(s.ids)) || null;

    function getPool(score) {
      return pools.find(p => score >= p.min && score <= p.max) || pools[pools.length - 1];

        const input = document.createElement('textarea');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        toast('分享文案已复制');

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.scale(2, 2);
      drawPoster(ctx, 500, 680);
      $('posterBox').classList.add('show');
      $('postBtn').classList.add('show');
      setTimeout(() => $('posterBox').scrollIntoView({ behavior: 'smooth', block: 'center' }), 120);
    }

    function drawPoster(ctx, w, h) {
      const r = lastResult;
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#0e0e1e');
      bg.addColorStop(.5, '#16162a');
      bg.addColorStop(1, '#0e0e1e');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      const glow1 = ctx.createRadialGradient(70, 90, 0, 70, 90, 220);
      glow1.addColorStop(0, 'rgba(239,35,60,.45)');
      glow1.addColorStop(1, 'rgba(239,35,60,0)');
      ctx.fillStyle = glow1;
      ctx.fillRect(0, 0, w, h);

      const glow2 = ctx.createRadialGradient(430, 120, 0, 430, 120, 240);
      glow2.addColorStop(0, 'rgba(36,107,254,.42)');
      glow2.addColorStop(1, 'rgba(36,107,254,0)');
      ctx.fillStyle = glow2;
      ctx.fillRect(0, 0, w, h);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('我对离谱报价模拟器的结果', w / 2, 48);

      const line = ctx.createLinearGradient(70, 78, w - 70, 78);
      line.addColorStop(0, 'rgba(255,255,255,0)');
      line.addColorStop(.5, 'rgba(255,255,255,.45)');
      line.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = line;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(70, 78);
      ctx.lineTo(w - 70, 78);
      ctx.stroke();

      const level = getPosterLevel(r.score);
      ctx.fillStyle = level.bg;
      roundRectC(ctx, 110, 104, 280, 72, 22);
      ctx.fill();
      ctx.fillStyle = level.color;
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText(level.text, w / 2, 149);

      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 46px sans-serif';
      wrapText(ctx, r.player, 50, 235, 400, 54, 'center');

      ctx.fillStyle = 'rgba(255,255,255,.72)';
      ctx.font = 'bold 17px sans-serif';
      ctx.fillText('你成功用一套离谱报价换来了他', w / 2, 315);

      drawStatRow(ctx, 55, 355, 390, 56, '报价总分', `${r.score} 分`, '#ffd166');
      drawStatRow(ctx, 55, 425, 390, 56, '报价道具', `${r.selectedNames.length} 件`, '#7dd3fc');
      drawStatRow(ctx, 55, 495, 390, 56, '隐藏彩蛋', r.specialName || '普通报价', '#fda4af');

      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,.82)';
      ctx.font = 'bold 18px sans-serif';
      wrapText(ctx, r.title, 55, 590, 390, 26, 'left');

      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,.52)';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('离谱报价模拟器 · 虎扑JRs出品', w / 2, 648);
    }

    function getPosterLevel(score) {
      if (score >= 400) return { text: '离谱彩蛋档', bg: 'rgba(255,209,102,.20)', color: '#ffd166' };
      if (score >= 330) return { text: '世界级球星', bg: 'rgba(36,107,254,.22)', color: '#93c5fd' };
      if (score >= 270) return { text: '球队核心', bg: 'rgba(239,35,60,.22)', color: '#fda4af' };
      if (score >= 170) return { text: '谈判开启', bg: 'rgba(34,197,94,.18)', color: '#86efac' };
      if (score >= 90) return { text: '有点东西', bg: 'rgba(168,85,247,.20)', color: '#d8b4fe' };
      return { text: '主打抽象', bg: 'rgba(255,255,255,.14)', color: '#fff' };
    }

    function drawStatRow(ctx, x, y, w, h, label, value, color) {
      ctx.fillStyle = 'rgba(255,255,255,.085)';
      roundRectC(ctx, x, y, w, h, 16);
      ctx.fill();
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,.62)';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(label, x + 20, y + 35);
      ctx.textAlign = 'right';
      ctx.fillStyle = color;
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText(value, x + w - 20, y + 35);
    }

    function roundRectC(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function dataURLToBlob(dataURL) {
      const arr = dataURL.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) u8arr[n] = bstr.charCodeAt(n);
      return new Blob([u8arr], { type: mime });
    }

    function normalizeUploadUrl(res) {
      if (!res) return '';
      const candidates = [];

      if (typeof res === 'string') candidates.push(res);
      if (typeof res === 'object') {
        candidates.push(
          res.url,
          res.ossUrl,
          res.fileUrl,
          res.imageUrl,
          res.downloadUrl,
          res.data?.url,
          res.data?.ossUrl,
          res.data?.fileUrl,
          res.data?.imageUrl,
          res.data?.downloadUrl,
          res.result?.url,
          res.result?.ossUrl,
          res.result?.fileUrl,
          res.res?.requestUrls?.[0]?.split('?')[0]
        );
      }

      for (let url of candidates) {
        if (!url || typeof url !== 'string') continue;
        url = url.trim();
        if (url.startsWith('//')) url = `https:${url}`;
        if (/^https?:\/\//i.test(url)) return url;
      }

      return '';
    }

    function canvasToBlob(canvas, type = 'image/png', quality = .95) {
      return new Promise((resolve, reject) => {
        if (canvas.toBlob) {
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('canvas toBlob failed')), type, quality);
          return;
        }
        try {
          resolve(dataURLToBlob(canvas.toDataURL(type, quality)));
        } catch (e) {
          reject(e);
        }
      });
    }

    async function uploadToOSS(blob, filename) {
      const file = new File([blob], filename, { type: blob.type || 'image/png' });

      if (window.ColorboxAI?.oss?.uploadFile) {
        const upload = window.ColorboxAI.oss.uploadFile;
        const attempts = [
          () => upload(file, filename),
          () => upload(file),
          () => upload({ file, filename }),
          () => upload({ file, fileName: filename }),
          () => upload({ blob: file, filename })
        ];
        for (const run of attempts) {
          try {
            const url = normalizeUploadUrl(await run());
            if (url) return url;
          } catch (e) {}
        }
      }

      if (window.ColorboxAI?.uploadFile) {
        const upload = window.ColorboxAI.uploadFile;
        const attempts = [
          () => upload(file, filename),
          () => upload(file),
          () => upload({ file, filename }),
          () => upload({ file, fileName: filename })
        ];
        for (const run of attempts) {
          try {
            const url = normalizeUploadUrl(await run());
            if (url) return url;
          } catch (e) {}
        }
      }

      if (window.KaleidoOSS) {
        const attempts = [
          () => window.KaleidoOSS.multipartUpload(filename, file),
          () => window.KaleidoOSS.multipartUpload(file, filename),
          () => window.KaleidoOSS.uploadFile?.(file, filename),
          () => window.KaleidoOSS.uploadFile?.({ file, filename })
        ];
        for (const run of attempts) {
          try {
            const url = normalizeUploadUrl(await run());
            if (url) return url;
          } catch (e) {}
        }
      }

      if (window.parent && window.parent !== window) {
        try {
          const dataURL = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
          const url = await new Promise((resolve, reject) => {
            const requestId = `oss_${Date.now()}_${Math.random().toString(16).slice(2)}`;
            const timer = setTimeout(() => reject(new Error('postMessage upload timeout')), 15000);
            function onMessage(event) {
              const data = event.data || {};
              if (data.requestId !== requestId) return;
              clearTimeout(timer);
              window.removeEventListener('message', onMessage);
              const url = normalizeUploadUrl(data) || normalizeUploadUrl(data.data) || normalizeUploadUrl(data.result);
              if (url) resolve(url);
              else reject(new Error(data.error || 'postMessage upload failed'));
            }
            window.addEventListener('message', onMessage);
            window.parent.postMessage({ type: 'HUPU_OSS_UPLOAD', requestId, filename, fileName: filename, mimeType: file.type, dataURL }, '*');
          });
          if (url) return url;
        } catch (e) {}
      }

      throw new Error('OSS_UPLOAD_UNAVAILABLE');
    }

    function safeNavigate(url, target = '_self') {
      try { window.ColorboxAI?.track?.('h5_post_click', { url }); } catch (e) {}
      if (window.ColorboxAI?.navigateTo) return window.ColorboxAI.navigateTo(url);
      if (window.ColorboxAI?.openUrl) return window.ColorboxAI.openUrl(url);
      if (target === '_blank') return window.open(url, '_blank');
      window.location.href = url;
    }

    async function sharePoster(btn) {
      if (!lastResult) return;
      if (!$('posterBox').classList.contains('show')) makePoster();
      const oldText = btn.textContent;
      btn.disabled = true;
      btn.textContent = '正在生成图片...';

      const canvas = $('posterCanvas');
      let imageUrl = '';
      let uploadError = '';

      try {
        const blob = await canvasToBlob(canvas, 'image/png', .95);
        btn.textContent = '正在上传图片...';
        imageUrl = await uploadToOSS(blob, `crazy_offer_${Date.now()}.png`);
        if (!/^https?:\/\//i.test(imageUrl)) {
          throw new Error('OSS返回值不是可访问图片URL');
        }
      } catch (e) {
        uploadError = e?.message || String(e);
        console.warn('[poster upload failed]', e);
      }

      const content = imageUrl
        ? shareText()
        : `${shareText()}

【提示】海报已生成，但当前环境没有拿到可用的 OSS 上传能力，图片需要手动保存后添加。`;

      const initialValue = {
        syncPost: true,
        appJsonV3: {
          activeTab: 'thread',
          data: {
            topicId: 184,
            topicName: '足球话题区',
            forumId: 184,
            forumName: '足球话题区',
            boardId: 184,
            boardName: '足球话题区',
            tagId: 147637,
            tagName: '离谱报价模拟器',
            title: buildPostTitle(),
            imageList: imageUrl ? [imageUrl] : [],
            content
          }
        }
      };

      const query = [
        `topicName=${encodeURIComponent('足球话题区')}`,
        `topicId=184`,
        `forumName=${encodeURIComponent('足球话题区')}`,
        `forumId=184`,
        `boardName=${encodeURIComponent('足球话题区')}`,
        `boardId=184`,
        `tagName=${encodeURIComponent('离谱报价模拟器')}`,
        `tagId=147637`,
        `initialValue=${encodeURIComponent(JSON.stringify(initialValue))}`
      ].join('&');

      btn.disabled = false;
      btn.textContent = oldText;

      if (!imageUrl) {
        toast(`图片未自动带入：${uploadError || '未拿到有效图片URL'}`);
      } else {
        toast('图片上传成功，正在打开编辑器');
      }

      setTimeout(() => {
        safeNavigate(`huputiyu://bbs/postImg?${query}`);
      }, 260);
    }

    function drawCircle(ctx, x, y, r, color) {
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle = color; ctx.fill();
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.arcTo(x+w, y, x+w, y+h, r);
      ctx.arcTo(x+w, y+h, x, y+h, r);
      ctx.arcTo(x, y+h, x, y, r);
      ctx.arcTo(x, y, x+w, y, r);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight, align = 'left') {
      const chars = String(text).split('');
      let line = '';
      const oldAlign = ctx.textAlign;
      ctx.textAlign = align;
      const drawX = align === 'center' ? x + maxWidth / 2 : x;
      for (let i = 0; i < chars.length; i++) {
        const testLine = line + chars[i];
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && i > 0) {
          ctx.fillText(line, drawX, y);
          line = chars[i];
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, drawX, y);
      ctx.textAlign = oldAlign;
    }

    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
    }

    renderItems();
    updateOffer();
  </script>
