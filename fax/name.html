<html lang="zh-CN">
<head>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background: #f5f5f5; color: #1a1a1a; }
  body { overflow-x: hidden; }

  :root {
    --hupu-red: #e0232b;
    --hupu-orange: #ff6b35;
    --hupu-gold: #ffb347;
    --hupu-blue: #246bfe;
    --hupu-bg: #f5f5f5;
    --card-bg: #ffffff;
    --card-border: #e8e8e8;
    --text-primary: #1a1a1a;
    --text-secondary: #888;
    --text-muted: #aaa;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,.10);
  }

  .hupu-header { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 0 2px; }
  .hupu-header img { width: 22px; height: 22px; border-radius: 4px; }
  .hupu-header span { font-size: 13px; font-weight: 700; color: var(--text-secondary); letter-spacing: .3px; }

  .app { width: 100%; min-height: 100vh; background: var(--hupu-bg); position: relative; overflow: hidden; }

  .screen { display: none; min-height: 100vh; padding: 16px 14px 20px; position: relative; z-index: 2; }
  .screen.active { display: flex; flex-direction: column; }

  .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 0 30px; margin-top: -30px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid var(--hupu-red); background: rgba(224,35,43,.06); border-radius: 999px; color: var(--hupu-red); font-size: 12px; font-weight: 800; letter-spacing: .3px; }
  .title { margin: 14px 0 6px; font-size: clamp(36px, 10vw, 52px); line-height: 1; font-weight: 1000; letter-spacing: -1.5px; }
  .title span { display: inline; color: var(--text-primary); }
  .title .highlight { background: linear-gradient(135deg, var(--hupu-red), var(--hupu-orange)); -webkit-background-clip: text; color: transparent; }
  .subtitle { max-width: 300px; color: var(--text-secondary); line-height: 1.6; font-size: 14px; margin: 8px auto 22px; }
  .fun-card { width: min(340px, 92vw); border: 1px solid var(--card-border); border-radius: 18px; background: var(--card-bg); box-shadow: var(--shadow-md); padding: 16px; margin: 10px auto 22px; text-align: left; }
  .fax { display: flex; gap: 10px; align-items: center; color: var(--text-primary); font-weight: 800; font-size: 15px; }
  .fax-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--hupu-red), var(--hupu-orange)); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 6px 16px rgba(224,35,43,.22); flex-shrink: 0; }
  .fax-icon img { width: 22px; height: 22px; border-radius: 3px; }
  .quote { color: var(--text-secondary); margin-top: 10px; font-size: 12px; line-height: 1.6; }

  button { border: none; color: #fff; font-weight: 800; cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent; outline: none; }
  button:active { opacity: .88; }
  .primary-btn { width: min(340px, 92vw); min-height: 50px; border-radius: 14px; background: linear-gradient(135deg, var(--hupu-red), var(--hupu-orange)); box-shadow: 0 8px 24px rgba(224,35,43,.28); font-size: 17px; letter-spacing: .5px; }
  .ghost-btn { min-height: 44px; padding: 0 16px; border-radius: 14px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-primary); font-size: 14px; box-shadow: var(--shadow-sm); }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; padding-top: 4px; }
  .page-title { font-size: 20px; font-weight: 1000; color: var(--text-primary); letter-spacing: -.3px; }
  .limit { color: var(--hupu-red); font-size: 12px; font-weight: 800; background: rgba(224,35,43,.08); border: 1px solid rgba(224,35,43,.18); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }

  .offer-panel { position: sticky; top: 0; z-index: 10; padding: 12px; margin: 0 -2px 10px; border: 1px solid var(--card-border); border-radius: 18px; background: var(--card-bg); box-shadow: var(--shadow-md); }
  .selected-list { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .selected-list::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: rgba(224,35,43,.07); color: var(--hupu-red); border: 1px solid rgba(224,35,43,.15); font-size: 12px; font-weight: 800; }
  .chip.empty { color: var(--text-muted); background: transparent; border-color: var(--card-border); }

  .section-hd { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 8px; }
  .section-hd b { font-size: 15px; color: var(--text-primary); }
  .section-hd span { color: var(--text-muted); font-size: 12px; }

  .items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-bottom: 90px; }
  .item { min-height: 96px; padding: 10px 4px 8px; border-radius: 14px; background: var(--card-bg); border: 1px solid var(--card-border); text-align: center; position: relative; overflow: hidden; transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease; box-shadow: var(--shadow-sm); }
  .item:active { transform: scale(.96); }
  .item.selected { border-color: var(--hupu-red); background: rgba(224,35,43,.04); box-shadow: 0 0 0 1px var(--hupu-red), var(--shadow-sm); }
  .item.disabled { opacity: .35; }
  .emoji { font-size: 26px; line-height: 1.1; margin-bottom: 4px; }
  .item-name { font-size: 11px; font-weight: 800; line-height: 1.3; min-height: 28px; display: flex; align-items: center; justify-content: center; color: var(--text-primary); overflow-wrap: break-word; word-break: break-word; hyphens: auto; padding: 0 2px; }
  .check { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--hupu-red); color: #fff; font-size: 11px; display: none; align-items: center; justify-content: center; font-weight: 1000; }
  .selected .check { display: flex; }
  .item-score { display: inline-flex; margin-top: 6px; padding: 3px 7px; border-radius: 999px; background: rgba(224,35,43,.08); color: var(--hupu-red); font-size: 11px; font-weight: 900; }
  .selected .item-score { background: rgba(224,35,43,.18); }

  .bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; gap: 10px; box-shadow: 0 -2px 12px rgba(0,0,0,.04); }
  .bottom-bar .primary-btn { flex: 1; width: auto; min-height: 48px; font-size: 14px; white-space: nowrap; }
  .bottom-bar .ghost-btn { min-width: 64px; min-height: 48px; padding: 0 12px; font-size: 13px; }

  .loading { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .loader { width: 100px; height: 100px; border-radius: 28px; background: var(--card-bg); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; font-size: 48px; box-shadow: var(--shadow-lg); animation: float 1.2s ease-in-out infinite alternate; }
  @keyframes float { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-10px) rotate(4deg); } }
  .loading h2 { margin: 20px 0 6px; font-size: 22px; color: var(--text-primary); }
  .loading p { margin: 0; color: var(--text-secondary); line-height: 1.7; font-size: 14px; }
  .dots::after { content: ""; animation: dots 1.2s infinite; }
  @keyframes dots { 0% { content: ""; } 33% { content: "."; } 66% { content: ".."; } 100% { content: "..."; } }

  .result-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; min-height: 0; }
  .result-card { border-radius: 22px; background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--shadow-md); overflow: visible; }
  .result-head { padding: 18px 18px 14px; background: linear-gradient(135deg, rgba(224,35,43,.08), rgba(255,107,53,.05)); display: flex; align-items: flex-end; gap: 14px; position: relative; overflow: visible; border-radius: 22px 22px 0 0; }
  .result-head::before { content: ''; position: absolute; top: -50%; right: -20%; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(224,35,43,.04), transparent); pointer-events: none; }
  .result-head-inner { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding-bottom: 4px; }
  .player-portrait { width: 100px; height: 140px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-top: -100px; margin-bottom: -10px; position: relative; filter: drop-shadow(0 8px 20px rgba(0,0,0,.20)); z-index: 1; }
  .player-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .small-tag { display: none; }
  .player-name { margin: 10px 0 6px; font-size: clamp(28px, 10vw, 48px); line-height: 1.05; font-weight: 1000; letter-spacing: -1.5px; color: var(--text-primary); overflow-wrap: break-word; word-break: break-word; }
  .result-rank { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--text-secondary); font-size: 13px; margin-top: 6px; }
  .result-rank b { color: var(--hupu-red); font-size: 22px; }
  .result-body { padding: 14px 16px 18px; }
  .result-title { font-size: 15px; font-weight: 1000; margin-bottom: 6px; color: var(--text-primary); line-height: 1.4; overflow-wrap: break-word; word-break: break-word; }
  .comment { color: var(--text-secondary); line-height: 1.65; font-size: 14px; }
  .offer-list { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
  .reaction { margin-top: 12px; padding: 12px; border-radius: 14px; background: #fafafa; border: 1px solid var(--card-border); color: var(--text-secondary); line-height: 1.55; font-size: 13px; }
  .score-item { padding: 14px 0; border-bottom: 1px solid var(--card-border); }
  .score-item:last-child { border-bottom: none; }
  .score-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .score-emoji { font-size: 24px; width: 36px; text-align: center; }
  .score-name { font-size: 14px; font-weight: 800; flex: 1; color: var(--text-primary); }
  .score-badge { display: inline-flex; align-items: center; gap: 2px; padding: 4px 10px; border-radius: 999px; font-size: 16px; font-weight: 1000; letter-spacing: -.3px; }
  .score-badge.high { background: linear-gradient(135deg, #ffd700, #ffb347); color: #5a3e00; }
  .score-badge.mid { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: #fff; }
  .score-badge.low { background: linear-gradient(135deg, #ff6b6b, #c0392b); color: #fff; }
  .score-tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #f0f0f0; color: var(--text-secondary); font-weight: 700; }
  .score-analysis { font-size: 13px; line-height: 1.55; color: var(--text-secondary); margin-top: 4px; }

  .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%) translateY(20px); z-index: 99; opacity: 0; pointer-events: none; background: rgba(0,0,0,.82); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; transition: .22s ease; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 380px) {
    .items { gap: 6px; }
    .item { min-height: 88px; padding: 8px 3px 6px; }
    .item-name { font-size: 10px; min-height: 24px; }
    .emoji { font-size: 22px; }
  }
  @media (max-width: 359px) {
    .items { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .item { min-height: 82px; padding: 8px 6px 6px; }
    .item-name { font-size: 11px; min-height: 26px; }
    .emoji { font-size: 24px; }
  }
  @media (max-height: 640px) {
    .screen { padding-top: 8px; padding-left: 10px; padding-right: 10px; }
    .hero { justify-content: flex-start; padding-top: 10px; }
    .title { font-size: 30px; }
    .fun-card { padding: 10px; margin-top: 4px; margin-bottom: 10px; }
    .items { gap: 6px; padding-bottom: 80px; }
    .item { min-height: 78px; padding: 6px 3px 5px; }
    .item-name { font-size: 10px; min-height: 22px; }
    .emoji { font-size: 20px; }
  }

    // Fisher-Yates 洗牌算法
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

      selItems.forEach(item => {

          assoc[p]++;

      });

    function uploadToOSS(file, filename) {
      return new Promise((resolve, reject) => {
        // 1) ColorboxAI API

          window.ColorboxAI.oss.uploadFile({ file, filename })

          return;

        // 2) postMessage Bridge（作为 iframe 运行在 Colorbox Shell 中）
        if (window.parent && window.parent !== window) {
          const callbackId = '_cb_up_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
          const timer = setTimeout(() => { cleanup(); reject(new Error('上传超时')); }, 30000);
          const handler = e => {
            const d = e.data;
            if (d && d.protocol === 'colorbox-ai-bridge' && d.type === 'oss.upload.callback' && d.payload && d.payload.callbackId === callbackId) {
              clearTimeout(timer); cleanup();
              d.payload.error ? reject(new Error(d.payload.error)) : resolve(d.payload.downloadUrl || '');
            }
          };
          const cleanup = () => window.removeEventListener('message', handler);
          window.addEventListener('message', handler);
          window.parent.postMessage({
            protocol: 'colorbox-ai-bridge', version: 1, direction: 'frame-to-host',
            type: 'oss.upload',
            payload: { file, filename, callbackId }
          }, '*');
          return;
        }
        // 3) 直连 KaleidoOSS（独立运行时）
        const client = getOssClient();
        if (client) {
          const ext = filename.lastIndexOf('.') >= 0 ? filename.slice(filename.lastIndexOf('.')) : '.png';

    // ─── 工具：dataURL → Blob ───
    function dataURLToBlob(dataURL) {
      const parts = dataURL.split(',');
      const mime = parts[0].match(/:(.*?);/)[1];
      const bstr = atob(parts[1]);
      const n = bstr.length;
      const u8arr = new Uint8Array(n);
      for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
      return new Blob([u8arr], { type: mime });
    }

    function roundRectC(ctx, x, y, w, h, r) {

      ctx.quadraticCurveTo(x + w, y, x + w, y + r);

      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(headX, headTop, headW, headH);



      // ── 头像（矩形+圆角，不下圆形裁剪） ──
      const portLeft = headPadL;
      const portTop = headTop + headPadT - portOverlap + 20; // 向下移20px
      const portRadius = 16; // 圆角
      // 头像阴影+圆角矩形底色
      ctx.shadowColor = 'rgba(0,0,0,.20)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 10;
      ctx.fillStyle = '#f0f0f0';
      roundRectC(ctx, portLeft, portTop, portW, portH, portRadius);
      ctx.fill();
      // 圆角矩形裁剪绘制头像
      ctx.save();
      roundRectC(ctx, portLeft, portTop, portW, portH, portRadius);
      ctx.clip();
      ctx.shadowColor = 'transparent';
      // 从 DOM 获取已加载的 img 元素
      const domPortrait = document.getElementById('playerPortrait');
      const domImg = domPortrait ? domPortrait.querySelector('img') : null;
      if (domImg && domImg.complete && domImg.naturalWidth > 0) {
        // object-fit: cover 效果：取中心区域
        const iw = domImg.naturalWidth, ih = domImg.naturalHeight;
        const cr = portW / portH;
        const ir = iw / ih;
        let sx, sy, sw, sh;
        if (ir > cr) {
          sh = ih;
          sw = ih * cr;
          sx = (iw - sw) / 2;
          sy = 0;
        } else {
          sw = iw;
          sh = iw / cr;
          sx = 0;
          sy = (ih - sh) / 2;
        }
        ctx.drawImage(domImg, sx, sy, sw, sh, portLeft, portTop, portW, portH);
      } else {
        // 兜底 emoji
        ctx.font = '44px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#1a1a1a';
        ctx.fillText('🏀', portLeft + portW / 2, portTop + portH / 2 + 2);
      }
      ctx.restore(); // 解除头像裁剪
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;

      // ── 球员名称 ── 与头像底部对齐，gap:14px
      const nameLeft = portLeft + portW + 14;
      // 名称底部与 head 内容区底部对齐（减去 paddingBottom 后的底部）
      const contentBottom = headBottom - headPadB;
      const nameBaseline = contentBottom - nameMarginB; // 底部基线
      ctx.fillStyle = '#1a1a1a';
      ctx.font = 'bold 46px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText(r.player || '---', nameLeft, nameBaseline + 2);

      // ════════════════════════════════════
      //   result-body
      // ════════════════════════════════════
      const bodyPadL = 16, bodyPadR = 16, bodyPadT = 14, bodyPadB = 18;
      const bodyX = cardX + bodyPadL;
      const bodyY = headBottom + bodyPadT;
      const bodyW = cardW - bodyPadL - bodyPadR;
      let cursorY = bodyY;

      // ── result-title ──
      ctx.fillStyle = '#1a1a1a';
      ctx.font = 'bold 20px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      const titleLines = breakText(ctx, r.title || '---', bodyW);
      titleLines.forEach((line, i) => {
        ctx.fillText(line, bodyX, cursorY + i * 28);
      });
      cursorY += titleLines.length * 28 + 10;

      // ── comment ──
      ctx.fillStyle = '#888';
      ctx.font = '18px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      const commentLines = breakText(ctx, r.comment || '---', bodyW);
      commentLines.forEach((line, i) => {
        ctx.fillText(line, bodyX, cursorY + i * 26);
      });
      cursorY += commentLines.length * 26 + 16;

      // ── offer-list chips（水平排列，自动换行） ──
      const chips = (r.selectedNames || []);
      const chipH = 32;
      const chipGap = 8;
      const chipPadLR = 14;
      const labelGap = 10;
      const chipX = bodyX;
      const maxChipRight = bodyX + bodyW;
      ctx.font = 'bold 16px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      // ── 报价筹码标签 ──
      ctx.fillStyle = '#666';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const labelText = '报价筹码';
      const labelWidth = ctx.measureText(labelText).width;
      const chipStartXBase = chipX + labelWidth + labelGap;
      let chipStartX = chipStartXBase;
      let chipCenterY = cursorY + chipH / 2;

      // 先画标签（仅第一次）
      ctx.fillText(labelText, chipX, chipCenterY);

      // 固定布局：每行最多放 2 个 chip
      const perRow = 2;
      // 用 DOM 测量纯文本宽度 + emoji 固定宽度（兼容 iOS emoji 测量不准的问题）
      const measurer = document.createElement('span');
      measurer.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font:bold 16px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      document.body.appendChild(measurer);
      const emojiRe = /\p{Emoji}/gu;
      chips.forEach((name, idx) => {
        const emojiCount = (name.match(emojiRe) || []).length;
        const textOnly = name.replace(emojiRe, '').trim();
        measurer.textContent = textOnly || ' ';
        const textW = measurer.offsetWidth;
        const chipW = textW + emojiCount * 22 + chipPadLR * 2;
        const chipR = chipH / 2;

        // 每行 perRow 个，换行重置
        if (idx > 0 && idx % perRow === 0) {
          cursorY += chipH + chipGap;
          chipStartX = chipStartXBase;
          chipCenterY = cursorY + chipH / 2;
        }

        // chip 背景（淡红渐变）
        const grad = ctx.createLinearGradient(chipStartX, cursorY, chipStartX, cursorY + chipH);
        grad.addColorStop(0, '#fecaca');
        grad.addColorStop(1, '#fca5a5');
        ctx.fillStyle = grad;
        roundRectC(ctx, chipStartX, cursorY, chipW, chipH, chipR);
        ctx.fill();

        // chip 边框光晕
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1;
        roundRectC(ctx, chipStartX, cursorY, chipW, chipH, chipR);
        ctx.stroke();

        // chip 文字
        ctx.fillStyle = '#991b1b';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(name, chipStartX + chipW / 2, chipCenterY);

        chipStartX += chipW + chipGap;
      });
      document.body.removeChild(measurer);
      cursorY += chipH + 14;

      // ── reaction ──
      if (r.reaction) {
        const reactW = bodyW;
        // reaction 高度自适应
        ctx.font = '17px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
        const reactLines = breakText(ctx, r.reaction, reactW - 24);
        const lineH = 26;
        const textH = Math.min(reactLines.length, 3) * lineH;
        const reactPad = 12;
        const reactH = textH + reactPad * 2;

        ctx.fillStyle = '#fafafa';
        roundRectC(ctx, bodyX, cursorY, reactW, reactH, 14);
        ctx.fill();
        ctx.strokeStyle = '#e8e8e8';
        ctx.lineWidth = 1;
        roundRectC(ctx, bodyX, cursorY, reactW, reactH, 14);
        ctx.stroke();

        ctx.fillStyle = '#888';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        reactLines.slice(0, 3).forEach((line, i) => {
          ctx.fillText(line, bodyX + reactPad, cursorY + reactPad + i * lineH);
        });
        cursorY += reactH + 14;
      }

      ctx.restore(); // 解除 clip

      // ── 水印 ──
      ctx.fillStyle = '#bbb';
      ctx.font = '12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('NBA离谱报价模拟器 · 虎扑JRs出品', w / 2, h - 54);
    }

    // ─── 文字自动换行：返回行数组 ───
    function breakText(ctx, text, maxWidth) {
      if (!text) return [''];
      const lines = [];
      let line = '';
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line.length > 0) {
          lines.push(line);
          line = ch;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      return lines.length ? lines : [''];
    }

    // ─── 生成海报（预览） ───
    function generatePoster() {
      const canvas = createPosterCanvas();
      const img = document.getElementById('posterPreviewImg');
      img.src = canvas.toDataURL('image/png');
      document.getElementById('posterOverlay').classList.add('active');
    }

    function closePoster() {
      resetShareBtn();
      document.getElementById('posterOverlay').classList.remove('active');
    }

    function resetShareBtn() {
      const btn = document.querySelector('#posterOverlay .btn-share');
      if (btn) { btn.disabled = false; btn.textContent = '📤 一键发帖'; }
    }

    // ─── 统一跳转工具 ───
    function safeNavigate(url, target) {
      if (window.ColorboxAI && typeof window.ColorboxAI.track === 'function') {
        try { window.ColorboxAI.track({ event: 'navigate', url: url, target: target || '_blank' }); } catch (_) {}
      }
      if (window.ColorboxAI && typeof window.ColorboxAI.navigateTo === 'function') {
        return window.ColorboxAI.navigateTo(url, target || '_blank');
      }
      if (window.ColorboxAI && typeof window.ColorboxAI.openUrl === 'function') {
        return window.ColorboxAI.openUrl(url);
      }
      window.open(url, target || '_blank');
    }

    // ─── 一键发帖 ───
    let _posterUploadPromise = null;

    function sharePoster(btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>上传中...';
      const canvas = createPosterCanvas();
      (async () => {
        try {
          const dataURL = canvas.toDataURL('image/png');
          const blob = dataURLToBlob(dataURL);
          const url = await uploadToOSS(blob, `NBA离谱报价_${Date.now()}.png`);
          const imageUrl = url || '';
          const initialValue = {
            syncPost: true,
            appJsonV3: {
              activeTab: 'thread',
              data: {
                title: '',
                imageList: imageUrl ? [imageUrl] : [],
                content: '',
              },
            },
          };
          const tagName = encodeURIComponent('NBA离谱报价模拟器');
          const link = `huputiyu://bbs/postImg?tagName=${tagName}&tagId=147772&topicName=${encodeURIComponent('湿乎乎的话题')}&topicId=177&initialValue=${encodeURIComponent(JSON.stringify(initialValue))}`;
          safeNavigate(link);
        } catch (e) {
          console.error('发帖失败', e);
          // 降级：不带图纯文字发帖
          const initialValue = {
            syncPost: true,
            appJsonV3: {
              activeTab: 'thread',
              data: {
                title: '',
                imageList: [],
                content: '',
              },
            },
          };
          const tagName = encodeURIComponent('NBA离谱报价模拟器');
          const link = `huputiyu://bbs/postImg?tagName=${tagName}&tagId=147772&topicName=${encodeURIComponent('湿乎乎的话题')}&topicId=177&initialValue=${encodeURIComponent(JSON.stringify(initialValue))}`;
          safeNavigate(link);
        } finally {
          btn.disabled = false;
          btn.textContent = '📤 一键发帖';
        }
      })();
    }
  </script>
