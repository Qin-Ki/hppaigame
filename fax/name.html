<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NBA离谱报价模拟器 - 虎扑</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background: #f5f5f5; color: #1a1a1a; }
  body { overflow-x: hidden; }

  :root {
    --hupu-red: #e0232b;
    --hupu-orange: #ff6b35;
    --hupu-gold: #ffb347;
    --hupu-blue: #246bfe;
    --hupu-bg: #f5f5f5;
    --card-bg: #ffffff;
    --card-border: #e8e8e8;
    --text-primary: #1a1a1a;
    --text-secondary: #888;
    --text-muted: #aaa;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,.10);
  }

  .hupu-header { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 0 2px; }
  .hupu-header img { width: 22px; height: 22px; border-radius: 4px; }
  .hupu-header span { font-size: 13px; font-weight: 700; color: var(--text-secondary); letter-spacing: .3px; }

  .app { width: 100%; min-height: 100vh; background: var(--hupu-bg); position: relative; overflow: hidden; }

  .screen { display: none; min-height: 100vh; padding: 16px 14px 20px; position: relative; z-index: 2; }
  .screen.active { display: flex; flex-direction: column; }

  .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 10px 0 30px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid var(--hupu-red); background: rgba(224,35,43,.06); border-radius: 999px; color: var(--hupu-red); font-size: 12px; font-weight: 800; letter-spacing: .3px; }
  .title { margin: 14px 0 6px; font-size: clamp(36px, 10vw, 52px); line-height: 1; font-weight: 1000; letter-spacing: -1.5px; }
  .title span { display: block; color: var(--text-primary); }
  .title .highlight { background: linear-gradient(135deg, var(--hupu-red), var(--hupu-orange)); -webkit-background-clip: text; color: transparent; }
  .subtitle { max-width: 300px; color: var(--text-secondary); line-height: 1.6; font-size: 14px; margin: 8px auto 22px; }
  .fun-card { width: min(340px, 92vw); border: 1px solid var(--card-border); border-radius: 18px; background: var(--card-bg); box-shadow: var(--shadow-md); padding: 16px; margin: 10px auto 22px; text-align: left; }
  .fax { display: flex; gap: 10px; align-items: center; color: var(--text-primary); font-weight: 800; font-size: 15px; }
  .fax-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--hupu-red), var(--hupu-orange)); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 6px 16px rgba(224,35,43,.22); flex-shrink: 0; }
  .fax-icon img { width: 22px; height: 22px; border-radius: 3px; }
  .quote { color: var(--text-secondary); margin-top: 10px; font-size: 12px; line-height: 1.6; }

  button { border: none; color: #fff; font-weight: 800; cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent; outline: none; }
  button:active { opacity: .88; }
  .primary-btn { width: min(340px, 92vw); min-height: 50px; border-radius: 14px; background: linear-gradient(135deg, var(--hupu-red), var(--hupu-orange)); box-shadow: 0 8px 24px rgba(224,35,43,.28); font-size: 17px; letter-spacing: .5px; }
  .ghost-btn { min-height: 44px; padding: 0 16px; border-radius: 14px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-primary); font-size: 14px; box-shadow: var(--shadow-sm); }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; padding-top: 4px; }
  .page-title { font-size: 20px; font-weight: 1000; color: var(--text-primary); letter-spacing: -.3px; }
  .limit { color: var(--hupu-red); font-size: 12px; font-weight: 800; background: rgba(224,35,43,.08); border: 1px solid rgba(224,35,43,.18); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }

  .offer-panel { position: sticky; top: 0; z-index: 10; padding: 12px; margin: 0 -2px 10px; border: 1px solid var(--card-border); border-radius: 18px; background: var(--card-bg); box-shadow: var(--shadow-md); }
  .selected-list { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .selected-list::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: rgba(224,35,43,.07); color: var(--hupu-red); border: 1px solid rgba(224,35,43,.15); font-size: 12px; font-weight: 800; }
  .chip.empty { color: var(--text-muted); background: transparent; border-color: var(--card-border); }

  .section-hd { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 8px; }
  .section-hd b { font-size: 15px; color: var(--text-primary); }
  .section-hd span { color: var(--text-muted); font-size: 12px; }

  .items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-bottom: 80px; }
  .item { min-height: 100px; padding: 12px 6px 10px; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--card-border); text-align: center; position: relative; overflow: hidden; transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease; box-shadow: var(--shadow-sm); }
  .item:active { transform: scale(.96); }
  .item.selected { border-color: var(--hupu-red); background: rgba(224,35,43,.04); box-shadow: 0 0 0 1px var(--hupu-red), var(--shadow-sm); }
  .item.disabled { opacity: .35; }
  .emoji { font-size: 28px; line-height: 1.1; margin-bottom: 6px; }
  .item-name { font-size: 12px; font-weight: 800; line-height: 1.25; min-height: 30px; display: flex; align-items: center; justify-content: center; color: var(--text-primary); }
  .check { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--hupu-red); color: #fff; font-size: 11px; display: none; align-items: center; justify-content: center; font-weight: 1000; }
  .selected .check { display: flex; }
  .item-score { display: inline-flex; margin-top: 6px; padding: 3px 7px; border-radius: 999px; background: rgba(224,35,43,.08); color: var(--hupu-red); font-size: 11px; font-weight: 900; }
  .selected .item-score { background: rgba(224,35,43,.18); }

  .bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; gap: 10px; box-shadow: 0 -2px 12px rgba(0,0,0,.04); }
  .bottom-bar .primary-btn { flex: 1; width: auto; min-height: 48px; font-size: 15px; }
  .bottom-bar .ghost-btn { width: 80px; min-height: 48px; }

  .loading { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .loader { width: 100px; height: 100px; border-radius: 28px; background: var(--card-bg); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; font-size: 48px; box-shadow: var(--shadow-lg); animation: float 1.2s ease-in-out infinite alternate; }
  @keyframes float { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-10px) rotate(4deg); } }
  .loading h2 { margin: 20px 0 6px; font-size: 22px; color: var(--text-primary); }
  .loading p { margin: 0; color: var(--text-secondary); line-height: 1.7; font-size: 14px; }
  .dots::after { content: ""; animation: dots 1.2s infinite; }
  @keyframes dots { 0% { content: ""; } 33% { content: "."; } 66% { content: ".."; } 100% { content: "..."; } }

  .result-wrap { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .result-card { border-radius: 22px; background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--shadow-md); overflow: hidden; }
  .result-head { padding: 16px 18px 12px; background: linear-gradient(135deg, rgba(224,35,43,.08), rgba(255,107,53,.05)); }
  .small-tag { display: inline-flex; padding: 5px 10px; border-radius: 999px; background: var(--hupu-red); color: #fff; font-weight: 800; font-size: 11px; }
  .player-name { margin: 10px 0 6px; font-size: clamp(32px, 10vw, 48px); line-height: 1.05; font-weight: 1000; letter-spacing: -1.5px; color: var(--text-primary); }
  .result-rank { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--text-secondary); font-size: 13px; margin-top: 6px; }
  .result-rank b { color: var(--hupu-red); font-size: 22px; }
  .result-body { padding: 14px 18px 18px; }
  .result-title { font-size: 18px; font-weight: 1000; margin-bottom: 6px; color: var(--text-primary); }
  .comment { color: var(--text-secondary); line-height: 1.65; font-size: 14px; }
  .offer-list { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
  .reaction { margin-top: 12px; padding: 12px; border-radius: 14px; background: #fafafa; border: 1px solid var(--card-border); color: var(--text-secondary); line-height: 1.55; font-size: 13px; }
  .score-item { padding: 14px 0; border-bottom: 1px solid var(--card-border); }
  .score-item:last-child { border-bottom: none; }
  .score-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .score-emoji { font-size: 24px; width: 36px; text-align: center; }
  .score-name { font-size: 14px; font-weight: 800; flex: 1; color: var(--text-primary); }
  .score-badge { display: inline-flex; align-items: center; gap: 2px; padding: 4px 10px; border-radius: 999px; font-size: 16px; font-weight: 1000; letter-spacing: -.3px; }
  .score-badge.high { background: linear-gradient(135deg, #ffd700, #ffb347); color: #5a3e00; }
  .score-badge.mid { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: #fff; }
  .score-badge.low { background: linear-gradient(135deg, #ff6b6b, #c0392b); color: #fff; }
  .score-tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #f0f0f0; color: var(--text-secondary); font-weight: 700; }
  .score-analysis { font-size: 13px; line-height: 1.55; color: var(--text-secondary); margin-top: 4px; }

  .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%) translateY(20px); z-index: 99; opacity: 0; pointer-events: none; background: rgba(0,0,0,.82); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; transition: .22s ease; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 380px) {
    .items { gap: 8px; }
    .item { min-height: 88px; padding: 10px 4px 8px; }
    .item-name { font-size: 11px; }
    .emoji { font-size: 24px; }
  }
  @media (max-height: 640px) {
    .screen { padding-top: 10px; }
    .hero { justify-content: flex-start; padding-top: 14px; }
    .title { font-size: 34px; }
    .fun-card { padding: 12px; margin-top: 4px; margin-bottom: 12px; }
    .item { min-height: 84px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="hupu-header">
      <img src="https://i3.hoopchina.com.cn/newsPost/de00f9a83014c2b3196d831d4be1adb9_w_300_h_300_.png" alt="虎扑">

            <div id="comment" class="comment">---</div>
            <div id="resultOfferList" class="offer-list"></div>
            <div id="reaction" class="reaction">---</div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast">已复制</div>

  <script>

    const playerMap = {};
    items.forEach(item => {
      item.players.forEach(p => {
        if (!playerMap[p]) playerMap[p] = { count: 0, items: [] };

        playerMap[p].items.push(item.name);

      const set = new Set();
      items.forEach(item => {
        item.players.forEach(p => {
          if (p !== '随机') set.add(p);
        });
      });
      return [...set];

    const ALL_PLAYERS = getAllNormalPlayers();

    ];

    const selected = new Set();
    let lastResult = null;

    function $(id) { return document.getElementById(id); }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      $(id).classList.add('active');
      window.scrollTo(0, 0);
    }

    function goStart() { showScreen('startScreen'); }
    function goPick(reset = false) {
      if (reset) selected.clear();
      showScreen('pickScreen');
      renderItems();
      updateOffer();
    }

    function renderItems() {
      $('items').innerHTML = items.map(item => {
        const isSelected = selected.has(item.id);
        const isDisabled = !isSelected && selected.size >= MAX_SELECT;
        const playerTags = item.players.map(p =>
          `<span style="font-size:10px;color:rgba(255,255,255,.5);display:inline-block;">${p}</span>`
        ).join('');
        return `
          <button class="item ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}" onclick="toggleItem('${item.id}')">
            <span class="check">✓</span>
            <div class="emoji">${item.emoji}</div>
            <div class="item-name">${item.name}</div>
          </button>`;
      }).join('');
    }

    function toggleItem(id) {
      if (selected.has(id)) selected.delete(id);
      else {
        if (selected.size >= MAX_SELECT) return toast('最多只能选 3 样道具');
        selected.add(id);
      }
      renderItems();
      updateOffer();
    }

    function clearItems() {
      selected.clear();
      renderItems();
      updateOffer();
    }

    function selectedItems() {
      return items.filter(i => selected.has(i.id));
    }

    // ========== 核心算法：计算每个球员的关联度 ==========
    function computeAssociations() {
      const selItems = selectedItems();
      const assoc = {};
      selItems.forEach(item => {
        item.players.forEach(p => {
          if (!assoc[p]) assoc[p] = 0;
          assoc[p]++;
        });
      });
      return assoc;
    }

    // 最高关联度
    function maxAssociation() {
      const assoc = computeAssociations();
      let max = 0;
      for (const p in assoc) {
        if (assoc[p] > max) max = assoc[p];
      }
      return max;
    }

    function updateOffer() {
      $('countText').textContent = selected.size;
      const list = selectedItems();
      $('selectedList').innerHTML = list.length
        ? list.map(i => `<span class="chip">${i.emoji} ${i.name}</span>`).join('')
        : '<span class="chip empty">还没放东西</span>';
    }

    function randomFrom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function submitOffer() {
      if (!selected.size) return toast('先放点东西进去');
      showScreen('loadingScreen');
      const texts = ['正在拨通总经理热线', '正在翻阅球员交易记录', 'Woj正在核实消息', 'Shams正在跟进'];
      let idx = 0;
      $('loadingText').textContent = texts[0];
      const timer = setInterval(() => {
        idx = (idx + 1) % texts.length;
        $('loadingText').textContent = texts[idx];
      }, 520);
      setTimeout(() => {
        clearInterval(timer);
        createResult();
        showScreen('resultScreen');
      }, 1700);
    }

      return itemStories[itemId] || { tag: '🎁', lines: ['这是一个神秘的交易筹码。没人知道它为什么会出现在这里，但它确实促成了一笔交易。'], reacts: ['总经理：这个筹码...很有创意。我签了。'] };
    }

    function createResult() {
      const assoc = computeAssociations();
      const selItems = selectedItems();
      const hasRandomItem = selected.has('murray');

      let maxAssoc = 0;
      let topPlayers = [];
      for (const p in assoc) {
        if (assoc[p] > maxAssoc) maxAssoc = assoc[p];
      }
      for (const p in assoc) {
        if (assoc[p] === maxAssoc) topPlayers.push(p);
      }
      topPlayers = topPlayers.filter(p => p !== '随机');

      let player;
      if (topPlayers.length === 0) {
        player = randomFrom(ALL_PLAYERS);
      } else if (hasRandomItem && Math.random() < 0.3) {
        player = randomFrom(ALL_PLAYERS);
      } else {
        player = randomFrom(topPlayers);
      }

      const selectedNames = selItems.map(i => `${i.emoji} ${i.name}`);

      // 根据选中的道具生成文案，并替换{player}为实际匹配的球员
      const starItem = randomFrom(selItems);
      const story = getItemStory(starItem.id);
      const itemListStr = selItems.map(i => i.name).join('、');
      function replacePlayer(text) { return text.replace(/\{player\}/g, player); }

      const titlePool = [
        `你用了${itemListStr}换来了${player}！`,
        `交易达成：${itemListStr} → ${player}`,
        `离谱！${itemListStr}居然换到了${player}`,
        `用${itemListStr}换${player}？这交易我打满分！`
      ];

      lastResult = {
        player,
        title: randomFrom(titlePool),
        comment: replacePlayer(randomFrom(story.lines)),
        reaction: replacePlayer(randomFrom(story.reacts)),
        selectedNames,
        tag: `${story.tag} ${player}`
      };

      renderResult();
    }

    function renderResult() {
      const r = lastResult;
      $('specialTag').textContent = r.tag;
      $('playerName').textContent = r.player;
      $('resultTitle').textContent = r.title;
      $('comment').textContent = r.comment;
      $('reaction').textContent = r.reaction;
      $('resultOfferList').innerHTML = r.selectedNames.map(name => `<span class="chip">${name}</span>`).join('');
    }

    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    // 预渲染
    renderItems();
    updateOffer();
  </script>
