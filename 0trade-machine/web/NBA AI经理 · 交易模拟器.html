<!DOCTYPE html>
<!-- saved from url=(0034)https://ciyuannav.com/nba-trade/?v -->
<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NBA AI经理 · 交易模拟器</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Hanken+Grotesk:wght@400;600;700;800&amp;family=Sora:wght@400;600;700&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<meta name="cache-control" content="no-cache">
<meta name="pragma" content="no-cache">
<meta name="expires" content="0">
<link rel="stylesheet" href="./NBA AI经理 · 交易模拟器_files/css/style.css">
</head>
<body>

<div id="app">
  <nav class="top-nav" id="top-nav">
    <button class="top-nav-logo" id="btn-home" type="button">
      <span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">sports_basketball</span>
      <span class="top-nav-title">NBA AI经理</span>
    </button>
    <div class="top-nav-links">
      <button class="top-nav-link active" data-tab="trade" type="button">
        <span class="material-symbols-outlined">swap_horiz</span>
        <span>交易</span>
      </button>
    </div>
    <div class="top-nav-actions">
    </div>
  </nav>

  <main class="main-content">
    <div class="tab-panel active" id="tab-trade">
      <div class="trade-bar" id="trade-bar">
        <div class="trade-bar-teams" id="trade-bar-teams"><div class="trade-bar-team-card add-card" onclick="openTeamModal()"><span class="material-symbols-outlined" style="font-size:24px;">add</span><span>添加球队</span></div></div>
      </div>
      <div class="team-panel-container" id="team-panel-container"><div class="panels-empty"><span class="material-symbols-outlined" style="font-size:48px;color:var(--outline-variant);display:block;margin-bottom:12px;">swap_horiz</span>请点击上方「+ 添加球队」开始构建交易</div></div>
    </div>
  </main>

  <button class="check-trade-fab" id="btn-check-trade" type="button" disabled="">
    <span class="material-symbols-outlined">analytics</span>
    <span>检查交易规则</span>
  </button>

  <div id="modal-trade-result" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="trade-result-modal-card">
      <div class="trade-result-modal-head">
        <h3>
          <span class="material-symbols-outlined">analytics</span>
          交易检查结果
        </h3>
        <button class="modal-close" id="modal-trade-result-close" type="button" aria-label="关闭">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="trade-result-modal-body" id="trade-result-modal-body"></div>
      <div class="trade-result-modal-footer">
        <button class="action-btn danger-btn" id="btn-reset" type="button">
          <span class="material-symbols-outlined">refresh</span>
          <span>重置交易</span>
        </button>
      </div>
    </div>
  </div>

</div>

<div id="modal-team" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <h3>选择球队</h3>
      <button class="modal-close" id="modal-team-close" type="button" aria-label="关闭">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="modal-body" id="modal-team-body"></div>
  </div>
</div>

<div id="modal-dest" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modal-dest-title">选择目标球队</h3>
      <button class="modal-close" id="modal-dest-close" type="button" aria-label="关闭">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="modal-body" id="modal-dest-body"></div>
  </div>
</div>


<div id="modal-salary-chart" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="salary-chart-card">
    <div class="salary-chart-head">
      <h3 id="salary-chart-title">球员薪资</h3>
      <button class="modal-close" id="modal-salary-chart-close" type="button" aria-label="关闭">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="salary-chart-body">
      <div class="salary-chart-legend" id="salary-chart-legend"></div>
      <div class="salary-chart-canvas-wrap">
        <canvas id="salary-chart-canvas" width="500" height="260"></canvas>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="./NBA AI经理 · 交易模拟器_files/js/data.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/salary.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/player-options.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/draft-picks.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/stats-engine.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/ui.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/state.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/rules.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/team-list.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/render.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/home.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/content.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/team-detail.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/player-detail.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/game-results.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/rankings.js"></script>
<script src="./NBA AI经理 · 交易模拟器_files/js/app.js"></script>


</body></html>
