/* ========== PC Adaptation (>=1024px) ========== */
@media (min-width: 1024px) {
  /* Wider main content */
  .main-content {
    max-width: 1400px;

  }

  /* Multi-panel layout: show all team panels side by side */
  .panels-scroll.multi-panel {
    display: flex;
    flex-wrap: nowrap;
    gap: var(--spacing-md);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: var(--spacing-sm);
    flex-direction: row;
  }

    flex: 0 0 380px;
    min-width: 320px;
    max-width: 420px;
  }

  /* Trade bar - more spacious */
  .trade-bar {
    padding: 14px 16px;
  }

  }

  .player-list-header {
    padding: 8px 16px;

    padding: 10px 16px;
  }

  .player-name {
    font-size: 15px;

    left: auto;
    transform: none;
    padding: 14px 28px;
    font-size: 15px;
    box-shadow: 0 6px 24px -2px rgba(200, 16, 46, 0.35);
  }

  .check-trade-fab:active {

  }

  .check-trade-fab:disabled {
    background: var(--surface-container-high);
    color: var(--outline);
    box-shadow: none;
    cursor: not-allowed;
    filter: none;
  }

    align-items: center;

    border-radius: var(--radius-lg);

  .modal-team-grid {
    grid-template-columns: 1fr 1fr;

  .modal-card {
    max-width: 700px;

    max-width: 480px;

    padding: 12px 16px;

    font-size: 16px;

  }

    flex-direction: row;
    padding: 0;
  }

    padding: 10px 24px;
  }

<script>
/* UI Utilities */
function fmt(num) {
  if (num >= 1000000) return '$' + (num / 1000000).toFixed(1) + 'M';
  if (num >= 1000) return '$' + (num / 1000).toFixed(0) + 'K';
  return '$' + num;
}
function fmtFull(num) { return '$' + num.toLocaleString('en-US'); }
function showToast(msg, type) {
  type = type || 'info';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(function() { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(function() { el.remove(); }, 300); }, 2500);
}
function showModal(id) { var el = document.getElementById(id); if (!el) return; el.classList.add('active'); el.setAttribute('aria-hidden', 'false'); }
function hideModal(id) { var el = document.getElementById(id); if (!el) return; el.classList.remove('active'); el.setAttribute('aria-hidden', 'true'); }
function hideAllModals() { document.querySelectorAll('.modal-overlay').forEach(function(m) { hideModal(m.id); }); }
function restrictionLabel(type) { var map = { ntc:'交易否决权', poison_pill:'毒丸条款（薪资匹配取均值）', recently_signed:'近期签约限制', trade_kicker:'交易保证金' }; return map[type] || '交易限制'; }
function getShortName(team, maxLen) { maxLen = maxLen || 4; if (team.shortName && team.shortName.length <= maxLen) return team.shortName; return team.name.substring(0, maxLen); }
function modalTeamRow(team, onClick, disabled) {
  return '<div class="modal-team-row' + (disabled ? ' disabled' : '') + '" data-team-id="' + team.id + '" role="button" tabindex="0">' +
    '<div class="modal-team-logo" style="background:' + team.color + ';">' + getShortName(team, 2) + '</div>' +
    '<span class="modal-team-name">' + team.name + '</span></div>';
}
</script>
