<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JRs雷霆vs马刺系列赛从夯到拉排行</title>
    <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.17.1.min.js"></script>
    <script src="https://activity-static.hoopchina.com.cn/colorbox-activities/js/kaleido-fed-sdk.js"></script>
    <style>
        :root {
            --bg-color: #090909;
            --panel-bg: rgba(20, 20, 22, 0.96);
            --row-bg: rgba(255, 255, 255, 0.055);
            --row-bg-hover: rgba(255, 255, 255, 0.085);
            --text-main: #ffffff;
            --text-muted: #a8a8a8;
            --gold: #ffcc33;
            --border-red: #CE1141;
            --border-yellow: #FDB927;
            --shadow-strong: 0 16px 40px rgba(0, 0, 0, 0.45);
            --shadow-soft: 0 8px 20px rgba(0, 0, 0, 0.28);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 14px 10px 24px;
            overflow-x: hidden;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at 20% 0%, rgba(206, 17, 65, 0.28), transparent 30%),
                radial-gradient(circle at 90% 15%, rgba(253, 185, 39, 0.20), transparent 28%),
                linear-gradient(180deg, #141414 0%, var(--bg-color) 58%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #header-area {
            width: 100%;
            padding: 6px 8px 10px;
            text-align: center;
        }

        h1 {
            margin: 10px 0 6px;
            font-size: clamp(1.15rem, 4.6vw, 1.55rem);
            line-height: 1.25;
            letter-spacing: 0.02em;
            color: var(--gold);
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.65);
        }

        .description {
            margin: 0 auto 12px;
            padding: 8px 12px;
            max-width: 560px;
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.55;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
        }

        #capture-area {
            position: relative;
            isolation: isolate;
            width: 100%;
            padding: 12px 8px;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 18px;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015)),
                #050505;
            box-shadow: var(--shadow-strong), inset 0 0 0 1px rgba(255, 255, 255, 0.035);
        }

        /*
            表格正中央图片层。
            图片链接请在 JS 顶部的 CENTER_TABLE_IMAGE_URL 中填写。
            层级设计：表格底色 < 中央图片 < 分区文字/头像；球员头像会压在该图片上方。
        */
        .center-table-image {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 1;
            display: none;
            width: min(46%, 260px);
            max-height: 62%;
            transform: translate(-50%, -50%);
            object-fit: contain;
            opacity: 0.24;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.72));
        }

        .tier-row {
            position: relative;
            display: flex;
            min-height: 92px;
            margin-bottom: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 13px;
            background: var(--row-bg);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
            transition: background-color 0.16s ease, transform 0.16s ease, border-color 0.16s ease;
        }

        .tier-row:last-child {
            margin-bottom: 0;
        }

        .tier-row:hover {
            background: var(--row-bg-hover);
            border-color: rgba(255, 255, 255, 0.16);
        }

        .tier-label {
            position: relative;
            z-index: 3;
            width: 68px;
            min-width: 68px;
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #080808;
            font-size: 16px;
            font-weight: 900;
            line-height: 1.15;
            text-align: center;
            letter-spacing: 0.04em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .dropzone {
            position: relative;
            z-index: 2;
            min-width: 0;
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            align-content: flex-start;
            gap: 10px;
            padding: 11px;
        }

        .tier-hang .tier-label { background: linear-gradient(180deg, #ff3b3b 0%, #df0000 100%); }
        .tier-top .tier-label { background: linear-gradient(180deg, #ffb347 0%, #ff8a00 100%); }
        .tier-superior .tier-label { background: linear-gradient(180deg, #fff85d 0%, #ffd900 100%); }
        .tier-npc .tier-label { background: linear-gradient(180deg, #fff6ef 0%, #ecd7c8 100%); }
        .tier-la .tier-label { background: linear-gradient(180deg, #ffffff 0%, #e8e8e8 100%); }

        #selection-zone {
            width: 100%;
            min-height: 152px;
            margin: 16px 0 0;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.035)),
                var(--panel-bg);
            box-shadow: var(--shadow-soft);
        }

        .status-info {
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 14px;
        }

        #active-player-wrapper {
            height: 124px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #active-player-container {
            width: 84px;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #selection-player-name {
            min-height: 20px;
            padding: 2px 10px;
            color: #f5f5f5;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .player {
            position: relative;
            z-index: 4;
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            border-radius: 50%;
            background: #333;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.48);
            transition: transform 0.14s ease, box-shadow 0.14s ease, outline-color 0.14s ease;
        }

        .player img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            border-radius: 50%;
        }

        .border-red {
            border: 3px solid var(--border-red);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.48), 0 0 0 2px rgba(206, 17, 65, 0.18);
        }

        .border-yellow {
            border: 3px solid var(--border-yellow);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.48), 0 0 0 2px rgba(253, 185, 39, 0.20);
        }

        .player.border-orange {
            border: 3px solid #F58426 !important;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.48), 0 0 0 2px rgba(245, 132, 38, 0.26), 0 0 16px rgba(245, 132, 38, 0.20) !important;
        }

        .player.border-blue {
            border: 3px solid #006BB6 !important;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.48), 0 0 0 2px rgba(0, 107, 182, 0.28), 0 0 16px rgba(0, 107, 182, 0.20) !important;
        }

        .player.selected {
            outline: 4px solid #32ff7e;
            outline-offset: 2px;
            transform: scale(1.06);
        }

        .player.dragging {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.88;
            transform: scale(1.10);
        }

        .dropzone .player {
            width: 50px !important;
            height: 50px !important;
            min-width: 50px !important;
            min-height: 50px !important;
            max-width: 50px !important;
            max-height: 50px !important;
            flex: 0 0 50px !important;
            position: relative !important;
            margin: 0 !important;
        }

        .dropzone .player.dragging {
            position: fixed !important;
            z-index: 9999 !important;
        }

        .btn {
            min-height: 42px;
            padding: 11px 18px;
            margin: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 999px;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            line-height: 1;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
            transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
        }

        .btn:active {
            transform: scale(0.97);
            filter: brightness(0.94);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        @media (max-width: 420px) {
            body {
                padding-left: 8px;
                padding-right: 8px;
            }

            #capture-area {
                padding: 9px 6px;
                border-radius: 15px;
            }

            .tier-row {
                min-height: 86px;
                margin-bottom: 5px;
                border-radius: 11px;
            }

            .tier-label {
                width: 60px;
                min-width: 60px;
                font-size: 14px;
            }

            .dropzone {
                gap: 8px;
                padding: 9px;
            }

            .dropzone .player {
                width: 46px !important;
                height: 46px !important;
                min-width: 46px !important;
                min-height: 46px !important;
                max-width: 46px !important;
                max-height: 46px !important;
                flex-basis: 46px !important;
            }

            .center-table-image {
                width: min(54%, 220px);
                opacity: 0.22;
            }
        }
    
        /* 尼克斯vs骑士头像框：仅修改外圈边框，不改变头像图片背景 */
        .player.border-knicks {
            border: 4px solid #006BB6 !important;

                0 0 22px rgba(245, 132, 38, 0.28) !important;
        }
        .player.border-cavs {
            border: 4px solid #111111 !important;

                0 8px 18px rgba(0, 0, 0, 0.52),

                0 0 0 6px rgba(253, 187, 48, 0.42),
                0 0 24px rgba(253, 187, 48, 0.32) !important;
        }
        .dropzone .player.border-knicks {
            border: 3px solid #006BB6 !important;
            box-shadow:
                0 7px 15px rgba(0, 0, 0, 0.50),
                0 0 0 2px #F58426,
                0 0 0 4px rgba(245, 132, 38, 0.34) !important;
        }
        .dropzone .player.border-cavs {
            border: 3px solid #111111 !important;
            box-shadow:
                0 7px 15px rgba(0, 0, 0, 0.50),
                0 0 0 2px #FDBB30,
                0 0 0 4px rgba(253, 187, 48, 0.38) !important;
        }

    
        /* 雷霆vs马刺头像框：仅修改外圈边框，不改变头像图片背景 */
        .player.border-thunder {
            border: 4px solid #F58426 !important;
            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.52),
                0 0 0 3px #007AC1,
                0 0 0 6px rgba(0, 122, 193, 0.38),
                0 0 22px rgba(0, 122, 193, 0.28) !important;
        }
        .player.border-spurs {
            border: 4px solid #111111 !important;
            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.52),
                0 0 0 3px #A5ACAF,
                0 0 0 6px rgba(165, 172, 175, 0.38),
                0 0 22px rgba(165, 172, 175, 0.26) !important;
        }
        .player.border-ref {
            border: 4px solid #FFFFFF !important;
            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.52),
                0 0 0 3px #111111,
                0 0 0 6px rgba(17, 17, 17, 0.44),
                0 0 22px rgba(255, 255, 255, 0.22) !important;
        }
        .dropzone .player.border-thunder {
            border: 3px solid #F58426 !important;
            box-shadow:
                0 7px 15px rgba(0, 0, 0, 0.50),
                0 0 0 2px #007AC1,
                0 0 0 4px rgba(0, 122, 193, 0.34) !important;
        }
        .dropzone .player.border-spurs {
            border: 3px solid #111111 !important;
            box-shadow:
                0 7px 15px rgba(0, 0, 0, 0.50),
                0 0 0 2px #A5ACAF,
                0 0 0 4px rgba(165, 172, 175, 0.34) !important;
        }
        .dropzone .player.border-ref {
            border: 3px solid #FFFFFF !important;
            box-shadow:
                0 7px 15px rgba(0, 0, 0, 0.50),
                0 0 0 2px #111111,
                0 0 0 4px rgba(17, 17, 17, 0.42) !important;
        }

        #posterOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.92);
            z-index: 100; display: none; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;

        #posterOverlay.active { display: flex; }
        #posterOverlay img {
            max-width: 100%; max-height: 75vh; border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);

        .poster-actions {
            display: flex; gap: 12px; margin-top: 20px;
        }
        .btn-poster {
            background: linear-gradient(135deg,#7c3aed,#a855f7); color: #fff;
            border-radius: 50px; border: none;
        }
        .btn-share {
            min-height: 44px; padding: 12px 24px;
            font-size: 15px; font-weight: 700;
            cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(124,58,237,0.35);
            transition: transform 0.14s ease, filter 0.14s ease;
        }
        .btn-share:active { transform: scale(0.97); filter: brightness(0.92); }
        .btn-share:disabled { opacity: 0.6; pointer-events: none; }
        .poster-close {
            min-height: 44px; padding: 12px 24px;
            border-radius: 50px; border: none;
            font-size: 15px; font-weight: 700;
            cursor: pointer;
        }
    </style>

        </div>
    </div>

        </div>

        const imagePreloadCache = new Map();

        function preloadImage(url) {
            if (!url) return Promise.resolve();
            if (imagePreloadCache.has(url)) return imagePreloadCache.get(url);

            const task = new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    if (img.decode) {
                        img.decode().catch(() => {}).finally(resolve);
                    } else {
                        resolve();
                    }
                };
                img.onerror = function() {
                    // CORS 失败时重试不带 crossOrigin
                    var img2 = new Image();
                    img2.onload = resolve;
                    img2.onerror = resolve;
                    img2.src = url;
                };
                img.src = url;
            });

            imagePreloadCache.set(url, task);
            return task;
        }

        function bindUniversalEvents(el) {
            el.onclick = (e) => {
                e.stopPropagation();
                if (isDragging) return;
                if (selectedEl) selectedEl.classList.remove('selected');
                selectedEl = el;
                el.classList.add('selected');
            };
            el.onmousedown = (e) => { if (e.button === 0) handleStart(el, e.clientX, e.clientY); };
            el.ontouchstart = (e) => { if (e.touches.length === 1) handleStart(el, e.touches[0].clientX, e.touches[0].clientY); };
        }

        function handleStart(el, startX, startY) {
            let moved = false;
            const rect = el.getBoundingClientRect();
            const offsetX = startX - rect.left;
            const offsetY = startY - rect.top;

            const onMove = (clientX, clientY) => {
                if (!moved) {
                    if (Math.abs(clientX - startX) < 5 && Math.abs(clientY - startY) < 5) return;
                    moved = true; isDragging = true;
                    if(selectedEl) selectedEl.classList.remove('selected');
                    selectedEl = null;
                    el.classList.add('dragging');
                    el.style.width = rect.width + 'px';
                    el.style.height = rect.height + 'px';
                }
                el.style.left = (clientX - offsetX) + 'px';
                el.style.top = (clientY - offsetY) + 'px';
            };

            const onMouseMove = (e) => onMove(e.clientX, e.clientY);
            const onTouchMove = (e) => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); };

            const onEnd = (e) => {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onEnd);

                if (moved) {
                    el.classList.remove('dragging');
                    const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
                    const clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);
                    el.style.visibility = 'hidden';
                    const target = document.elementFromPoint(clientX, clientY);
                    el.style.visibility = 'visible';
                    const row = target ? target.closest('.tier-row') : null;
                    if (row) placeInTable(el, row.querySelector('.dropzone'));
                    else { el.style.position = ''; el.style.left = ''; el.style.top = ''; }
                    setTimeout(() => isDragging = false, 50);
                }
            };
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onTouchMove, { passive: false });
            document.addEventListener('touchend', onEnd);
        }

        function roundRectC(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function drawPoster(ctx, w, h, tiers) {
            if (!tiers) tiers = getTierPlayers();

            // ── 背景 ──
            var grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#0e0e1e');
            grad.addColorStop(0.5, '#16162a');
            grad.addColorStop(1, '#0e0e1e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // ── 标题 ──
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillStyle = '#ffcc33';
            ctx.font = 'bold 22px -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif';
            ctx.fillText(ACTIVITY_NAME, w / 2, 12);

            // ── 分隔线 ──
            var lineGrad = ctx.createLinearGradient(40, 0, w - 40, 0);
            lineGrad.addColorStop(0, 'rgba(255,255,255,0)');
            lineGrad.addColorStop(0.3, 'rgba(255,255,255,0.2)');
            lineGrad.addColorStop(0.7, 'rgba(255,255,255,0.2)');
            lineGrad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.strokeStyle = lineGrad;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(40, 42);
            ctx.lineTo(w - 40, 42);
            ctx.stroke();

            // ── 副标题 ──
            ctx.fillStyle = '#aaa';
            ctx.font = '15px -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif';
            ctx.fillText('JRs 评级结果', w / 2, 52);

            // ── 等级行（仿结束页：一行5个头像，50px大小） ──
            var ROW_GAP = 8, ROW_R = 10;
            var LABEL_W = 50;
            var PLAYER_R = 25;       // 头像半径 25 → 直径 50px（与结束页一致）
            var BORDER_W = 2;        // 队伍色边框宽
            var AVATAR_GAP = 10;     // 头像间距（与结束页一致）
            var nameLineH = 0;
            var ROW_PADDING = 16;    // 行内上下间距
            var PER_ROW = 6;         // 每行固定6个

            var currentY = 66;

            tiers.forEach(function(tier, ti) {
                var cfg = TIER_ROW_CFG[tier.label] || TIER_ROW_CFG['NPC'];
                var players = tier.players;

                // 计算行高
                var slotW = (PLAYER_R + BORDER_W) * 2 + AVATAR_GAP;
                var rows = Math.max(1, Math.ceil(players.length / PER_ROW));
                var contentH = rows * (PLAYER_R + BORDER_W) * 2 + (rows - 1) * nameLineH;
                if (players.length === 0) contentH = (PLAYER_R + BORDER_W) * 2;
                var rowH = contentH + ROW_PADDING * 2;

                var y = currentY;

                // 行背景
                ctx.fillStyle = 'rgba(255,255,255,0.045)';
                roundRectC(ctx, 0, y, w, rowH, ROW_R);
                ctx.fill();

                // 等级标签（左侧）
                var labelGrad = ctx.createLinearGradient(0, y, 0, y + rowH);
                labelGrad.addColorStop(0, cfg.bg1);
                labelGrad.addColorStop(1, cfg.bg2);
                ctx.fillStyle = labelGrad;
                roundRectC(ctx, 0, y, LABEL_W, rowH, ROW_R);
                ctx.fillRect(LABEL_W - ROW_R, y, ROW_R, rowH);
                ctx.fill();

                ctx.fillStyle = '#080808';
                ctx.font = 'bold 16px -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(tier.label, LABEL_W / 2, y + rowH / 2);

                if (players.length > 0) {
                    // 水平居中5个头像组
                    var areaX = LABEL_W + 6;
                    var usedW = PER_ROW * slotW - AVATAR_GAP;
                    var areaW = w - areaX - 6;
                    var offsetX = areaX + (areaW - usedW) / 2;

                    // 垂直居中玩家区域
                    var playerTop = y + (rowH - contentH) / 2;

                    players.forEach(function(p, pi) {
                        var rowIdx = Math.floor(pi / PER_ROW);
                        var colIdx = pi % PER_ROW;
                        var px = offsetX + colIdx * slotW + (PLAYER_R + BORDER_W);
                        var py = playerTop + rowIdx * ((PLAYER_R + BORDER_W) * 2 + nameLineH) + (PLAYER_R + BORDER_W);

                        // 队伍色边框
                        ctx.beginPath();
                        ctx.arc(px, py, PLAYER_R + BORDER_W, 0, Math.PI * 2);
                        ctx.closePath();
                        ctx.fillStyle = TEAM_RING[p.borderColor] || '#888';
                        ctx.fill();

                        // 头像（圆形裁剪绘制）
                        if (p.loadedImg) {
                            drawCircularImage(ctx, p.loadedImg, px, py, PLAYER_R);
                        } else {
                            ctx.beginPath();
                            ctx.arc(px, py, PLAYER_R, 0, Math.PI * 2);
                            ctx.closePath();
                            ctx.fillStyle = TEAM_RING[p.borderColor] || '#888';
                            ctx.fill();
                            ctx.fillStyle = '#fff';
                            ctx.font = 'bold 14px -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            if (p.name) ctx.fillText(p.name.charAt(0), px, py);
                        }
                    });
                }

                currentY += rowH + ROW_GAP;
            });

            // ── 水印 ──
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = '13px -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(ACTIVITY_NAME + ' · 虎扑JRs出品', w / 2, h - 12);
        }

        function drawCircularImage(ctx, img, cx, cy, radius) {
            // object-fit: cover 等效 — 不压缩比例，居中裁剪，填满圆形
            var iw = img.naturalWidth || img.width;
            var ih = img.naturalHeight || img.height;
            var target = radius * 2;
            var scale = Math.max(target / iw, target / ih);
            var dw = iw * scale;
            var dh = ih * scale;
            var dx = cx - dw / 2;
            var dy = cy - dh / 2;
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(img, dx, dy, dw, dh);
            ctx.restore();
        }

        function loadPosterImages(tiers) {
            // 收集所有球员头像 URL，创建带 CORS 的 Image 对象
            var loadTasks = [];
            tiers.forEach(function(tier) {
                tier.players.forEach(function(p) {
                    if (!p.imgSrc) return;
                    var task = new Promise(function(resolve) {

                        img.onload = function() { p.loadedImg = img; resolve(); };
                        img.onerror = function() { resolve(); }; // 不阻塞，后面会用 fallback
                        img.src = p.imgSrc;
                    });
                    loadTasks.push(task);
                });
            });
            return Promise.all(loadTasks);
        }

        function calcPosterHeight(tiers) {
            // 与 drawPoster 中的计算逻辑保持一致
            var headH = 66;         // 标题+分隔线+副标题+间距
            var footH = 24;         // 水印区域
            var ROW_GAP = 8;
            var PLAYER_R = 25, BORDER_W = 2, ROW_PADDING = 16, PER_ROW = 6;
            var slotW = (PLAYER_R + BORDER_W) * 2 + 10;
            var total = headH + footH;
            tiers.forEach(function(tier) {
                var players = tier.players;
                var rows = Math.max(1, Math.ceil(players.length / PER_ROW));
                var contentH = rows * (PLAYER_R + BORDER_W) * 2;
                if (players.length === 0) contentH = (PLAYER_R + BORDER_W) * 2;
                var rowH = contentH + ROW_PADDING * 2;
                total += rowH + ROW_GAP;
            });
            return Math.max(400, total); // 最低 400px
        }

        function dataURLToBlob(dataURL) {
            var parts = dataURL.split(',');
            var mime = parts[0].match(/:(.*?);/)[1];
            var bytes = atob(parts[1]);
            var ab = new ArrayBuffer(bytes.length);
            var ia = new Uint8Array(ab);
            for (var i = 0; i < bytes.length; i++) ia[i] = bytes.charCodeAt(i);
            return new Blob([ab], { type: mime });
        }

        function uploadToOSS(file, filename) {
            return new Promise(function(resolve, reject) {
                // 方案1: ColorboxAI API — 传 { file, filename } 对象
                if (window.ColorboxAI && window.ColorboxAI.oss && typeof window.ColorboxAI.oss.uploadFile === 'function') {
                    window.ColorboxAI.oss.uploadFile({ file: file, filename: filename })
                        .then(function(res) { resolve(res.downloadUrl || ''); })
                        .catch(reject);
                    return;
                }
                // 方案2: postMessage Bridge（作为 iframe 运行在 Colorbox Shell 中）
                if (window.parent && window.parent !== window) {
                    var callbackId = '_cb_up_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
                    var timer = setTimeout(function() { cleanup(); reject(new Error('上传超时')); }, 30000);
                    var handler = function(e) {
                        var d = e.data;
                        if (d && d.protocol === 'colorbox-ai-bridge' && d.type === 'oss.upload.callback' && d.payload && d.payload.callbackId === callbackId) {
                            clearTimeout(timer); cleanup();
                            d.payload.error ? reject(new Error(d.payload.error)) : resolve(d.payload.downloadUrl || '');
                        }
                    };
                    var cleanup = function() { window.removeEventListener('message', handler); };
                    window.addEventListener('message', handler);
                    window.parent.postMessage({
                        protocol: 'colorbox-ai-bridge', version: 1, direction: 'frame-to-host',
                        type: 'oss.upload',
                        payload: { file: file, filename: filename, callbackId: callbackId }
                    }, '*');
                    return;
                }
                // 方案3: 直连 KaleidoOSS（独立运行时）
                var client = getOssClient();
                if (client) {
                    var ext = filename.lastIndexOf('.') >= 0 ? filename.slice(filename.lastIndexOf('.')) : '.png';
                    var now = new Date();
                    var key = 'user-upload/' + (now.getFullYear() % 100) + (now.getMonth() + 1) + now.getDate() + '-' + Math.random().toString(36).slice(-6) + ext;
                    client.multipartUpload(key, file, {})
                        .then(function(res) { resolve(res.downloadUrl || 'https://activity-static.hoopchina.com.cn/' + res.name); })
                        .catch(reject);
                    return;
                }
                // 方案4: 没有任何上传能力
                reject(new Error('No upload capability'));
            });
        }

        function safeNavigate(url, target, eventName) {
            // 跳转前埋点
            if (window.ColorboxAI && typeof window.ColorboxAI.track === 'function') {
                try {
                    window.ColorboxAI.track({ event: eventName || 'navigate', url: url, target: target || '_blank' });
                } catch(_) {}
            }

            // 优先使用 SDK 统一跳转 API
            if (window.ColorboxAI && typeof window.ColorboxAI.navigateTo === 'function') {
                try { window.ColorboxAI.navigateTo(url, target || '_blank'); return; } catch(e) {}
            }
            if (window.ColorboxAI && typeof window.ColorboxAI.openUrl === 'function') {
                try { window.ColorboxAI.openUrl(url); return; } catch(e) {}
            }
            // 降级方案
            try { window.open(url, target || '_blank'); } catch(e) {}
        }

        async function sharePoster(btn) {
            var canvas = document.getElementById('posterCanvas');
            if (!canvas.width || !canvas._corsSafe) {
                // 如果 canvas 未初始化或未用 CORS 模式生成，重新生成
                canvas = await createPosterCanvasAsync();
            }
            var dataURL = canvas.toDataURL('image/png');
            var blob = dataURLToBlob(dataURL);
            if (blob.size === 0) {
                console.error('[OSS] Generated blob is empty, canvas may be blank');
                throw new Error('海报图片为空');
            }
            var filename = 'poster_' + ACTIVITY_NAME + '_' + Date.now() + '.png';

            // 显示 loading
            var origText = btn.innerHTML;
            btn.innerHTML = '⏳ 上传中...';
            btn.disabled = true;

            try {
                var imageUrl = await uploadToOSS(blob, filename);
                var initialValue = {
                    syncPost: true,
                    appJsonV3: {
                        activeTab: 'thread',
                        data: {
                            title: '',
                            imageList: imageUrl ? [imageUrl] : [],
                            content: ''
                        }
                    }
                };

                var postUrl = 'huputiyu://bbs/postImg?tagName=' + encodeURIComponent(ACTIVITY_NAME) +
                    '&tagId=' + TAG_ID +
                    '&topicName=' + encodeURIComponent(TOPIC_NAME) +
                    '&topicId=' + TOPIC_ID +
                    '&initialValue=' + encodeURIComponent(JSON.stringify(initialValue));
                safeNavigate(postUrl, '_self', 'poster_share');
                closePoster();
            } catch (e) {
                // 降级：纯文字发帖
                console.warn('Poster upload failed, fallback to text-only post', e);
                var fallbackInitialValue = {
                    syncPost: true,
                    appJsonV3: {
                        activeTab: 'thread',
                        data: {
                            title: '',
                            imageList: [],
                            content: ''
                        }
                    }
                };
                var fallbackUrl = 'huputiyu://bbs/postImg?tagName=' + encodeURIComponent(ACTIVITY_NAME) +
                    '&tagId=' + TAG_ID +
                    '&topicName=' + encodeURIComponent(TOPIC_NAME) +
                    '&topicId=' + TOPIC_ID +
                    '&initialValue=' + encodeURIComponent(JSON.stringify(fallbackInitialValue));
                safeNavigate(fallbackUrl, '_self', 'poster_share_fallback');
                closePoster();
            } finally {
                btn.innerHTML = origText;
                btn.disabled = false;
            }
        }

        function generateAndShare() {
            generatePoster();
        }

        window.onload = function() { preloadAllPlayerImages().then(manualReset); };
    </script>
</body>
