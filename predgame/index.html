function validateScoreInput(inputElement) {
    let rawVal = inputElement.value;
    if (rawVal === "") return;
    let numVal = Number(rawVal);
    if (numVal === 64 || numVal === 89) {
        alert("输入比分无效");
        inputElement.value = "";
        checkInputs();
        return;
    }
}

const thunderScoreInput = document.getElementById('thunder-score');

    spursScoreInput.addEventListener('input', function(e) {
        validateScoreInput(e.target);
    });
    thunderScoreInput.addEventListener('input', function(e) {
        validateScoreInput(e.target);
    });
    spursScoreInput.addEventListener('change', function(e) {

function checkInputs() {
    const thunderVal = document.getElementById('thunder-score').value;
    const spursVal = document.getElementById('spurs-score').value;
    const submitBtn = document.getElementById('submit-btn');
    if (thunderVal !== "" && spursVal !== "") {
        submitBtn.classList.add('active');
    } else {
        submitBtn.classList.remove('active');
    }
}

function predict() {
    const thunderVal = document.getElementById('thunder-score').value;
    const spursVal = document.getElementById('spurs-score').value;
    
    if (thunderVal === "" || spursVal === "") {
        alert("请填写双方完整比分！");
        return;
    }
    
    const thunderScore = parseInt(thunderVal);
    const spursScore = parseInt(spursVal);
    
    if (isNaN(thunderScore) || isNaN(spursScore) || thunderScore < 50 || thunderScore > 150 || spursScore < 50 || spursScore > 150) {
        alert("请填写50-150之间的有效比分。");
        return;
    }
    
    if (thunderScore === 64 || thunderScore === 89 || spursScore === 64 || spursScore === 89) {
        alert("输入比分无效");
        if (thunderScore === 64 || thunderScore === 89) document.getElementById('thunder-score').value = "";
        if (spursScore === 64 || spursScore === 89) document.getElementById('spurs-score').value = "";
        checkInputs();
        return;
    }
    
    if (thunderScore === spursScore) {
        alert("西部决赛必须分出胜负！请修改比分。");
        return;
    }
    
    const diff = Math.abs(thunderScore - spursScore);
    const winner = spursScore > thunderScore ? 'spurs' : 'thunder';
    const list = scripts[winner];
    let content = "";
    
    for (let item of list) {
        if (diff >= item.min && diff <= item.max) {
            const randomIndex = Math.floor(Math.random() * item.texts.length);
            content = item.texts[randomIndex];
            break;
        }
    }
    
    if (!content) {
        content = winner === 'spurs' ? "文班亚马天神下凡，用不可思议的方式带走胜利！西决剧情由你定义。" : "亚历山大超神表演，雷霆青年军掀翻马刺，这就是青春风暴！";
    }
    
    document.getElementById('main-container').classList.add('show-result');
    document.getElementById('res-desc').innerText = content;
    document.getElementById('result-area').style.display = 'block';
    document.getElementById('input-tip-text').style.display = 'none';
    document.getElementById('submit-btn').style.display = 'none';
    document.getElementById('reset-btn').style.display = 'flex';
    document.getElementById('poster-btn').style.display = 'flex';
    document.querySelector('.match-header h1').textContent = '我的雷霆vs马刺抢七神剧情';
    
    setTimeout(() => {
        window.scrollTo({ top: 100, behavior: 'smooth' });
    }, 100);
}

// 带缓存破坏的 CORS 图片加载（确保不走非CORS缓存）
function loadCORSImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = url + (url.includes('?') ? '&' : '?') + '_cb=' + Date.now();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('图片加载失败'));
  });
}

// ─── 辅助：圆角矩形 ───
function roundRectC(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ─── 绘制海报（3:4比例，紧凑布局，字体+2号） ───
function drawPoster(ctx, w) {
  const thunderScore = parseInt(document.getElementById('thunder-score').value) || 0;
  const spursScore = parseInt(document.getElementById('spurs-score').value) || 0;
  const resultText = document.getElementById('res-desc').innerText || '';
  const H = Math.round(w * 4 / 3);
  const pad = 20;

  // 白色背景
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, H);

  // ─── 虎扑标签 ───
  ctx.fillStyle = '#999';
  ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('虎扑JRs预测', pad, 12);

  // ─── 标题 ───
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('我的雷霆VS马刺G7神剧情', w / 2, 38);

  // ─── 比分区域 ───
  const logoSize = 64;
  const scoreTop = 78;
  const logoCY = scoreTop + logoSize / 2;
  const leftCX = w * 0.22;
  const rightCX = w * 0.78;
  const vsX = w / 2;

  // 队徽
  [LOGO_IMAGES.thunder, LOGO_IMAGES.spurs].forEach((logo, idx) => {
    const cx = idx === 0 ? leftCX : rightCX;
    if (logo && logo.complete && logo.naturalWidth > 0) {
      ctx.save(); ctx.beginPath(); ctx.arc(cx, logoCY, logoSize/2, 0, Math.PI*2); ctx.clip();
      ctx.drawImage(logo, cx - logoSize/2, logoCY - logoSize/2, logoSize, logoSize);
      ctx.restore();
    } else {
      ctx.fillStyle = '#f0f0f0'; ctx.beginPath();
      ctx.arc(cx, logoCY, logoSize/2, 0, Math.PI*2); ctx.fill();
    }
  });

  // 队名
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const nameY = scoreTop + logoSize + 4;
  ctx.fillText('雷霆', leftCX, nameY);
  ctx.fillText('马刺', rightCX, nameY);

  // VS
  ctx.fillStyle = '#ddd';
  ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('VS', vsX, logoCY - 14);

  // 输入框
  const iw = 85, ih = 55;
  const iy = nameY + 15 + 22;
  [leftCX, rightCX].forEach(cx => {
    const ix = cx - iw / 2;
    ctx.fillStyle = '#f8f9fa';
    roundRectC(ctx, ix, iy, iw, ih, 14); ctx.fill();
    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 2;
    roundRectC(ctx, ix, iy, iw, ih, 14); ctx.stroke();
  });

  // 比分数字
  ctx.fillStyle = '#1d428a';
  ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(thunderScore), leftCX, iy + ih / 2);
  ctx.fillText(String(spursScore), rightCX, iy + ih / 2);

  // ─── 剧情回顾卡片 ───
  const cardTop = iy + ih + 28;
  const cp = 16, bw = 5;
  const cw = w - cp * 2;
  const cl = cp;
  const textMaxW = cw - cp * 2 - bw;
  const lh = 26;

  ctx.font = '17px "PingFang SC","Microsoft YaHei",sans-serif';
  let lines = [], cur = '';
  for (const ch of resultText) {
    const test = cur + ch;
    if (ctx.measureText(test).width > textMaxW && cur) {
      lines.push(cur); cur = ch;
    } else { cur = test; }
  }
  if (cur) lines.push(cur);
  if (lines.length === 0 && resultText.length > 0) lines = [resultText];

  const th = 22, tg = 8;
  const txth = lines.length * lh;
  const chh = cp * 2 + th + tg + txth;
  const cb = cardTop + chh;

  ctx.fillStyle = '#f9f9f9';
  roundRectC(ctx, cl, cardTop, cw, chh, 20); ctx.fill();
  ctx.fillStyle = '#1d428a';
  roundRectC(ctx, cl, cardTop, bw, chh, 3); ctx.fill();

  ctx.fillStyle = '#1d428a';
  ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('西决时刻·剧情回顾', cl + cp + 8, cardTop + cp);

  ctx.fillStyle = '#333';
  ctx.font = '17px "PingFang SC","Microsoft YaHei",sans-serif';
  const tx = cl + cp + 8;
  const ts = cardTop + cp + th + tg;
  lines.forEach((l, i) => { ctx.fillText(l, tx, ts + i * lh); });
}

// ─── 创建高清海报 canvas（2x） ───
const POSTER_W = 420, POSTER_SCALE = 2;

function createPosterCanvas() {
  const canvas = document.getElementById('posterCanvas');
  const H = Math.round(POSTER_W * 4 / 3);
  canvas.width = POSTER_W * POSTER_SCALE;
  canvas.height = H * POSTER_SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(POSTER_SCALE, POSTER_SCALE);
  ctx.clearRect(0, 0, POSTER_W, H);
  drawPoster(ctx, POSTER_W);
  return canvas;
}

// ─── dataURL → Blob ───
function dataURLToBlob(dataURL) {
  const parts = dataURL.split(',');
  const mime = parts[0].match(/:(.*?);/)[1];
  const bstr = atob(parts[1]);
  const n = bstr.length;
  const u8arr = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
  return new Blob([u8arr], { type: mime });
}

  return new Promise((resolve, reject) => {
    // 1) ColorboxAI API
    if (window.ColorboxAI && window.ColorboxAI.oss && typeof window.ColorboxAI.oss.uploadFile === 'function') {
      window.ColorboxAI.oss.uploadFile({ file, filename })
        .then(res => resolve(res.downloadUrl || ''))
        .catch(reject);
      return;
    }
    // 2) postMessage Bridge（iframe）
    if (window.parent && window.parent !== window) {
      const callbackId = '_cb_up_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const timer = setTimeout(() => { cleanup(); reject(new Error('上传超时')); }, 30000);
      const handler = e => {
        const d = e.data;
        if (d && d.protocol === 'colorbox-ai-bridge' && d.type === 'oss.upload.callback' && d.payload && d.payload.callbackId === callbackId) {
          clearTimeout(timer); cleanup();
          d.payload.error ? reject(new Error(d.payload.error)) : resolve(d.payload.downloadUrl || '');
        }
      };
      const cleanup = () => window.removeEventListener('message', handler);
      window.addEventListener('message', handler);
      window.parent.postMessage({
        protocol: 'colorbox-ai-bridge', version: 1, direction: 'frame-to-host',
        type: 'oss.upload',
        payload: { file, filename, callbackId }
      }, '*');
      return;
    }
    // 3) KaleidoOSS 直连
    const client = getOssClient();
    if (client) {
      const ext = filename.lastIndexOf('.') >= 0 ? filename.slice(filename.lastIndexOf('.')) : '.png';
      const now = new Date();
      const key = `user-upload/${(now.getFullYear() % 100)}${now.getMonth() + 1}${now.getDate()}-${Math.random().toString(36).slice(-6)}${ext}`;
      client.multipartUpload(key, file, {})
        .then(res => resolve(res.downloadUrl || `https://activity-static.hoopchina.com.cn/${res.name}`))
        .catch(reject);
      return;
    }
    // 4) 无上传能力
    reject(new Error('No upload capability'));
  });
}

// ─── 安全跳转（统一走 ColorboxAI SDK，严禁 window.open/location.href） ───
function safeNavigate(url, target) {
  // 跳转前先埋点
  if (window.ColorboxAI && typeof window.ColorboxAI.track === 'function') {
    try { window.ColorboxAI.track({ event: 'navigate', url: url, target: target || '_blank' }); } catch (_) {}
  }
  // 优先使用 SDK 统一跳转 API
  if (window.ColorboxAI && typeof window.ColorboxAI.navigateTo === 'function') {
    return window.ColorboxAI.navigateTo(url, target || '_blank');
  }
  if (window.ColorboxAI && typeof window.ColorboxAI.openUrl === 'function') {
    return window.ColorboxAI.openUrl(url);
  }
  // 没有任何可用跳转能力时，仅打印警告，绝不自行 window.open/location.href
  console.warn('[safeNavigate] ColorboxAI navigateTo/openUrl 不可用，无法跳转:', url);
}

// ─── 一键发帖（从预览弹窗） ───
function sharePoster(btn) {
  // 如果预上传已完成，直接跳转，无感发帖
  if (_cachedPosterUploadUrl) {
    navigateWithImage(_cachedPosterUploadUrl);
    return;
  }
  
  // 需要等待上传，显示加载动画
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>上传中...';
  
  (async () => {
    try {
      let imageUrl;
      
      // 预上传还在进行中，等待它完成
      if (_uploadPromise) {
        showLoading('正在上传海报...');
        imageUrl = await _uploadPromise;
        hideLoading();
      }
      
      // 预上传失败或没有预上传，走传统链路
      if (!imageUrl) {
        const dataURL = _cachedPosterDataURL;
        if (!dataURL) {
          btn.disabled = false;
          btn.textContent = '📤 一键发帖';
          return;
        }
        showLoading('正在上传海报...');
        const blob = dataURLToBlob(dataURL);
        imageUrl = await uploadToOSS(blob, `马刺雷霆G7预测_${Date.now()}.png`);
        hideLoading();
      }
      
      imageUrl = imageUrl || '';
      const initialValue = {
        syncPost: true,
        appJsonV3: {
          activeTab: 'thread',
          data: {
            title: '',
            imageList: imageUrl ? [imageUrl] : [],
            content: '',
          },
        },
      };
      const tagName = encodeURIComponent('雷霆-马刺G7神预测');
      const link = `huputiyu://bbs/postImg?tagName=${tagName}&tagId=147647&topicName=${encodeURIComponent('湿乎乎的话题')}&topicId=177&initialValue=${encodeURIComponent(JSON.stringify(initialValue))}`;
      safeNavigate(link);
      closePoster();
    } catch (e) {
      console.error('发帖失败', e);
      hideLoading();
      btn.disabled = false;
      btn.textContent = '📤 一键发帖';
      alert('发帖失败，请重试');
    }
  })();
}

// 用已上传的图片 URL 直接跳转（无感发帖）
function navigateWithImage(imageUrl) {
  const initialValue = {
    syncPost: true,
    appJsonV3: {
      activeTab: 'thread',
      data: {
        title: '',
        imageList: imageUrl ? [imageUrl] : [],
        content: '',
      },
    },
  };
  const tagName = encodeURIComponent('雷霆-马刺G7神预测');
  const link = `huputiyu://bbs/postImg?tagName=${tagName}&tagId=147647&topicName=${encodeURIComponent('湿乎乎的话题')}&topicId=177&initialValue=${encodeURIComponent(JSON.stringify(initialValue))}`;
  safeNavigate(link);
  closePoster();
}
