<script>
// 马刺 & 雷霆 西决剧本 — 每个分差区间3条文案，结合最新阵容（文班亚马、SGA、切特、杰伦威等）
const scripts = {
    spurs: [    // 马刺赢球剧本
        { min: 1, max: 5, texts: [
            `G7决胜时刻，文班亚马禁区接球后旱地拔葱，隔着切特用一记石破天惊的单手劈扣完成准绝杀，扣篮瞬间整个篮架都在剧烈颤抖！SGA最后一攻发疯般杀向内线，却被文班从身后一记遮天蔽日的钉板大帽扇飞，篮球弹到三分线外。文班落地后仰天怒吼，双拳紧握青筋暴起，俄城球迷抱头沉默，马刺拿下抢七挺进总决赛。`,
            `末节最后8秒，福克斯在右侧底角接到边线球，身体漂出界外、几乎零角度的极限后仰出手——球在高空中划出一道美妙的彩虹弧线，马刺反超！霍姆格伦的绝平三分在篮筐上涮了两圈后弹了出来，切特当场跪地双手掩面。赛后，整个马刺替补席疯了一样冲进场内把福克斯压倒在地。马刺在客队球迷的欢呼声中，加冕新的西部冠军。`,
            `终场前15秒，裁判哨响——凯尔登-约翰逊突破时多尔特被撞飞三米远，裁判果断吹罚防守犯规。凯尔登站上罚球线，全场嘘声震耳欲聋，他深吸一口气闭上眼睛，两罚全中！球网擦出清脆的响声。亚历山大最后一攻仓促突破，脚下拌蒜直接摔了个狗啃泥，球脱手滚出界外。凯尔登当场蹲下来双手指天，马刺替补直接将毛巾丢进了观众席。`
        ] },
        { min: 6, max: 10, texts: [
            `文班亚马最后5分钟化身叹息之墙，连续4个回合送出排球式大帽，其中一记直接把球扇到观众席第三排！雷霆每一次进攻都被他单手掐灭。进攻端他顶着切特打成2+1后，对着摄像机镜头撕扯胸口球衣，咆哮着拍打胸脯。马刺借势打出12-2攻势，雷霆替补席鸦雀无声，戴格诺特啥也做不了，只能双手叉腰无奈摇头——甚至，比赛结束后他依然在摇头。`,
            `卡斯尔下半场化身传球魔术师，连续表演穿裆传球、背后nolook pass和跨场长甩，马刺全队在他的串联下打出水银泻地般的进攻。戴格诺特叫了三次暂停，每次布置完新的战术都被卡斯尔一记妙传撕碎。雷霆主场球迷从嘘声变成沉默，最后眼睁睁看着马刺替补席笑成一团。`,
            `第四节尚帕尼突化身“超级兵器”，左右两侧45度各中一记三分，投完第二个后直接对着雷霆替补席比出"晚安"手势，嘴型清晰可见"Bye Bye"。雷霆瞬间崩盘，连续5次进攻打铁+3次失误。赛后尚帕尼对着镜头耸肩摊手："G7连进关键三分没什么难的。投就完事了。"说完把毛巾往肩上一甩，头也不回地走向球员通道。`
        ] },
        { min: 11, max: 15, texts: [
            `文班亚马在内线翻江倒海，把切特顶出三秒区后双手暴扣，落地时篮筐还在嗡嗡作响。哈珀像一把尖刀反复撕裂雷霆防线，分差像决堤的洪水般奔涌而出。赛后社交媒体上"切特8+8"的词条瞬间冲上热搜，甚至有好事网友直接开始讨论"新一代八贤王"。`,
            `马刺末节下起三分暴雨，7记三分箭箭穿心，现场解说连续吼了七次"BANG!"吼到嗓子完全沙哑。亚历山大一个人连得11分苦苦追赶，但每次他进球马刺立刻用更猛烈的三分回应。最后两分钟他低下头，双手撑着膝盖大口喘气，汗水滴在地板上汇成一滩。赛后他哑着嗓子说："没办法，他们确实投得太准了。"说完用球衣蒙住了整个脸。`,
            `哈珀今晚像踩了风火轮，快攻中连续表演穿人缝拉杆上篮、隔人劈扣和背后换手过掉三人一条龙。全场35分5抢断的数据让雷霆主场球迷都忍不住倒吸凉气。赛后戴格诺特怒气冲冲地找到当值裁判，指着技术台大喊："你们告诉我那几次打手抢断为什么不是犯规？！"裁判面无表情地递给他一瓶水，只是让他冷静。`
        ] },
        { min: 16, max: 20, texts: [
            `文班亚马如同《星球大战》中的帝国武器，全场狂砍39分12篮板，第三节连续在切特头上摘下进攻篮板二次进攻打进，两次造成切特犯规后对着他耸肩摇头。文班本场12次站上罚球线，每一次都获得俄城球迷的"MVP"嘘声。赛后戴格诺特在新闻发布会上把话筒狠狠拍在桌上："我们犯规太多？废话，因为确实防不住那个法国怪物！"`,
            `马刺单节打出19分的恐怖净胜分，球的转移速度快到摄像机都差点跟不上。雷霆主场安静得像一座图书馆，连场边的吉祥物都停止了表演，垂头丧气地坐在台阶上。亚历山大坐在替补席末端，用毛巾盖住整张脸，身体微微颤抖——没有人知道他是在哭泣还是在愤怒。`,
            `瓦塞尔第三节彻底暴走，连续三记干拔三分命中后，又突破到禁区迎着切特完成一记隔人暴扣，落地后他对着雷霆主场观众比出了"太简单了"的手势。亚历山大20投仅6中，每次出手都短了一截。第四节还剩6分钟，分差17分，戴格诺特终于撤下全部主力，提前举白旗。亚历山大走下球场时一脚踢飞了板凳上的水瓶。`
        ] },
        { min: 21, max: 30, texts: [
            `马刺三节打卡下班，分差一度冲到29分！SGA空砍35分，但每次他进球马刺立刻用更残忍的方式回应。暂停期间卡斯尔转身对着身后一片空荡荡的雷霆球迷区挥手告别，大声喊道："再见啦各位！"赛后他走到场地中央，双手拢在耳边做出经典的"聆听"手势，转了一圈后便有放声大笑起来。`,
            `卡斯尔全场16次助攻把马刺喂成8人得分上双的全面开花，分差冲破30分后雷霆攻防体系彻底崩塌。主场球迷开始成批离场，俄城的看台像漏水的船一样迅速变空。垃圾时间马刺球迷们占领了客队看台区，齐声高喊"Flopper！Flopper！"戴格诺特脸色从铁青变成惨白，把战术板狠狠摔在地上，摔成两半。据说垃圾时间两队球迷在看台发生了激烈推搡。`,
            `文班亚马半场就砍下22分，把切特打得像一个小学生——连续三次在他头上摘到篮板、连续两次把他晃飞后轻松挑篮。半场领先21分后，马刺更衣室传出震耳欲聋的吼叫声。下半场文班只打了三节就打卡下班，坐在替补席上翘着二郎腿喝着佳得乐。赛后记者问他感觉如何，他靠在椅背上打了个哈欠："没打过瘾。"`
        ] },
        { min: 31, max: 40, texts: [
            `马刺全员打出了季后赛最疯狂的一夜，首发五虎抡圆了胳膊猛锤雷霆防线，分差一度膨胀到35分，G7彻底沦为马刺的表演赛。俄城球迷从愤怒变成绝望，再从绝望变成麻木，有人直接把雷霆的旗帜倒着挂在了看台上。赛后亚历山大礼节性地恭喜了马刺，但话锋一转强调"全队在进攻端没有侵略性"，并宣布自己下赛季将开发出新的"杀伤力"——说这话时他攥紧了拳头。`,
            `马刺替补席在第二节掀起疯狂得分潮，卡特-布莱恩特单节暴走：16分、3记三分、4次抢断，攻防两端真的像是"卡特+布莱恩特"同时附体。雷霆早早换下全部主力，替补席上的SGA用毛巾捂住脸，切特低着头一动不动。赛后布莱恩特在 发布会哽咽了三次，每一次开口都是"米奇教练告诉我..."最后泣不成声。`,
            `文班亚马全场46分13篮板，一次又一次在切特头上摘下篮板打成二次进攻，有一次快攻中他甚至从罚球线起跳试图罚球线扣篮——虽然没进，但整个球馆发出了一声倒吸凉气的嘶声。罚球时俄城主场球迷竟倒戈高呼"MVP"，声音大到连马刺替补席都愣住了。赛后俄城市长紧急召开新闻发布会，表示希望与法国的勒谢奈市建立篮球合作关系——那里正是文班的家乡。`
        ] },
        { min: 41, max: 57, texts: [

            `SGA半场33分，比马刺全队还多1分；切特半场6记盖帽，把马刺的内线进攻扇到怀疑人生。马刺全队正负值全部在-40以下，惨不忍睹。赛后发布会米奇沉默了整整十秒，全场只有摄影师的快门声。他终于开口，声音沙哑："这就是抢七的代价。我们的年轻人为经验付了学费——今天这堂课，很贵，非常贵。"说完他起身离场，背影在灯光下拉的长长的。`,

function validateScoreInput(inputElement) {
    let rawVal = inputElement.value;
    if (rawVal === "") return;
    let numVal = Number(rawVal);
    if (numVal === 64 || numVal === 89) {
        alert("输入比分无效");
        inputElement.value = "";
        checkInputs();
        return;
    }
}

const spursScoreInput = document.getElementById('spurs-score');
const thunderScoreInput = document.getElementById('thunder-score');

function attachInvalidListeners() {
    spursScoreInput.addEventListener('input', function(e) {
        validateScoreInput(e.target);
    });
    thunderScoreInput.addEventListener('input', function(e) {
        validateScoreInput(e.target);
    });
    spursScoreInput.addEventListener('change', function(e) {
        validateScoreInput(e.target);
    });
    thunderScoreInput.addEventListener('change', function(e) {
        validateScoreInput(e.target);
    });
}
attachInvalidListeners();

function checkInputs() {
    const thunderVal = document.getElementById('thunder-score').value;
    const spursVal = document.getElementById('spurs-score').value;
    const submitBtn = document.getElementById('submit-btn');
    if (thunderVal !== "" && spursVal !== "") {
        submitBtn.classList.add('active');
    } else {
        submitBtn.classList.remove('active');
    }
}

function predict() {
    const thunderVal = document.getElementById('thunder-score').value;
    const spursVal = document.getElementById('spurs-score').value;
    
    if (thunderVal === "" || spursVal === "") {
        alert("请填写双方完整比分！");
        return;
    }
    
    const thunderScore = parseInt(thunderVal);
    const spursScore = parseInt(spursVal);
    
    if (isNaN(thunderScore) || isNaN(spursScore) || thunderScore < 50 || thunderScore > 150 || spursScore < 50 || spursScore > 150) {
        alert("请填写50-150之间的有效比分。");
        return;
    }
    
    if (thunderScore === 64 || thunderScore === 89 || spursScore === 64 || spursScore === 89) {
        alert("输入比分无效");
        if (thunderScore === 64 || thunderScore === 89) document.getElementById('thunder-score').value = "";
        if (spursScore === 64 || spursScore === 89) document.getElementById('spurs-score').value = "";
        checkInputs();
        return;
    }
    
    if (thunderScore === spursScore) {
        alert("西部决赛必须分出胜负！请修改比分。");
        return;
    }
    
    const diff = Math.abs(thunderScore - spursScore);
    const winner = spursScore > thunderScore ? 'spurs' : 'thunder';
    const list = scripts[winner];
    let content = "";
    
    for (let item of list) {
        if (diff >= item.min && diff <= item.max) {
            const randomIndex = Math.floor(Math.random() * item.texts.length);
            content = item.texts[randomIndex];
            break;
        }
    }
    
    if (!content) {

// ─── 队徽图片 URL ───
const LOGO_URLS = {

};
let LOGO_IMAGES = {};

// 带缓存破坏的 CORS 图片加载（确保不走非CORS缓存）
function loadCORSImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = url + (url.includes('?') ? '&' : '?') + '_cb=' + Date.now();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('图片加载失败'));
  });
}

// ─── 全局 Shim ───
window.require = window.require || function(name) {
  if (name === 'ali-oss') return window.OSS;
  if (name === '@hupu/kaleido-fed-sdk') return window.KaleidoOSS;
  return null;
};

// ─── 辅助：圆角矩形 ───
function roundRectC(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ─── 绘制海报（变长，最低3:4比例，底部留白） ───
function drawPoster(ctx, w, H) {
  const thunderScore = parseInt(document.getElementById('thunder-score').value) || 0;
  const spursScore = parseInt(document.getElementById('spurs-score').value) || 0;
  const resultText = document.getElementById('res-desc').innerText || '';
  const pad = 20;

  // 白色背景
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, H);

  // ─── 虎扑标签 ───
  ctx.fillStyle = '#999';
  ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('虎扑JRs预测', pad, 12);

  // ─── 标题 ───
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('我的雷霆VS马刺G7神剧情', w / 2, 38);

  // ─── 比分区域 ───
  const logoSize = 64;
  const scoreTop = 78;
  const logoCY = scoreTop + logoSize / 2;
  const leftCX = w * 0.22;
  const rightCX = w * 0.78;
  const vsX = w / 2;

  // 队徽
  [LOGO_IMAGES.thunder, LOGO_IMAGES.spurs].forEach((logo, idx) => {
    const cx = idx === 0 ? leftCX : rightCX;
    if (logo && logo.complete && logo.naturalWidth > 0) {
      ctx.save(); ctx.beginPath(); ctx.arc(cx, logoCY, logoSize/2, 0, Math.PI*2); ctx.clip();
      ctx.drawImage(logo, cx - logoSize/2, logoCY - logoSize/2, logoSize, logoSize);
      ctx.restore();
    } else {
      ctx.fillStyle = '#f0f0f0'; ctx.beginPath();
      ctx.arc(cx, logoCY, logoSize/2, 0, Math.PI*2); ctx.fill();
    }
  });

  // 队名
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const nameY = scoreTop + logoSize + 4;
  ctx.fillText('雷霆', leftCX, nameY);
  ctx.fillText('马刺', rightCX, nameY);

  // VS
  ctx.fillStyle = '#ddd';
  ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('VS', vsX, logoCY - 14);

  // 输入框
  const iw = 85, ih = 55;
  const iy = nameY + 15 + 22;
  [leftCX, rightCX].forEach(cx => {
    const ix = cx - iw / 2;
    ctx.fillStyle = '#f8f9fa';
    roundRectC(ctx, ix, iy, iw, ih, 14); ctx.fill();
    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 2;
    roundRectC(ctx, ix, iy, iw, ih, 14); ctx.stroke();
  });

  // 比分数字
  ctx.fillStyle = '#1d428a';
  ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(thunderScore), leftCX, iy + ih / 2);
  ctx.fillText(String(spursScore), rightCX, iy + ih / 2);

  // ─── 剧情回顾卡片 ───
  const cardTop = iy + ih + 28;
  const cp = 16, bw = 5;
  const cw = w - cp * 2;
  const cl = cp;
  const textMaxW = cw - cp * 2 - bw;
  const lh = 26;

  ctx.font = '17px "PingFang SC","Microsoft YaHei",sans-serif';
  let lines = [], cur = '';
  for (const ch of resultText) {
    const test = cur + ch;
    if (ctx.measureText(test).width > textMaxW && cur) {
      lines.push(cur); cur = ch;
    } else { cur = test; }
  }
  if (cur) lines.push(cur);
  if (lines.length === 0 && resultText.length > 0) lines = [resultText];

  const th = 22, tg = 8;
  const txth = lines.length * lh;
  const chh = cp * 2 + th + tg + txth;
  const cb = cardTop + chh;

  ctx.fillStyle = '#f9f9f9';
  roundRectC(ctx, cl, cardTop, cw, chh, 20); ctx.fill();
  ctx.fillStyle = '#1d428a';
  roundRectC(ctx, cl, cardTop, bw, chh, 3); ctx.fill();

  ctx.fillStyle = '#1d428a';
  ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('西决时刻·剧情回顾', cl + cp + 8, cardTop + cp);

  ctx.fillStyle = '#333';
  ctx.font = '17px "PingFang SC","Microsoft YaHei",sans-serif';
  const tx = cl + cp + 8;
  const ts = cardTop + cp + th + tg;
  lines.forEach((l, i) => { ctx.fillText(l, tx, ts + i * lh); });
}

// ─── 创建高清海报 canvas（2x，变长） ───
const POSTER_W = 420, POSTER_SCALE = 2;

function createPosterCanvas() {
  const canvas = document.getElementById('posterCanvas');
  const w = POSTER_W;
  const resultText = document.getElementById('res-desc').innerText || '';

  // 用临时 canvas 测量文本行数，计算内容实际所需高度
  const tmpCtx = canvas.getContext('2d');
  tmpCtx.font = '17px "PingFang SC","Microsoft YaHei",sans-serif';

  const cp = 16, bw = 5;
  const cw = w - cp * 2;
  const textMaxW = cw - cp * 2 - bw;
  const lh = 26;

  let lines = [], cur = '';
  for (const ch of resultText) {
    const test = cur + ch;
    if (tmpCtx.measureText(test).width > textMaxW && cur) {
      lines.push(cur); cur = ch;
    } else { cur = test; }
  }
  if (cur) lines.push(cur);
  if (lines.length === 0 && resultText.length > 0) lines = [resultText];

  // 计算卡片底部位置
  const logoSize = 64, scoreTop = 78;
  const nameY = scoreTop + logoSize + 4;
  const iy = nameY + 15 + 22;
  const ih = 55, cardTop = iy + ih + 28;
  const th = 22, tg = 8;
  const txth = lines.length * lh;
  const chh = cp * 2 + th + tg + txth;
  const cb = cardTop + chh;
  const bottomPad = 40;

  // 最终高度：至少 3:4，不够则根据内容变长
  const minH = Math.round(w * 4 / 3);
  const H = Math.max(minH, cb + bottomPad);

  canvas.width = w * POSTER_SCALE;
  canvas.height = H * POSTER_SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(POSTER_SCALE, POSTER_SCALE);
  ctx.clearRect(0, 0, w, H);
  drawPoster(ctx, w, H);
  return canvas;
}

// ─── dataURL → Blob ───
function dataURLToBlob(dataURL) {
  const parts = dataURL.split(',');
  const mime = parts[0].match(/:(.*?);/)[1];
  const bstr = atob(parts[1]);
  const n = bstr.length;
  const u8arr = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
  return new Blob([u8arr], { type: mime });
}

// ─── OSS 客户端 ───
let _ossClient = null;
function getOssClient() {
  if (_ossClient) return _ossClient;
  const K = window.KaleidoOSS || (typeof require === 'function' ? require('@hupu/kaleido-fed-sdk') : null);
  if (K) {
    _ossClient = new K({
      appId: 'b1AcxWKA1u0hyDYv5kXgImZBRSQ=',
      module: 'activity-screenshot-fed',
      path: '/screenshot/activity/fed',
      sk: 'HioGpkmGe9bsW0iqRLJEyGoLr4Q=',
      action: '1',
    });
    if (typeof _ossClient.start === 'function') _ossClient.start();
  }
  return _ossClient;
}

// ─── 上传到 OSS（4级降级） ───
function uploadToOSS(file, filename) {
  return new Promise((resolve, reject) => {
    // 1) ColorboxAI API
    if (window.ColorboxAI && window.ColorboxAI.oss && typeof window.ColorboxAI.oss.uploadFile === 'function') {
      window.ColorboxAI.oss.uploadFile({ file, filename })
        .then(res => resolve(res.downloadUrl || ''))
        .catch(reject);
      return;
    }
    // 2) postMessage Bridge（iframe）
    if (window.parent && window.parent !== window) {
      const callbackId = '_cb_up_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const timer = setTimeout(() => { cleanup(); reject(new Error('上传超时')); }, 30000);
      const handler = e => {
        const d = e.data;
        if (d && d.protocol === 'colorbox-ai-bridge' && d.type === 'oss.upload.callback' && d.payload && d.payload.callbackId === callbackId) {
          clearTimeout(timer); cleanup();
          d.payload.error ? reject(new Error(d.payload.error)) : resolve(d.payload.downloadUrl || '');
        }
      };
      const cleanup = () => window.removeEventListener('message', handler);
      window.addEventListener('message', handler);
      window.parent.postMessage({
        protocol: 'colorbox-ai-bridge', version: 1, direction: 'frame-to-host',
        type: 'oss.upload',
        payload: { file, filename, callbackId }
      }, '*');
      return;
    }
    // 3) KaleidoOSS 直连
    const client = getOssClient();
    if (client) {
      const ext = filename.lastIndexOf('.') >= 0 ? filename.slice(filename.lastIndexOf('.')) : '.png';
      const now = new Date();
      const key = `user-upload/${(now.getFullYear() % 100)}${now.getMonth() + 1}${now.getDate()}-${Math.random().toString(36).slice(-6)}${ext}`;
      client.multipartUpload(key, file, {})
        .then(res => resolve(res.downloadUrl || `https://activity-static.hoopchina.com.cn/${res.name}`))
        .catch(reject);
      return;
    }
    // 4) 无上传能力
    reject(new Error('No upload capability'));
  });
}

// ─── 安全跳转（统一走 ColorboxAI SDK，严禁 window.open/location.href） ───
function safeNavigate(url, target) {
  // 跳转前先埋点
  if (window.ColorboxAI && typeof window.ColorboxAI.track === 'function') {
    try { window.ColorboxAI.track({ event: 'navigate', url: url, target: target || '_blank' }); } catch (_) {}
  }
  // 优先使用 SDK 统一跳转 API
  if (window.ColorboxAI && typeof window.ColorboxAI.navigateTo === 'function') {
    return window.ColorboxAI.navigateTo(url, target || '_blank');
  }
  if (window.ColorboxAI && typeof window.ColorboxAI.openUrl === 'function') {
    return window.ColorboxAI.openUrl(url);
  }
  // 没有任何可用跳转能力时，仅打印警告，绝不自行 window.open/location.href
  console.warn('[safeNavigate] ColorboxAI navigateTo/openUrl 不可用，无法跳转:', url);
}

// ─── 一键发帖（从预览弹窗） ───
function sharePoster(btn) {
  // 如果预上传已完成，直接跳转，无感发帖
  if (_cachedPosterUploadUrl) {
    navigateWithImage(_cachedPosterUploadUrl);
    return;
  }
  
  // 需要等待上传，显示加载动画
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>上传中...';
  
  (async () => {
    try {
      let imageUrl;
      
      // 预上传还在进行中，等待它完成
      if (_uploadPromise) {
        showLoading('正在上传海报...');
        imageUrl = await _uploadPromise;
        hideLoading();
      }
      
      // 预上传失败或没有预上传，走传统链路
      if (!imageUrl) {
        const dataURL = _cachedPosterDataURL;
        if (!dataURL) {
          btn.disabled = false;
          btn.textContent = '📤 一键发帖';
          return;
        }
        showLoading('正在上传海报...');
        const blob = dataURLToBlob(dataURL);
        imageUrl = await uploadToOSS(blob, `马刺雷霆G7预测_${Date.now()}.png`);
        hideLoading();
      }
      
      imageUrl = imageUrl || '';
      const initialValue = {
        syncPost: true,
        appJsonV3: {
          activeTab: 'thread',
          data: {
            title: '',
            imageList: imageUrl ? [imageUrl] : [],
            content: '',
          },
        },
      };
      const tagName = encodeURIComponent('雷霆-马刺G7神预测');
      const link = `huputiyu://bbs/postImg?tagName=${tagName}&tagId=147647&topicName=${encodeURIComponent('湿乎乎的话题')}&topicId=177&initialValue=${encodeURIComponent(JSON.stringify(initialValue))}`;
      safeNavigate(link);
      closePoster();
    } catch (e) {
      console.error('发帖失败', e);
      hideLoading();
      btn.disabled = false;
      btn.textContent = '📤 一键发帖';
      alert('发帖失败，请重试');
    }
  })();
}

// 用已上传的图片 URL 直接跳转（无感发帖）
function navigateWithImage(imageUrl) {
  const initialValue = {
    syncPost: true,
    appJsonV3: {
      activeTab: 'thread',
      data: {
        title: '',
        imageList: imageUrl ? [imageUrl] : [],
        content: '',
      },
    },
  };
  const tagName = encodeURIComponent('雷霆-马刺G7神预测');
  const link = `huputiyu://bbs/postImg?tagName=${tagName}&tagId=147647&topicName=${encodeURIComponent('湿乎乎的话题')}&topicId=177&initialValue=${encodeURIComponent(JSON.stringify(initialValue))}`;
  safeNavigate(link);
  closePoster();
}
