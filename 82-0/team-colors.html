<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>82-0 球队配色展示</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #1a1a2e;
    color: #ecf0f1;
    padding: 40px 20px;
  }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-size: 48px;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #f1c40f, #d35400, #f1c40f);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .subtitle { text-align: center; color: #95a5a6; margin-bottom: 40px; font-size: 14px; letter-spacing: 2px; }

  .section-title {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    color: var(--gold, #f39c12);
    margin-bottom: 16px;
    letter-spacing: 2px;
  }
  .poster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
    margin-bottom: 48px;
  }
  .poster-swatch {
    border-radius: 8px;
    height: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.15s;
  }
  .poster-swatch:hover { transform: scale(1.08); z-index: 2; }
  .poster-swatch .hex {
    font-size: 9px;
    font-family: monospace;
    opacity: 0.75;
    margin-top: 1px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-4px); }
  .gradient-bar {
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .gradient-bar .logo-text {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .poster-bar {
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
    position: relative;
  }
  .poster-bar .poster-label {
    font-size: 10px;
    opacity: 0.7;
    letter-spacing: 1px;
  }
  .info {
    padding: 14px 16px;
  }
  .info .name-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .info .team-abbr {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 600;
  }
  .info .team-name {
    font-size: 13px;
    color: #95a5a6;
  }
  .color-chips {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .color-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-family: monospace;
    color: #95a5a6;
  }
  .color-chip .swatch {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.15);
  }
</style>
</head>
<body>
<div class="container">
  <h1>82-0</h1>
  <div class="subtitle">球队配色一览</div>

  <div class="section-title">📷 海报底色（纯色）</div>
  <div class="poster-grid" id="posterGrid"></div>

  <div class="section-title">🎨 阵容槽渐变</div>
  <div class="grid" id="grid"></div>
</div>
<script>
const TEAM_COLORS = {
  "ATL": ["#b42b33","#c76169"],"BKN": ["#c6c6c6","#505050"],"BOS": ["#488a50","#223425"],
  "CHA": ["#25225a","#384a7b"],"CHI": ["#d93831","#da2f2e"],"CLE": ["#860038","#BC945C"],
  "DAL": ["#2d6ab7","#c5cdd4"],"DEN": ["#418fde","#418fde"],"DET": ["#c42e47","#254f9d"],
  "GSW": ["#eeba4b","#283f85"],"HOU": ["#ad342c","#ffffff"],"IND": ["#eac962","#142356"],
  "LAC": ["#002650","#0b3666"],"LAL": ["#f1bc4b","#50247c"],"MEM": ["#14163b","#5d75ad"],
  "MIA": ["#a32a2e","#261c22"],"MIL": ["#dcd4b4","#304c38"],"MIN": ["#b6c8d3","#244f7d"],
  "NOP": ["#ae9b6d","#ae9b6d"],"NYK": ["#d86a34","#1c399f"],"OKC": ["#4876b6","#1c233d"],
  "ORL": ["#3053ad","#3053ae"],"PHI": ["#3063b0","#2f61af"],"PHX": ["#f6ca57","#c86d36"],
  "POR": ["#ab2f32","#6a1d1f"],"SAC": ["#55277f","#3a0e63"],"SAS": ["#c7cdd4","#34393d"],
  "TOR": ["#a2a2a4","#b12a32"],"UTA": ["#15203e","#14223e"],"WAS": ["#16213d","#bd2a33"]
};
const TEAM_CN = {
  ATL:"老鹰",BKN:"篮网",BOS:"凯尔特人",CHA:"黄蜂",CHI:"公牛",
  CLE:"骑士",DAL:"独行侠",DEN:"掘金",DET:"活塞",GSW:"勇士",
  HOU:"火箭",IND:"步行者",LAC:"快船",LAL:"湖人",MEM:"灰熊",
  MIA:"热火",MIL:"雄鹿",MIN:"森林狼",NOP:"鹈鹕",NYK:"尼克斯",
  OKC:"雷霆",ORL:"魔术",PHI:"76人",PHX:"太阳",POR:"开拓者",
  SAC:"国王",SAS:"马刺",TOR:"猛龙",UTA:"爵士",WAS:"奇才"
};

function textColor(bg) {
  const r = parseInt(bg.slice(1,3),16);
  const g = parseInt(bg.slice(3,5),16);
  const b = parseInt(bg.slice(5,7),16);
  return (r*0.299 + g*0.587 + b*0.114) > 140 ? '#1a1a2e' : '#ffffff';
}

const posterGrid = document.getElementById('posterGrid');
const grid = document.getElementById('grid');
const order = Object.keys(TEAM_COLORS);

// 海报底色 — 纯色块
order.forEach(abbr => {
  const c = TEAM_COLORS[abbr];
  const main = c[0];
  const name = TEAM_CN[abbr] || abbr;
  const txtColor = textColor(main);
  const swatch = document.createElement('div');
  swatch.className = 'poster-swatch';
  swatch.style.background = main;
  swatch.style.color = txtColor;
  swatch.innerHTML = `${abbr}<span class="hex">${main}</span>`;
  swatch.title = `${name} 海报底色`;
  posterGrid.appendChild(swatch);
});

// 完整卡片（渐变 + 海报色条 + 色值）
order.forEach(abbr => {
  const c = TEAM_COLORS[abbr];
  const main = c[0], sec = c[1] || main;
  const name = TEAM_CN[abbr] || abbr;
  const txtColor = textColor(main);
  const secName = abbr === 'HOU' ? '白' : sec;
  
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="gradient-bar" style="background:linear-gradient(135deg,${main},${sec});">
      <span class="logo-text" style="color:${txtColor}">${abbr}</span>
    </div>
    <div class="poster-bar" style="background:${main};color:${textColor(main)};">
      <span class="poster-label">海报底色</span>
    </div>
    <div class="info">
      <div class="name-row">
        <span class="team-abbr" style="color:${main}">${abbr}</span>
        <span class="team-name">${name}</span>
      </div>
      <div class="color-chips">
        <div class="color-chip">
          <span class="swatch" style="background:${main}"></span>
          ${main}
        </div>
        <div class="color-chip">
          <span class="swatch" style="background:${sec}"></span>
          ${sec}
        </div>
      </div>
    </div>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
