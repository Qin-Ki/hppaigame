      }

      .lineup-share::before,
      .lineup-share::after {
        content: "";
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .lineup-share::before {
        z-index: -3;
        background:
          linear-gradient(90deg, transparent 7%, var(--court) 7.3%, var(--court) 7.8%, transparent 8.1%, transparent 36.4%, var(--court) 36.7%, var(--court) 37.2%, transparent 37.5%, transparent 63.4%, var(--court) 63.7%, var(--court) 64.2%, transparent 64.5%, transparent 91.4%, var(--court) 91.7%, var(--court) 92.2%, transparent 92.5%),
          linear-gradient(180deg, transparent 11%, var(--court) 11.2%, var(--court) 11.6%, transparent 11.9%, transparent 57.6%, var(--court) 57.8%, var(--court) 58.2%, transparent 58.5%),
          radial-gradient(circle at 50% 24%, transparent 0 71px, var(--court) 72px 73px, transparent 74px),
          radial-gradient(circle at 50% 50%, transparent 0 107px, var(--court) 108px 109px, transparent 110px),
          radial-gradient(circle at 50% 88%, transparent 0 107px, var(--court) 108px 109px, transparent 110px),
          radial-gradient(circle at 50% 50%, rgba(140, 13, 16, 0.18), transparent 38%),
          #000;
        opacity: 0.72;
      }

      .lineup-share::after {
        z-index: -2;
        background:
          radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.04), transparent 16%),
          radial-gradient(circle at 50% 72%, rgba(120, 16, 18, 0.28), transparent 26%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.24), rgba(0, 0, 0, 0) 28%, rgba(0, 0, 0, 0.74) 100%);
      }

      .content-layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 390px;
        height: 844px;
        transform: scale(0.847156);
        transform-origin: top left;
      }

      .vertical-copy {
        display: none;
        position: absolute;
        top: 202px;
        color: rgba(255, 255, 255, 0.24);
        font-size: 12px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0;
        writing-mode: vertical-rl;
      }

      .vertical-copy.left {
        left: 16px;
        transform: rotate(180deg);
      }

      .vertical-copy.right {
        right: 12px;
        top: 660px;
      }

      .brand {
        display: grid;
        place-items: center;
        height: 136px;
        padding-top: 20px;
      }

      .brand-mark {
        display: none;
        position: relative;
        width: 64px;
        height: 58px;
        transform: rotate(-4deg) skewX(-4deg);
      }

      .brand-main {
        position: absolute;
        left: 2px;
        top: 8px;
        color: #fff;
        font-size: 44px;
        font-weight: 1000;
        line-height: 0.86;
        letter-spacing: 0;
        text-shadow: 0 1px 0 #fff;
      }

      .brand-jr {
        position: absolute;
        right: 0;
        top: 2px;
        color: #fff;
        font-family: Impact, "Arial Black", sans-serif;
        font-size: 14px;
        font-style: italic;
        line-height: 1;
      }

      .score-area {
        display: grid;
        grid-template-columns: 1fr 106px;
        column-gap: 18px;
        width: 421px;
        padding: 0 0 0 34px;
      }

      .score-area > div:last-child {
        justify-self: end;
        width: 106px;
      }

      .score-title,
      .rank-title {
        margin: 0;
        font-size: 19px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .rank-title {
        color: var(--gold);
        width: 106px;
        text-align: right;
      }

      .record {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-top: 9px;
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
        font-size: 66px;
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: 0;
      }

      .record .dash {
        margin: 0 -2px;
        font-size: 56px;
      }

      .record .loss {
        color: #8b8b8b;
      }

      .grade {
        width: 106px;
        margin-top: 5px;
        color: var(--gold);
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
        font-size: 82px;
        font-weight: 900;
        line-height: 0.92;
        text-align: right;
      }

      .roster {
        display: grid;
        gap: 16px;
        margin: 28px -31px 0 39px;
      }

      .player-card {
        --accent: var(--blue);
        position: relative;
        display: grid;
        grid-template-columns: 48px 1fr 58px;
        align-items: center;
        min-height: 62px;
        padding: 7px 12px 7px 14px;
        border: 2px solid var(--accent);
        background: rgba(0, 0, 0, 0.82);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.02),
          0 0 0 1px rgba(0, 0, 0, 0.6);
      }

      .player-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 6px;
        background: var(--accent);
      }

      .player-card > * {
        position: relative;
        z-index: 1;
      }

      .player-card:nth-child(1) {
        --accent: #05143c;
      }

      .player-card:nth-child(2) {
        --accent: #2f7fd6;
      }

      .player-card:nth-child(3) {
        --accent: #f5c653;
      }

      .player-card:nth-child(4) {
        --accent: #eee8cd;
      }

      .player-card:nth-child(5) {
        --accent: #d7e8ef;
      }

      .position {
        color: var(--accent);
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
        font-size: 25px;
        font-weight: 900;
        line-height: 1;
      }

      .name {
        min-width: 0;
        color: #fff;
        font-size: 23px;
        font-weight: 1000;
        line-height: 1.05;
        white-space: nowrap;
      }

      .name.long {
        font-size: 20px;
      }

      .meta {
        color: #5a5a5a;
        font-size: 20px;
        font-weight: 500;
        line-height: 1.35;
        text-align: right;
      }

      .list-title {
        margin: 15px 0 0 39px;
        font-size: 19px;
        font-weight: 900;
        line-height: 1.2;
      }

      .challenge {
        display: none;
        margin: 64px 0 0;
        color: #fff;
        font-size: 18px;

    <script>
      const fit = document.getElementById("pageFit");
      const DESIGN_WIDTH = 390;
      const DESIGN_HEIGHT = 715;

      function lockRatio() {
        const scale = Math.min(window.innerWidth / DESIGN_WIDTH, window.innerHeight / DESIGN_HEIGHT);
        fit.style.setProperty("--scale", String(scale));
      }

      window.addEventListener("resize", lockRatio, { passive: true });
      window.addEventListener("orientationchange", lockRatio, { passive: true });
      lockRatio();
