    .home-badge {

      border-radius: 20px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .portrait {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #2a2a36, #181e2a);
      border-radius: 60px;
      border: 2px solid rgba(245, 197, 66, 0.6);
      overflow: hidden;
    }
    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .fighter-info {

      min-width: 0;

      font-weight: 800;

      line-height: 1.3;
    }

      margin-top: 2px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 8px 0 4px;
      flex-wrap: wrap;
      align-items: center;
    }

    .board-scroll {
      width: 100%;
      overflow-x: visible;
      display: flex;
      justify-content: center;
      margin: 0 auto;
      position: relative;
    }
    .poster {
      position: relative;
      width: 100%;
      max-width: 656px;
      aspect-ratio: 656 / 918;
      background: radial-gradient(ellipse at 30% 25%, #2a2418, #0f131c);
      border-radius: 24px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(245, 197, 66, 0.3);
      overflow: hidden;
      margin: 0 auto;
    }

    .court-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .trophy-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
    }
    .trophy-emoji {
      font-size: 160px;
      filter: drop-shadow(0 0 20px rgba(245, 197, 66, 0.7));
      display: block;
    }
    .hoop-logo {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 72px;
      opacity: 0.75;
      pointer-events: none;
      z-index: 6;
    }

    .line-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .line-layer path {
      fill: none;
      stroke: rgba(210, 180, 110, 0.35);
      stroke-width: 1.6;
      stroke-linecap: round;
    }
    .line-layer path.hot {
      stroke: rgba(245, 197, 66, 0.7);
      filter: drop-shadow(0 0 3px #f5b642);
    }

    .ball-match {
      position: absolute;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .ball-pair {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }
    .ball-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .ball {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #e67e2e, #ac4f1a);
      border: 2px solid rgba(255, 220, 120, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: white;
      box-shadow: 0 4px 10px black;
      cursor: pointer;
      transition: 0.1s linear;
      position: relative;
      overflow: hidden;
    }
    .ball img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .ball.placeholder {
      background: #4a4f5e;
      border-color: rgba(255, 255, 255, 0.2);
      cursor: default;
    }
    .ball.winner {
      border-color: var(--gold, #f5c542);
      box-shadow: 0 0 18px currentColor;
      transform: scale(1.04);
    }
    .ball.loser {
      opacity: 0.28;
      filter: grayscale(0.6);
      transform: scale(0.92);
      cursor: pointer;
    }
    .ball-name {
      font-size: 9px;
      font-weight: 600;
      color: #e0e7ff;
      max-width: 70px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ball-r1 .ball {
      width: 40px;
      height: 40px;
      font-size: 10px;
    }
    .ball-r1 .ball-name {
      font-size: 7px;
      max-width: 55px;
    }
    .ball-r1 .ball-pair {
      gap: 4px;
    }

    .ball-r3 .ball {
      width: 60px;
      height: 60px;
      font-size: 15px;
    }
    .ball-final .ball {
      width: 74px;
      height: 74px;
      font-size: 18px;
      border-width: 3px;
    }
    .ball-final .ball-pair {
      gap: 10px;
    }

    .preview-overlay {

      align-items: center;
      justify-content: center;

      height: 100px;

      background: #2c313f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      height: 100%;

      color: #ddd;

      line-height: 1.4;
    }

      right: 20px;
      font-size: 28px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    .panel {

      border-radius: 40px;
      padding: 20px 16px;
      margin-top: 20px;
      text-align: center;
      transition: background 0.3s;
    }
    .result-preview {
      width: 100px;
      height: 100px;
      margin: 0 auto;
      border-radius: 60px;
      background: #1f2a38;
      border: 2px solid #f5c542;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .finalbtns {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .btn.red {
      background: linear-gradient(145deg, #c53a1c, #992e12);
      border: none;
    }
    .champion-header {
      text-align: center;
      margin-top: 28px;
      margin-bottom: 12px;
    }
    .champion-header h2 {
      font-size: 22px;
      color: #f5c542;
    }

    .btn.loading {
      opacity: 0.7;
      pointer-events: none;
      filter: saturate(0.8);
    }
    a.btn {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    img, .ball, .portrait, .result-preview, .preview-img-wrap {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: manipulation;
    }

    .preview-overlay {
      z-index: 99999 !important;
      pointer-events: auto !important;
    }

    .preview-card {
      position: relative !important;
      border-radius: 24px !important;
      pointer-events: auto !important;
    }

    .preview-img-wrap {
      width: 116px !important;
      height: 116px !important;
      margin: 0 auto 12px !important;
      border-radius: 16px !important;
      border: 2px solid rgba(245, 197, 66, 0.75) !important;
      background: #2c313f !important;
      overflow: hidden !important;
    }

    .preview-img-wrap img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border-radius: 0 !important;
      display: block !important;
      pointer-events: none !important;
    }

    .preview-close {
      z-index: 2 !important;
      width: 32px !important;
      height: 32px !important;
      line-height: 32px !important;
      text-align: center !important;
      border-radius: 50% !important;
      background: rgba(255,255,255,0.08) !important;

    body.preview-open {
      overflow: hidden;

    .btn-share {

      img.crossOrigin = 'anonymous';

  function drawRoundRect(ctx, x, y, w, h, r) { /* 原有 */ ctx.beginPath(); let rr = Math.min(r,w/2,h/2); ctx.moveTo(x+rr,y); ctx.lineTo(x+w-rr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+rr); ctx.lineTo(x+w,y+h-rr); ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h); ctx.lineTo(x+rr,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-rr); ctx.lineTo(x,y+rr); ctx.quadraticCurveTo(x,y,x+rr,y); ctx.closePath(); }

  function drawBracketLinesOnCanvas(ctx) {
    ctx.save();

    ctx.lineCap = 'round';
    links.forEach(([f, t]) => {
      const fp = positions[f], tp = positions[t];
      if (!fp || !tp) return;
      const fcx = fp.x + fp.w / 2;
      const tcx = tp.x + tp.w / 2;
      const fcy = fp.y + fp.h / 2;
      const tcy = tp.y + tp.h / 2;
      const goingDown = tcy >= fcy;
      const ax = fcx;
      const ay = goingDown ? fp.y + fp.h : fp.y;
      const bx = tcx;
      const by = goingDown ? tp.y : tp.y + tp.h;
      const midY = (ay + by) / 2;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax, midY);
      ctx.lineTo(bx, midY);
      ctx.lineTo(bx, by);
      if (matches[f]?.winner) {
        ctx.strokeStyle = 'rgba(245,197,66,.78)';

        ctx.shadowBlur = 0;
        ctx.lineWidth = 1.6;
      }
      ctx.stroke();
    });
    ctx.restore();
  }

  // ========== 通用上传工具 ==========
  function dataURLToBlob(dataURL) { let arr=dataURL.split(','), mime=arr[0].match(/:(.*?);/)?.[1]||'image/png', bstr=atob(arr[1]), n=bstr.length, u8arr=new Uint8Array(n); while(n--) u8arr[n]=bstr.charCodeAt(n); return new Blob([u8arr],{type:mime}); }
  function canvasToBlob(canvas, type='image/png', quality=0.95){ return new Promise((resolve,reject)=>{ if(canvas.toBlob) canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('toBlob failed')),type,quality); else resolve(dataURLToBlob(canvas.toDataURL(type,quality))); }); }
  function isValidImageUrl(url){ return typeof url==='string' && /^https?:\/\//i.test(url.trim()); }
  function normalizeUploadUrl(res){ if(!res) return ''; let candidates=[]; if(typeof res==='string') candidates.push(res); else if(typeof res==='object'){ candidates.push(res.url,res.ossUrl,res.fileUrl,res.imageUrl,res.downloadUrl,res.data?.url,res.result?.url,res.res?.requestUrls?.[0]?.split('?')[0]); }
    for(let u of candidates){ if(u&&typeof u==='string'){ u=u.trim(); if(u.startsWith('//')) u=`https:${u}`; if(isValidImageUrl(u)) return u; } } return ''; }
  function makeUploadFile(blob,filename){ try{ return new File([blob],filename,{type:blob.type||'image/png'}); }catch(e){ blob.name=filename; return blob; } }
  async function waitForBridge(timeout=2500){ let start=Date.now(); while(Date.now()-start<timeout){ if(window.ColorboxAI?.oss?.uploadFile||window.ColorboxAI?.uploadFile||window.ColorboxAI?.uploadImage||window.KaleidoOSS||(window.parent&&window.parent!==window)) return true; await new Promise(r=>setTimeout(r,120)); } return false; }
  async function uploadToOSS(blob, filename){
    debugLog('bridge_wait_start'); await waitForBridge(); debugLog('bridge_wait_done',{hasColorboxAI:!!window.ColorboxAI,hasKaleido:!!window.KaleidoOSS});
    let file=makeUploadFile(blob,filename);
    let attempts=[];
    if(window.ColorboxAI?.oss?.uploadFile) attempts.push(['ColorboxAI.oss.uploadFile(file,filename)',()=>window.ColorboxAI.oss.uploadFile(file,filename)],['ColorboxAI.oss.uploadFile({file,filename})',()=>window.ColorboxAI.oss.uploadFile({file,filename})]);
    if(window.ColorboxAI?.uploadFile) attempts.push(['ColorboxAI.uploadFile(file,filename)',()=>window.ColorboxAI.uploadFile(file,filename)]);
    if(window.ColorboxAI?.uploadImage) attempts.push(['ColorboxAI.uploadImage(file,filename)',()=>window.ColorboxAI.uploadImage(file,filename)]);
    if(window.KaleidoOSS?.multipartUpload) attempts.push(['KaleidoOSS.multipartUpload(filename,file)',()=>window.KaleidoOSS.multipartUpload(filename,file)]);
    for(let [method,run] of attempts){
      try{ let res=await run(); let url=normalizeUploadUrl(res); if(isValidImageUrl(url)){ debugLog('upload_success',{method,url}); return url; } }catch(e){ debugLog('upload_attempt_failed',{method,error:e?.message}); }
    }
    if(window.parent && window.parent!==window){
      let dataURL=await new Promise((resolve,reject)=>{ let reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=reject; reader.readAsDataURL(file); });
      let requestId=`oss_${Date.now()}_${Math.random()}`;
      let p=new Promise((resolve,reject)=>{
        let timer=setTimeout(()=>reject(new Error('postMessage timeout')),15000);
        let handler=(e)=>{ let d=e.data||{}; if(d.requestId===requestId){ clearTimeout(timer); window.removeEventListener('message',handler); let url=normalizeUploadUrl(d); if(isValidImageUrl(url)) resolve(url); else reject(new Error(d.error||'postMessage invalid url')); } };
        window.addEventListener('message',handler);
        window.parent.postMessage({type:'HUPU_OSS_UPLOAD',requestId,filename,dataURL},'*');
      });
      let url=await p; if(isValidImageUrl(url)) return url;
    }
    throw new Error('OSS_UPLOAD_UNAVAILABLE');
  }

  function normalizeUploadUrl(res){
    if(!res) return '';
    const candidates=[];
    if(typeof res==='string') candidates.push(res);
    if(typeof res==='object'){
      candidates.push(
        res.url,res.ossUrl,res.fileUrl,res.imageUrl,res.downloadUrl,res.src,
        res.data?.url,res.data?.ossUrl,res.data?.fileUrl,res.data?.imageUrl,res.data?.downloadUrl,res.data?.src,
        res.result?.url,res.result?.ossUrl,res.result?.fileUrl,res.result?.imageUrl,res.result?.downloadUrl,res.result?.src,
        res.res?.requestUrls?.[0]?.split('?')[0]
      );
    }
    for(let url of candidates){
      if(!url || typeof url !== 'string') continue;
      url = url.trim();
      if(url.startsWith('//')) url = `https:${url}`;
      if(/^https?:\/\//i.test(url)) return url;
    }
    return '';
  }

  function isValidImageUrl(url){
    return typeof url === 'string' && /^https?:\/\//i.test(url.trim());
  }

  function dataURLToBlob(dataURL) {
    const arr = dataURL.split(',');
    const mime = arr[0].match(/:(.*?);/)?.[1] || 'image/png';
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while(n--) u8arr[n] = bstr.charCodeAt(n);
    return new Blob([u8arr], { type: mime });
  }

  function canvasToBlob(canvas, type='image/png', quality=0.95){
    return new Promise((resolve,reject)=>{
      if(canvas.toBlob){
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('canvas toBlob failed')), type, quality);
        return;
      }
      try { resolve(dataURLToBlob(canvas.toDataURL(type, quality))); }
      catch(e) { reject(e); }
    });
  }

  function makeUploadFile(blob, filename){
    try { return new File([blob], filename, { type: blob.type || 'image/png' }); }
    catch(e) { blob.name = filename; blob.fileName = filename; return blob; }
  }

  async function waitForBridge(timeout=2600){
    const start=Date.now();
    while(Date.now()-start<timeout){
      if(window.ColorboxAI?.oss?.uploadFile || window.ColorboxAI?.uploadFile || window.ColorboxAI?.uploadImage || window.ColorboxAI?.upload || window.KaleidoOSS || (window.parent && window.parent !== window)) return true;
      await new Promise(r=>setTimeout(r,120));
    }
    return false;
  }

  async function tryUploadAttempt(method, run){
    debugLog('upload_attempt_start', { method });
    try{
      const res = await run();
      const url = normalizeUploadUrl(res);
      debugLog('upload_attempt_result', { method, rawType: typeof res, normalizedUrl: url });
      if(isValidImageUrl(url)) return url;
      throw new Error('UPLOAD_RETURN_INVALID_URL');
    }catch(e){
      debugLog('upload_attempt_failed', { method, error: e?.message || String(e) });
      return '';
    }
  }

  async function uploadToOSS(blob, filename){
    debugLog('bridge_wait_start');
    await waitForBridge();
    debugLog('bridge_wait_done', {
      hasColorboxAI: !!window.ColorboxAI,
      hasColorboxAIOss: !!window.ColorboxAI?.oss,
      hasKaleidoOSS: !!window.KaleidoOSS,
      hasParent: !!(window.parent && window.parent !== window)
    });

    const file = makeUploadFile(blob, filename);
    const attempts=[];

    if(window.ColorboxAI?.oss?.uploadFile){
      const upload = window.ColorboxAI.oss.uploadFile;
      attempts.push(
        ['ColorboxAI.oss.uploadFile(file, filename)', () => upload(file, filename)],
        ['ColorboxAI.oss.uploadFile(file)', () => upload(file)],
        ['ColorboxAI.oss.uploadFile({file, filename})', () => upload({ file, filename })],
        ['ColorboxAI.oss.uploadFile({file, fileName})', () => upload({ file, fileName: filename })],
        ['ColorboxAI.oss.uploadFile({blob, filename})', () => upload({ blob: file, filename })]
      );
    }
    if(window.ColorboxAI?.uploadFile){
      const upload = window.ColorboxAI.uploadFile;
      attempts.push(
        ['ColorboxAI.uploadFile(file, filename)', () => upload(file, filename)],
        ['ColorboxAI.uploadFile(file)', () => upload(file)],
        ['ColorboxAI.uploadFile({file, filename})', () => upload({ file, filename })],
        ['ColorboxAI.uploadFile({file, fileName})', () => upload({ file, fileName: filename })]
      );
    }
    if(window.ColorboxAI?.uploadImage){
      const upload = window.ColorboxAI.uploadImage;
      attempts.push(
        ['ColorboxAI.uploadImage(file, filename)', () => upload(file, filename)],
        ['ColorboxAI.uploadImage(file)', () => upload(file)],
        ['ColorboxAI.uploadImage({file, filename})', () => upload({ file, filename })]
      );
    }
    if(window.ColorboxAI?.upload){
      const upload = window.ColorboxAI.upload;
      attempts.push(
        ['ColorboxAI.upload(file, filename)', () => upload(file, filename)],
        ['ColorboxAI.upload(file)', () => upload(file)],
        ['ColorboxAI.upload({file, filename})', () => upload({ file, filename })]
      );
    }
    if(window.KaleidoOSS){
      attempts.push(
        ['KaleidoOSS.multipartUpload(filename, file)', () => window.KaleidoOSS.multipartUpload?.(filename, file)],
        ['KaleidoOSS.multipartUpload(file, filename)', () => window.KaleidoOSS.multipartUpload?.(file, filename)],
        ['KaleidoOSS.uploadFile(file, filename)', () => window.KaleidoOSS.uploadFile?.(file, filename)],
        ['KaleidoOSS.uploadFile({file, filename})', () => window.KaleidoOSS.uploadFile?.({ file, filename })]
      );
    }

    for(const [method, run] of attempts){
      const url = await tryUploadAttempt(method, run);
      if(isValidImageUrl(url)) return url;
    }

    if(window.ColorboxAI?.uploadBase64 || window.ColorboxAI?.uploadDataURL || (window.parent && window.parent !== window)){
      const dataURL = await new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      if(window.ColorboxAI?.uploadBase64){
        const base64 = String(dataURL).split(',')[1] || '';
        const url = await tryUploadAttempt('ColorboxAI.uploadBase64', () => window.ColorboxAI.uploadBase64({ base64, filename, fileName: filename, mimeType: file.type || 'image/png' }));
        if(isValidImageUrl(url)) return url;
      }
      if(window.ColorboxAI?.uploadDataURL){
        const url = await tryUploadAttempt('ColorboxAI.uploadDataURL', () => window.ColorboxAI.uploadDataURL({ dataURL, filename, fileName: filename, mimeType: file.type || 'image/png' }));
        if(isValidImageUrl(url)) return url;
      }
      if(window.parent && window.parent !== window){
        const url = await tryUploadAttempt('postMessage:HUPU_OSS_UPLOAD', () => new Promise((resolve,reject)=>{
          const requestId = `oss_${Date.now()}_${Math.random().toString(16).slice(2)}`;
          const timer = setTimeout(()=>{ window.removeEventListener('message', onMessage); reject(new Error('postMessage upload timeout')); }, 15000);
          function onMessage(event){
            const data = event.data || {};
            if(data.requestId !== requestId) return;
            clearTimeout(timer);
            window.removeEventListener('message', onMessage);
            const url = normalizeUploadUrl(data) || normalizeUploadUrl(data.data) || normalizeUploadUrl(data.result);
            if(isValidImageUrl(url)) resolve(url);
            else reject(new Error(data.error || 'postMessage upload failed'));
          }
          window.addEventListener('message', onMessage);
          window.parent.postMessage({ type:'HUPU_OSS_UPLOAD', requestId, filename, fileName: filename, mimeType: file.type || 'image/png', dataURL }, '*');
        }));
        if(isValidImageUrl(url)) return url;
      }
    }
    throw new Error('OSS_UPLOAD_UNAVAILABLE');
  }

      `topicId=${encodeURIComponent(POST_CONFIG.TOPIC_ID)}`,
      `forumName=${encodeURIComponent(POST_CONFIG.FORUM_NAME)}`,
      `forumId=${encodeURIComponent(POST_CONFIG.FORUM_ID)}`,
      `boardName=${encodeURIComponent(POST_CONFIG.BOARD_NAME)}`,
      `boardId=${encodeURIComponent(POST_CONFIG.BOARD_ID)}`,
      `tagName=${encodeURIComponent(POST_CONFIG.TAG_NAME)}`,
      `tagId=${encodeURIComponent(POST_CONFIG.TAG_ID)}`,
      `initialValue=${encodeURIComponent(JSON.stringify(initialValue))}`
    ].join('&');
    return `huputiyu://bbs/postImg?${query}`;
  }

  function safeNavigate(url, target='_self'){
    if(window.ColorboxAI?.navigateTo){ debugLog('navigate_post', { mode:'ColorboxAI.navigateTo' }); return window.ColorboxAI.navigateTo(url); }
    if(window.ColorboxAI?.openUrl){ debugLog('navigate_post', { mode:'ColorboxAI.openUrl' }); return window.ColorboxAI.openUrl(url); }
    if(target === '_blank'){ debugLog('navigate_post', { mode:'window.open' }); return window.open(url, '_blank'); }
    debugLog('navigate_post', { mode:'location.href' });
    window.location.href = url;
  }

  // ========== 生成海报（弹窗预览） ==========
  async function generatePoster(){
    const overlay = document.getElementById('posterOverlay');
    const img = document.getElementById('posterPreviewImg');
    img.src = '';
    overlay.classList.add('active');
    img.style.opacity = '0.5';
    try{
      const canvas = await createStableChampionPosterCanvas();
      window.__posterCanvas = canvas;
      const dataURL = canvas.toDataURL('image/png');
      img.src = dataURL;
      img.style.opacity = '1';
    }catch(e){
      debugLog('generate_poster_failed', { error: e?.message });
      img.alt = '海报生成失败';
      img.style.opacity = '1';
    }
  }

  function closePoster(){
    document.getElementById('posterOverlay').classList.remove('active');
  }

  async function savePosterToAlbum(){
    const btn = document.getElementById('posterSaveBtn');
    const oldText = btn.innerHTML;
    btn.innerHTML = '⏳ 保存中...';
    btn.disabled = true;
    try{
      const canvas = window.__posterCanvas || await createStableChampionPosterCanvas();
      const blob = await canvasToBlob(canvas, 'image/png', 0.95);
      const file = new File([blob], `champion_${Date.now()}.png`, { type: 'image/png' });
      // 优先使用 Web Share API（iOS/Android 均可保存到相册）
      if(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({ files: [file], title: '历史最强冠军球队' });
          btn.innerHTML = oldText;
          btn.disabled = false;
          return;
        }catch(e){
          if(e.name === 'AbortError'){ btn.innerHTML = oldText; btn.disabled = false; return; }
        }
      }
      // 兜底：创建下载链接
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `champion_${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1500);
      btn.innerHTML = oldText;
      btn.disabled = false;
    }catch(e){
      debugLog('save_poster_failed', { error: e?.message });
      btn.innerHTML = '❌ 保存失败';
      setTimeout(() => { btn.innerHTML = oldText; btn.disabled = false; }, 2000);
    }
  }

  async function sharePoster(btn){
    if(!btn) return;
    const oldText = btn.innerHTML;
    btn.innerHTML = '⏳ 上传中...';
    btn.disabled = true;
    debugLog('share_start');
    let imageUrl = '';
    let uploadError = '';
    try{
      const canvas = window.__posterCanvas || await createStableChampionPosterCanvas();
      debugLog('canvas_created', { width: canvas.width, height: canvas.height });
      const blob = await canvasToBlob(canvas, 'image/png', 0.95);
      debugLog('blob_created', { size: blob.size, type: blob.type });
      btn.innerHTML = '⏳ 上传中...';
      debugLog('upload_start');
      imageUrl = await uploadToOSS(blob, `champion_${Date.now()}.png`);
      if(!isValidImageUrl(imageUrl)) throw new Error('OSS返回值不是可访问图片URL');
      debugLog('upload_success', { imageUrl });
    }catch(e){
      uploadError = e?.message || String(e);
      debugLog('upload_failed', { error: uploadError });
      imageUrl = '';
    }
    const initialValue = buildInitialValue(imageUrl);
    const url = buildPostUrl(initialValue);
    btn.innerHTML = oldText;
    btn.disabled = false;
    closePoster();
    setTimeout(()=>safeNavigate(url), 260);
  }

  document.querySelector("#homeStartBtn").addEventListener("click",()=>showScreen(introScreen));
  document.querySelector("#homeOtherBtn").addEventListener("click",()=>safeNavigate(`huputiyu://bbs/topicTag?tagId=${POST_CONFIG.TAG_ID}`));
  document.querySelector("#startBtn").addEventListener("click",()=>{ buildMatches(shuffle([...teamsData])); renderTournament(); showScreen(tournamentScreen); });
  document.querySelector("#redrawBtn").addEventListener("click",()=>{ buildMatches(shuffle([...teamsData])); renderTournament(); });
  document.querySelector("#backIntroBtn").addEventListener("click",()=>showScreen(introScreen));
  let previewOverlay=document.querySelector("#playerPreview"); previewOverlay.addEventListener("click",(e)=>{ if(e.target===previewOverlay) hideTeamPreview(); }); previewOverlay.querySelector(".preview-close").addEventListener("click",()=>hideTeamPreview());
  document.getElementById('posterShareBtn').addEventListener('click',(e)=>sharePoster(e.currentTarget));
  document.getElementById('posterSaveBtn').addEventListener('click',()=>savePosterToAlbum());
  document.getElementById('posterCloseBtn').addEventListener('click',()=>closePoster());
  document.getElementById('posterOverlay').addEventListener('click',(e)=>{ if(e.target===e.currentTarget) closePoster(); });
  renderRoster(); buildMatches(shuffle([...teamsData])); renderTournament();
</script>
</body>
</html>
