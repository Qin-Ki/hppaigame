/* ---- 正反方计数和占比更新 ---- */
window._factionCounts = { pro: 0, con: 0 };

function updateFactionRatio() {
  var counts = window._factionCounts;
  var total = counts.pro + counts.con;
  var ratioEl = document.getElementById('factionRatio');
  var proBar = document.getElementById('ratioPro');
  var conBar = document.getElementById('ratioCon');
  var proPct = document.getElementById('ratioProPct');
  var conPct = document.getElementById('ratioConPct');
  if (total === 0) { ratioEl.style.display = 'none'; return; }
  ratioEl.style.display = 'flex';
  var pctPro = (counts.pro / total * 100).toFixed(1);
  var pctCon = (counts.con / total * 100).toFixed(1);
  proBar.style.width = pctPro + '%';
  conBar.style.width = pctCon + '%';
  proBar.className = 'faction-ratio-bar-inner pro' + (pctPro >= 100 ? ' full' : '');
  conBar.className = 'faction-ratio-bar-inner con' + (pctCon >= 100 ? ' full' : '');
  proPct.textContent = pctPro + '%';
  conPct.textContent = pctCon + '%';
}

/* ---- 标签页帖子计数 ---- */
function updateTabCounts() {
  var allCards = document.querySelectorAll('#threadList .thread-card');
  var all = allCards.length;
  var pro = 0, con = 0;
  allCards.forEach(function(c) {
    if (c.dataset.faction === 'pro') pro++;
    else if (c.dataset.faction === 'con') con++;
  });
  var elAll = document.getElementById('countAll');
  var elPro = document.getElementById('countPro');
  var elCon = document.getElementById('countCon');
  if (elAll) elAll.textContent = all;
  if (elPro) elPro.textContent = pro;
  if (elCon) elCon.textContent = con;
}

/* ---- 正反方筛选页签 ---- */
function applyCurrentFilter() {
  var activeTab = document.querySelector('#factionTabs .faction-tab.active');
  if (!activeTab) return;
  var filter = activeTab.dataset.filter;
  document.querySelectorAll('#threadList .thread-card').forEach(function(card) {
    if (filter === 'all' || filter === 'latest' || card.dataset.faction === filter) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
  document.querySelectorAll('#threadList .post-prompt-wrap').forEach(function(w) {
    w.style.display = (filter === 'all') ? '' : 'none';
  });
}

function sortThreads(filter) {
  var list = document.getElementById('threadList');
  var cards = Array.from(list.querySelectorAll('.thread-card'));
  var prompts = Array.from(list.querySelectorAll('.post-prompt-wrap'));
  // 先把按钮从 DOM 中移除
  prompts.forEach(function(p) { p.remove(); });
  if (filter === 'latest') {
    // 最新：按原始顺序排列
    cards.sort(function(a, b) { return (parseInt(a.dataset.index) || 0) - (parseInt(b.dataset.index) || 0); });
  } else {
    // 全部/正方/反方：按回复数倒序
    cards.sort(function(a, b) { return (parseInt(b.dataset.replies) || 0) - (parseInt(a.dataset.replies) || 0); });
  }
  cards.forEach(function(c) { list.appendChild(c); });
  updateTabCounts();
  // 按等差数列（5,15,30,50…）重新插入按钮
  var pos = 5, gap = 5;
  prompts.forEach(function(p) {
    var idx = pos - 1;
    if (idx < cards.length) {
      list.insertBefore(p, cards[idx].nextSibling);
    } else {
      list.appendChild(p);
    }
    gap += 5;
    pos += gap;
  });
}

(function() {
  var tabContainer = document.getElementById('factionTabs');
  var tabPosMap = { all:'TC8', pro:'TC9', con:'TC10', latest:'TC11' };
  var tabLabelMap = { all:'全部', pro:'正方', con:'反方', latest:'最新' };
  tabContainer.addEventListener('click', function(e) {
    var tab = e.target.closest('.faction-tab');
    if (!tab) return;
    var filter = tab.dataset.filter;
    try { window.ColorboxAI.track({act:'click', blk:'BMC098', pos:tabPosMap[filter]||'TC8', label:tabLabelMap[filter]||filter}); } catch(ex) {}
    tabContainer.querySelectorAll('.faction-tab').forEach(function(t) { t.className = 'faction-tab'; });
    var cls = 'faction-tab active';
    if (filter !== 'all' && filter !== 'latest') {
      cls += ' ' + filter;
    }
    tab.className = cls;
    // 先对所有帖子按评论排序，再根据筛选条件隐藏
    sortThreads(filter);
    applyCurrentFilter();
  });
})();

/* ---- 等差数列发帖按钮计数器 ---- */
var totalPostCount = 0;    // 全局已渲染帖子总数
var nextPromptAt = 5;      // 下一次出现按钮的位置
var promptGap = 5;         // 当前间隔（每次+5）

function renderThreads(list) {
  var fragment = document.createDocumentFragment();
  var posIndex = 1;
  list.forEach(function(item) {
    var title = item.title || "无标题";
    var userName = item.userName || "虎扑JR";
    var userHeader = item.userHeader || "https://avatar.hoopchina.com.cn/avatar_default.png";
    var replies = item.replies || 0;
    var threadId = item.tid || item.threadId || item.id;
    var fallbackUrl = threadId ? "huputiyu://bbs/topic/" + threadId + "?entrance=7" : "#";

    var card = document.createElement("div");
    card.className = "thread-card";
    card.style.cursor = "pointer";

    var coverImgUrl = "";
    if (item.picList && item.picList.length > 0) {
      var firstPic = item.picList[0];
      coverImgUrl = typeof firstPic === 'object' ? firstPic.url : firstPic;
    }
    var coverImgHtml = coverImgUrl ? '<img class="thread-card-cover" src="' + coverImgUrl + '" alt="cover" loading="lazy">' : '';

    // 判断阵营：API 数据 > 封面图颜色分析 > 奇偶模拟
    var side = item.tagName || item.side || '';
    var useColorDetect = false;
    var factionKey = '';
    if (!side && coverImgUrl) {
      useColorDetect = true;
      factionKey = '';
      // 先用空标签，分析完成后更新
    } else if (!side) {
      side = (posIndex % 2 === 1) ? '正方' : '反方';
      factionKey = (side === '正方') ? 'pro' : 'con';
    } else {
      factionKey = (side === '正方' || side === 'pro') ? 'pro' : 'con';
    }
    // 生成阵营标签 HTML（颜色分析时先隐藏）
    var factionBadgeHtml = '';
    if (useColorDetect) {
      factionBadgeHtml = '<span class="thread-card-faction" style="display:none"></span>';
    } else if (side) {
      var fc = (side === '正方' || side === 'pro') ? 'pro' : 'con';
      var fl = (side === 'pro') ? '正方' : (side === 'con') ? '反方' : side;
      factionBadgeHtml = '<span class="thread-card-faction ' + fc + '">' + fl + '</span>';
    }

    // 正文预览（截取部分正文）
    var contentHtml = '';
    function findText(obj) {
      if (!obj || typeof obj !== 'object') return '';
      var candidates = ['content','body','summary','abstract','text','digest','desc','description','intro','message','brief','textContent','plainText'];
      for (var i = 0; i < candidates.length; i++) {
        if (typeof obj[candidates[i]] === 'string' && obj[candidates[i]].length > 5) return obj[candidates[i]];
      }
      for (var k in obj) {
        if (obj.hasOwnProperty(k) && typeof obj[k] === 'object' && !Array.isArray(obj[k])) {
          var r = findText(obj[k]);
          if (r) return r;
        }
      }
      return '';
    }
    var bodyText = findText(item);
    if (!bodyText) {
      if (item.picList && item.picList.length > 0 && typeof item.picList[0] === 'object' && item.picList[0].desc) {
        bodyText = item.picList[0].desc;
      }
    }
    if (bodyText) {
      var stripped = bodyText.replace(/<[^>]*>/g, '').trim();
      if (stripped) {
        var safe = stripped.substring(0, 120)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
        contentHtml = '<div class="thread-card-content"><span class="highlight-badge">亮评</span>' + safe + '</div>';
      }
    }

    card.innerHTML = '<div class="thread-card-header">'
      + '<div class="thread-card-author">'
      + factionBadgeHtml
      + '<img class="thread-card-avatar" src="' + userHeader + '" alt="avatar">'
      + '<span class="thread-card-name">' + userName + '</span>'
      + '</div>'
      + '<span class="thread-card-replies">' + replies + ' 回复</span>'
      + '</div>'
      + '<div class="thread-card-body">'
      + coverImgHtml
      + '<p class="thread-card-text">' + title + '</p>'
      + '</div>'
      + contentHtml;

    // 设置 data-faction 用于筛选
    if (factionKey) {
      card.dataset.faction = factionKey;
      window._factionCounts[factionKey]++;
    }
    // 存回复数和原始顺序用于排序
    card.dataset.replies = replies;
    card.dataset.index = posIndex;

    // 点击埋点
    var pos = "T" + posIndex;
    var pid = threadId || "";
    card.addEventListener("click", function(e) {
      try { window.ColorboxAI.track({act:'click', blk:'BMC099', pos:pos, label:pid}); } catch(ex) {}
      if (fallbackUrl && fallbackUrl !== '#') window.ColorboxAI.navigateTo(fallbackUrl);
    });
    // 曝光埋点
    card.dataset.pos = pos;
    card.dataset.pid = pid;

    fragment.appendChild(card);

    // 封面图颜色分析识别阵营
    if (useColorDetect && coverImgUrl) {
      (function(cardEl, imgUrl) {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
          var cvs = document.createElement('canvas');
          cvs.width = cvs.height = 40;
          var ctx = cvs.getContext('2d');
          ctx.drawImage(img, 0, 0, 40, 40);
          try {
            var d = ctx.getImageData(0, 0, 40, 40).data;
            var red = 0, blue = 0;
            for (var i = 0; i < d.length; i += 4) {
              var r = d[i], g = d[i+1], b = d[i+2];
              if (r > b + 30 && r > g + 15) red++;
              if (b > r + 30 && b > g + 15) blue++;
            }
            var result = red >= blue ? '正方' : '反方';
            var resultKey = (result === '正方') ? 'pro' : 'con';
            var badge = cardEl.querySelector('.thread-card-faction');
            if (badge) {
              var cls = (result === '正方') ? 'pro' : 'con';
              badge.textContent = result;
              badge.className = 'thread-card-faction ' + cls;
              badge.style.display = '';
            }
            // 设置 data-faction 并更新计数
            cardEl.dataset.faction = resultKey;
            window._factionCounts[resultKey]++;
            updateFactionRatio();
            updateTabCounts();
          } catch(e) {
            // CORS 受限，忽略
          }
        };
        img.onerror = function() {};
        img.src = imgUrl;
      })(card, coverImgUrl);
    }

    // 等差数列插入"我也来发帖"按钮：第一次在第5个后，第二次隔10个，以5递增
    totalPostCount++;
    console.log('[DEBUG] post #' + totalPostCount + ' nextPromptAt=' + nextPromptAt + ' promptGap=' + promptGap);
    if (totalPostCount === nextPromptAt) {
      console.log('[DEBUG] >>> 插入按钮，totalPostCount=' + totalPostCount);
      var promptWrap = document.createElement('div');
      promptWrap.className = 'post-prompt-wrap';
      var promptBtn = document.createElement('button');
      promptBtn.className = 'post-prompt-btn';
      promptBtn.innerHTML = '<span class="icon">✏️</span> 聊聊我的看法';
      promptBtn.addEventListener('click', function() { try { window.ColorboxAI.track({act:'click', blk:'BMC098', pos:'TC4', label:'聊聊我的看法'}); } catch(ex) {} showFactionModal(); });
      promptWrap.appendChild(promptBtn);
      fragment.appendChild(promptWrap);
      promptGap += 5;
      nextPromptAt += promptGap;
      console.log('[DEBUG] >>> 更新后 nextPromptAt=' + nextPromptAt + ' promptGap=' + promptGap);
    }

    posIndex++;
  });
  threadListEl.appendChild(fragment);
  // 初始加载直接按回复数倒序排列
  sortThreads('all');
  updateFactionRatio();
  // 如果有激活的筛选，对新卡片也应用筛选（sortThreads 内已调用 updateTabCounts）
  applyCurrentFilter();

  // 曝光监听（IntersectionObserver）
  if (!window._threadObserver) {
    window._threadObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting && !entry.target.dataset.exposed) {
          entry.target.dataset.exposed = "1";
          try {
            window.ColorboxAI.track({act:'exposure', blk:'BMC099', pos:entry.target.dataset.pos, label:entry.target.dataset.pid});
          } catch(ex) {}
        }
      });
    }, { threshold: 0.5 });
  }
  var newCards = threadListEl.querySelectorAll('.thread-card:not([data-observer-bound])');
  newCards.forEach(function(c) {
    c.dataset.observerBound = "1";
    window._threadObserver.observe(c);
  });
}
