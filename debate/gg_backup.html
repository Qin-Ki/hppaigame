<script>
(function() {
  /* ---- ColorboxAI.bbs fallback（参考 newtodo 实现） ---- */
  if (!window.ColorboxAI) window.ColorboxAI = {};
  if (!window.ColorboxAI.bbs || typeof window.ColorboxAI.bbs.getTopicThreads !== 'function') {
    var hostMap = { dev: 'https://enterprise-stg.hupu.com', sit: 'https://enterprise.hupu.com', stg: 'https://enterprise-stg.hupu.com', prod: 'https://enterprise.hupu.com' };
    function env() { var h = location.host; if (h.indexOf('dev')>=0||h.indexOf('local')>=0) return 'dev'; if (h.indexOf('-sit')>=0) return 'sit'; if (h.indexOf('-stg')>=0) return 'stg'; return 'prod'; }
    function apiHost() { return hostMap[env()] || hostMap.prod; }
    function token() { var i = window.userInfo || (window.HupuBridge && window.HupuBridge.nainfo) || {}; return i.authToken || i.token || ''; }
    function req(url) {
      var h = { 'Content-Type': 'application/json;charset=UTF-8' };
      var t = token(); if (t) h['X-Hupu-Token'] = t;
      return fetch(url, { credentials: 'include', headers: h }).then(function(r) { if (!r.ok) throw new Error('req failed: '+r.status); return r.json(); });
    }
    window.ColorboxAI.bbs = {
      getTopicThreads: function(p) {
        p = p || {};
        var tagId = p.tagId || p.topicId;
        if (!tagId) return Promise.reject(new Error('getTopicThreads requires tagId'));
        var q = new URLSearchParams();
        q.set('tagId', tagId);
        q.set('tabType', p.tabType || '0');
        q.set('page', String(p.page || 1));
        q.set('lastCursor', p.lastCursor || '');
        return req(apiHost() + '/api/activity/tagThreadList?' + q.toString());
      },
      getPostDetail: function() { return Promise.reject(new Error('not implemented')); },
      getPostReplyList: function() { return Promise.reject(new Error('not implemented')); },
      buildPostSchema: function() { return ''; },
      openPostEditor: function() { return ''; }
    };
  }
})();
</script>

<script>
/* ---- 动态抓取讨论区（newtodo 方式） ---- */
var topicConfig = { tagId: "148208", tabType: "1", maxPages: 5 };
var currentPage = 1, currentCursor = "", isRequesting = false;
var threadListEl = document.getElementById("threadList");
var listStatusEl = document.getElementById("listStatus");
var loadMoreBtnEl = document.getElementById("loadMoreBtn");

function showStatus(text) {
  if (text) { listStatusEl.style.display = "block"; listStatusEl.textContent = text; }
  else { listStatusEl.style.display = "none"; }
}

async function fetchTopicThreads() {
  if (isRequesting) return;
  if (currentPage > topicConfig.maxPages) {
    showStatus("已展示全部深度好帖");
    loadMoreBtnEl.style.display = "none";
    return;
  }
  isRequesting = true;
  showStatus("JR们的内容正在路上...");
  loadMoreBtnEl.style.display = "none";
  try {
    if (!window.ColorboxAI || !window.ColorboxAI.bbs || typeof window.ColorboxAI.bbs.getTopicThreads !== 'function')
      throw new Error("ENVIRONMENT_ERROR");
    var response = await window.ColorboxAI.bbs.getTopicThreads({
      tagId: topicConfig.tagId, tabType: topicConfig.tabType, page: currentPage, lastCursor: currentCursor
    });
    if (!response || !response.data) throw new Error(response ? response.message : "DATA_ERROR");
    var list = response.data.list || [];
    var cursor = response.data.cursor || "";
    var nextPage = response.data.nextPage || false;
    if (list.length === 0 && currentPage === 1) { showStatus("该话题下暂无内容，快去首发一发！"); return; }
    renderThreads(list);
    currentCursor = cursor; currentPage++;
    if (nextPage && currentPage <= topicConfig.maxPages) { showStatus(""); loadMoreBtnEl.style.display = "block"; }
    else { showStatus("已展示全部深度好帖"); loadMoreBtnEl.style.display = "none"; }
  } catch (error) {
    console.error("Fetch threads failed:", error);
    if (error.message === "ENVIRONMENT_ERROR") showStatus("请在虎扑 App 内查看讨论区");
    else { showStatus("内容开小差了，点击按钮重试"); loadMoreBtnEl.style.display = "block"; loadMoreBtnEl.textContent = "重试加载"; }
  } finally { isRequesting = false; }
}

/* ---- 等差数列发帖按钮计数器 ---- */
var totalPostCount = 0;    // 全局已渲染帖子总数
var nextPromptAt = 5;      // 下一次出现按钮的位置
var promptGap = 5;         // 当前间隔（每次+5）

function renderThreads(list) {
  var fragment = document.createDocumentFragment();
  var posIndex = 1;
  list.forEach(function(item) {
    var title = item.title || "无标题";
    var userName = item.userName || "虎扑JR";
    var userHeader = item.userHeader || "https://avatar.hoopchina.com.cn/avatar_default.png";
    var replies = item.replies || 0;
    var threadId = item.tid || item.threadId || item.id;
    var fallbackUrl = threadId ? "huputiyu://bbs/topic/" + threadId + "?entrance=7" : "#";

    var card = document.createElement("div");
    card.className = "thread-card";
    card.style.cursor = "pointer";

    var coverImgUrl = "";
    if (item.picList && item.picList.length > 0) {
      var firstPic = item.picList[0];
      coverImgUrl = typeof firstPic === 'object' ? firstPic.url : firstPic;
    }
    var coverImgHtml = coverImgUrl ? '<img class="thread-card-cover" src="' + coverImgUrl + '" alt="cover" loading="lazy">' : '';

    // 判断阵营：API 数据 > 封面图颜色分析 > 奇偶模拟
    var side = item.tagName || item.side || '';
    var useColorDetect = false;
    if (!side && coverImgUrl) {
      useColorDetect = true;
      // 先用空标签，分析完成后更新
    } else if (!side) {
      side = (posIndex % 2 === 1) ? '正方' : '反方';
    }
    // 生成阵营标签 HTML（颜色分析时先隐藏）
    var factionBadgeHtml = '';
    if (useColorDetect) {
      factionBadgeHtml = '<span class="thread-card-faction" style="display:none"></span>';
    } else if (side) {
      var fc = (side === '正方' || side === 'pro') ? 'pro' : 'con';
      var fl = (side === 'pro') ? '正方' : (side === 'con') ? '反方' : side;
      factionBadgeHtml = '<span class="thread-card-faction ' + fc + '">' + fl + '</span>';
    }

    card.innerHTML = '<div class="thread-card-header">'
      + '<div class="thread-card-author">'
      + factionBadgeHtml
      + '<img class="thread-card-avatar" src="' + userHeader + '" alt="avatar">'
      + '<span class="thread-card-name">' + userName + '</span>'
      + '</div>'
      + '<span class="thread-card-replies">' + replies + ' 回复</span>'
      + '</div>'
      + '<div class="thread-card-body">'
      + coverImgHtml
      + '<p class="thread-card-text">' + title + '</p>'
      + '</div>';

    // 点击埋点
    var pos = "T" + posIndex;
    var pid = threadId || "";
    card.addEventListener("click", function(e) {
      try { window.ColorboxAI.track({act:'click', blk:'BMC099', pos:pos, label:pid}); } catch(ex) {}
      if (fallbackUrl && fallbackUrl !== '#') window.ColorboxAI.navigateTo(fallbackUrl);
    });
    // 曝光埋点
    card.dataset.pos = pos;
    card.dataset.pid = pid;

    fragment.appendChild(card);

    // 封面图颜色分析识别阵营
    if (useColorDetect && coverImgUrl) {
      (function(cardEl, imgUrl) {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
          var cvs = document.createElement('canvas');
          cvs.width = cvs.height = 40;
          var ctx = cvs.getContext('2d');
          ctx.drawImage(img, 0, 0, 40, 40);
          try {
            var d = ctx.getImageData(0, 0, 40, 40).data;
            var red = 0, blue = 0;
            for (var i = 0; i < d.length; i += 4) {
              var r = d[i], g = d[i+1], b = d[i+2];
              if (r > b + 30 && r > g + 15) red++;
              if (b > r + 30 && b > g + 15) blue++;
            }
            var result = red >= blue ? '正方' : '反方';
            var badge = cardEl.querySelector('.thread-card-faction');
            if (badge) {
              var cls = (result === '正方') ? 'pro' : 'con';
              badge.textContent = result;
              badge.className = 'thread-card-faction ' + cls;
              badge.style.display = '';
            }
          } catch(e) {
            // CORS 受限，忽略
          }
        };
        img.onerror = function() {};
        img.src = imgUrl;
      })(card, coverImgUrl);
    }

    // 等差数列插入"我也来发帖"按钮：第一次在第5个后，第二次隔10个，以5递增
    totalPostCount++;
    console.log('[DEBUG] post #' + totalPostCount + ' nextPromptAt=' + nextPromptAt + ' promptGap=' + promptGap);
    if (totalPostCount === nextPromptAt) {
      console.log('[DEBUG] >>> 插入按钮，totalPostCount=' + totalPostCount);
      var promptWrap = document.createElement('div');
      promptWrap.className = 'post-prompt-wrap';
      var promptBtn = document.createElement('button');
      promptBtn.className = 'post-prompt-btn';
      promptBtn.innerHTML = '<span class="icon">✏️</span> 聊聊我的看法';
      promptBtn.addEventListener('click', function() { try { window.ColorboxAI.track({act:'click', blk:'BMC098', pos:'TC4', label:'聊聊我的看法'}); } catch(ex) {} showFactionModal(); });
      promptWrap.appendChild(promptBtn);
      fragment.appendChild(promptWrap);
      promptGap += 5;
      nextPromptAt += promptGap;
      console.log('[DEBUG] >>> 更新后 nextPromptAt=' + nextPromptAt + ' promptGap=' + promptGap);
    }

    posIndex++;
  });
  threadListEl.appendChild(fragment);

  // 曝光监听（IntersectionObserver）
  if (!window._threadObserver) {
    window._threadObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting && !entry.target.dataset.exposed) {
          entry.target.dataset.exposed = "1";
          try {
            window.ColorboxAI.track({act:'exposure', blk:'BMC099', pos:entry.target.dataset.pos, label:entry.target.dataset.pid});
          } catch(ex) {}
        }
      });
    }, { threshold: 0.5 });
  }
  var newCards = threadListEl.querySelectorAll('.thread-card:not([data-observer-bound])');
  newCards.forEach(function(c) {
    c.dataset.observerBound = "1";
    window._threadObserver.observe(c);
  });
}

loadMoreBtnEl.addEventListener("click", function() {
  try { window.ColorboxAI.track({act:'click', blk:'BMC098', pos:'TC5', label:'加载更多讨论'}); } catch(ex) {}
  loadMoreBtnEl.textContent = "加载更多讨论";
  fetchTopicThreads();
});

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fetchTopicThreads);
else fetchTopicThreads();

/* ---- hot-bottom 跳转（URL 由常量配置，先埋点再跳转） ---- */
(function() {
  var HOT_BOTTOM_URL = 'huputiyu://bbs/topicTag?tagId=148208';
  var el = document.querySelector('.hot-bottom');
  el.addEventListener('click', function(e) {
    e.preventDefault();
    try { window.ColorboxAI.track({act:'click', blk:'BMC098', pos:'TC3'}); } catch(ex) {}
    try { window.ColorboxAI.navigateTo(HOT_BOTTOM_URL, '_self'); } catch(ex) {}
  });
})();

/* ---- 正反方选择弹窗 ---- */
var factionOverlay = document.getElementById('factionOverlay');
var factionOptions = document.querySelectorAll('.faction-option');
var factionCloseBtn = document.getElementById('factionModalClose');

// 正方 / 反方发帖链接（取自 debate-img）
var POST_URLS = {};
(function() {
  var base = 'huputiyu://bbs/postImg?tagName=' + encodeURIComponent('常规赛交锋战绩对季后赛对局的参考价值大吗？') + '&tagId=148208&topicName=' + encodeURIComponent('湿乎乎的话题') + '&topicId=177&';
  var proImg = 'https://i1.hoopchina.com.cn/newsPost/6124df58ef2aa6d6e081ea2df0404325_w_600_h_600_.png';
  var conImg = 'https://i5.hoopchina.com.cn/newsPost/4050650bfc81b580b46f0f7318b5d26d_w_600_h_600_.png';
  POST_URLS.pro = base + 'initialValue=' + encodeURIComponent(JSON.stringify({syncPost:true,appJsonV3:{activeTab:'thread',data:{title:'',imageList:[proImg],content:''}}}));
  POST_URLS.con = base + 'initialValue=' + encodeURIComponent(JSON.stringify({syncPost:true,appJsonV3:{activeTab:'thread',data:{title:'',imageList:[conImg],content:''}}}));
})();

function showFactionModal() {
  factionOverlay.classList.add('active');
}

function hideFactionModal() {
  factionOverlay.classList.remove('active');
}

// 选择阵营后跳转
factionOptions.forEach(function(opt) {
  opt.addEventListener('click', function() {
    var side = opt.getAttribute('data-side');
    var url = POST_URLS[side];
    if (url) {
      hideFactionModal();
      try { window.ColorboxAI.track({act:'click', blk:'BMC098', pos:'TC6', label:side === 'pro' ? '正方' : '反方'}); } catch(ex) {}
      window.ColorboxAI.navigateTo(url);
    }
  });
});

// 关闭弹窗
factionCloseBtn.addEventListener('click', hideFactionModal);
factionOverlay.addEventListener('click', function(e) {
  if (e.target === factionOverlay) hideFactionModal();
});
</script>

</body>
