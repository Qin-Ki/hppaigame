<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA 天下第一武道会 - 对战</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: #071426 url('red.jpg') center/cover fixed;
      color: #fff;
      font-family: "Bahnschrift", "DIN Condensed", "Arial Narrow", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; cursor: pointer; }

    .top-banner { width: 100%; display: block; margin: 0 auto; max-width: 980px; border-radius: 12px 12px 0 0; }
    .app { min-height: 100vh; padding: 16px; }
    .screen { display: none; max-width: 980px; margin: 0 auto; }
    .screen.active { display: block; }

    .hero { margin-bottom: 8px; }
    h2 { font-size: clamp(24px, 5vw, 36px); margin: 0; line-height: 1.1; }
    .subtitle { margin-top: 4px; color: rgba(255,255,255,.62); font-size: 12px; line-height: 1.5; opacity: .7; }

    .board-scroll { width: 100%; overflow-x: auto; padding: 0; }

    .poster {
      position: relative;
      width: 100%;
      min-width: 620px;
      max-width: 880px;
      aspect-ratio: 656 / 918;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 0 0 12px 12px;
      box-shadow: 0 24px 64px rgba(0,0,0,.46);
    }

    /* 背景装饰已移除 */

    .ball-match {
      position: absolute; z-index: 4;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .ball-pair {
      display: flex; align-items: center; gap: 4px; pointer-events: auto;
    }
    .ball-side {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
    }

    .ball {
      width: 50px; height: 50px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.25);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 16px; font-weight: 1000;
      cursor: pointer; transition: all .2s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,.5);
      background:
        radial-gradient(circle at 36% 34%, rgba(255,255,255,.22), transparent 42%),
        radial-gradient(circle at 50% 50%, #e88a3a, #c85a1a 70%, #a04010);
      text-shadow: 0 1px 3px rgba(0,0,0,.5);
      position: relative; overflow: hidden;
    }
    .ball img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; border-radius: 50%;
    }
    .ball.placeholder {
      background: radial-gradient(circle at 36% 34%, rgba(255,255,255,.08), transparent 42%),
        radial-gradient(circle at 50% 50%, #3a3a3a, #222);
      border-color: rgba(255,255,255,.1); cursor: default;
    }
    .ball.winner {
      border-color: #ffd166;
      box-shadow: 0 0 20px rgba(255,209,102,.5), 0 4px 12px rgba(0,0,0,.5);
      background:
        radial-gradient(circle at 36% 34%, rgba(255,255,255,.3), transparent 42%),
        radial-gradient(circle at 50% 50%, #f0b040, #d48820 70%, #b06810);
      transform: scale(1.08);
    }
    .ball.loser { opacity: .28; filter: grayscale(.6); transform: scale(.92); }
    .ball.disabled { cursor: default; }
    .ball-vs {
      font-size: 9px; font-weight: 1000; color: rgba(255,255,255,.4);
      margin: 0 1px;
    }
    .ball-name {
      font-size: 9px; font-weight: 1000; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
      white-space: nowrap; max-width: 70px; overflow: hidden;
      text-overflow: ellipsis; text-align: center; line-height: 1.15;
    }
    .ball-name.placeholder { color: rgba(255,255,255,.45); }

    /* 轮次大小 */
    .ball-r1 .ball { width: 44px; height: 44px; font-size: 14px; }
    .ball-r1 .ball-name { font-size: 8px; max-width: 60px; }
    .ball-r1 .ball-vs { font-size: 8px; }
    .ball-r3 .ball { width: 62px; height: 62px; font-size: 20px; }
    .ball-r3 .ball-name { font-size: 12px; max-width: 90px; }
    .ball-r3 .ball-vs { font-size: 12px; }

    /* 决赛 */
    .ball-final .ball-pair { gap: 14px; }
    .ball-final .ball { width: 64px; height: 64px; font-size: 20px; border-width: 2.5px; }
    .ball-final .ball-vs { font-size: 14px; }
    .ball-final .ball.winner {
      box-shadow: 0 0 32px rgba(255,209,102,.6), 0 6px 18px rgba(0,0,0,.5);
    }
    .ball-final .champion-tag {
      font-size: 8px; font-weight: 1000; color: #ffd166;
      text-shadow: 0 1px 6px rgba(255,209,102,.4); margin-top: 2px; letter-spacing: .06em;
    }

    /* 预览弹窗 */
    .preview-overlay {
      position: fixed; inset: 0; z-index: 999;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.72); backdrop-filter: blur(4px);
    }
    .preview-card {
      background: linear-gradient(180deg, #1e2538, #141a2a);
      border: 1px solid rgba(255,255,255,.12); border-radius: 16px;
      padding: 32px 28px 28px; max-width: 320px; width: 80vw;
      text-align: center; box-shadow: 0 32px 80px rgba(0,0,0,.6);
      position: relative;
    }
    .preview-close {
      position: absolute; top: 8px; right: 12px;
      background: none; border: none; color: rgba(255,255,255,.5);
      font-size: 28px; cursor: pointer; line-height: 1; padding: 4px;
    }
    .preview-close:hover { color: #fff; }
    .preview-img-wrap {
      width: 160px; height: 160px; margin: 0 auto 16px;
      border-radius: 12px; overflow: hidden;
      background: linear-gradient(135deg, #f28c28, #ffd166);
      box-shadow: 0 12px 32px rgba(0,0,0,.4);
    }
    .preview-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .preview-name { font-size: 22px; font-weight: 1000; margin-bottom: 8px; }
    .preview-note { color: rgba(255,255,255,.62); font-size: 14px; line-height: 1.5; }


    .btn {
      min-height: 42px; padding: 0 18px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.12); color: #fff;
      background: rgba(255,255,255,.07); font-weight: 1000;
      transition: transform .16s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { border: 0; color: #071018; background: linear-gradient(135deg, #f28c28, #ffd166); }
    .btn:disabled { cursor: not-allowed; opacity: .45; transform: none; }

    .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }

    /* ─── 海报生成按钮 ─── */
    .btn-poster {
      min-height: 42px; padding: 0 18px; border-radius: 8px;
      border: 0; color: #071018;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      font-weight: 1000; font-family: inherit;
      transition: transform .16s ease;
    }
    .btn-poster:hover { transform: translateY(-2px); }
    .btn-poster:disabled { cursor: not-allowed; opacity: .45; transform: none; }
    .btn-link {
      min-height: 42px; padding: 0 18px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.12); color: #fff;
      background: rgba(255,255,255,.07); font-weight: 1000;
      font-family: inherit; text-decoration: none; display: inline-flex;
      align-items: center; justify-content: center;
      transition: transform .16s ease;
    }
    .btn-link:hover { transform: translateY(-2px); }

    /* ─── 海报预览弹窗 ─── */
    #posterOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.92);
      z-index: 1000; display: none; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }
    #posterOverlay.active { display: flex; }
    #posterOverlay img {
      max-width: 100%; max-height: 75vh; border-radius: 12px;
      box-shadow: 0 0 40px rgba(124,58,237,.3);
    }
    #posterOverlay .poster-actions {
      display: flex; flex-direction: column; gap: 10px;
      width: 100%; max-width: 340px; margin-top: 20px;
    }
    #posterOverlay .poster-actions button {
      width: 100%; padding: 14px; border: none; border-radius: 50px;
      font-size: 1em; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    #posterOverlay .btn-share {
      background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff;
    }
    #posterOverlay .poster-close {
      background: rgba(255,255,255,.1); color: #888; margin-top: 4px;
    }

    /* ─── 加载动画 ─── */
    .spinner {
      width: 24px; height: 24px; border: 3px solid rgba(255,255,255,.2);
      border-top-color: #a855f7; border-radius: 50%;
      animation: spin .8s linear infinite; display: inline-block;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 620px) {
      .poster { min-width: 0; max-width: none; }
      .app { padding: 8px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <img class="top-banner" src="toppic.png" alt="">
    <!-- 对战页面 -->
    <section id="tournament" class="screen active" aria-label="赛事对阵图">
      <div class="hero">
        <div>
          <h2 id="roundTitle">天下第一武道会</h2>
          <p id="roundCopy" class="subtitle">点击你认为武艺更胜一筹的球员头像晋级</p>
        </div>
      </div>
      <div class="board-scroll">
        <div id="poster" class="poster"></div>
      </div>
      <canvas id="posterCanvas" style="display:none"></canvas>
      <div class="actions" id="actionsEnd">
        <button id="restartBtn" class="btn" type="button">重新开始</button>
        <button class="btn-poster" id="posterBtn" onclick="generatePoster()" style="display:none">📷 生成海报</button>
        <a class="btn-link" href="javascript:void(0)" onclick="safeNavigate('huputiyu://bbs/topicTag?tagId=147546')" style="display:none" id="topicLinkBtn">🏆 查看其他JR预测</a>
      </div>
    </section>

    <!-- 海报预览弹窗 -->
    <div id="posterOverlay">
      <img id="posterPreviewImg" alt="海报预览">
      <div class="poster-actions">
        <button class="btn-share" onclick="sharePoster(this)">📤 一键发帖</button>
        <button class="poster-close" onclick="closePoster()">关闭</button>
      </div>
    </div>

    <!-- 预览弹窗 -->
    <div id="playerPreview" class="preview-overlay" style="display:none">
      <div class="preview-card">
        <button class="preview-close" type="button">&times;</button>
        <div class="preview-img-wrap">
          <img id="previewImg" src="" alt="">
        </div>
        <div class="preview-name" id="previewName"></div>
        <div class="preview-note" id="previewNote"></div>
      </div>
    </div>


  </main>

  <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.17.1.min.js"></script>
  <script src="https://activity-static.hoopchina.com.cn/colorbox-activities/js/kaleido-fed-sdk.js"></script>
  <script>
    const fighters = [
      { id: 1, name: "狄龙", imageUrl: "https://i10.hoopchina.com.cn/editor/3e64f5ec3c3e9c09d7c53599f64b3c9b_w_1040_h_760_.png?x-oss-process=image/resize,w_800/format,webp", note: "恶棍龙，搞心态之王" },
      { id: 2, name: "追梦", imageUrl: "https://i1.hoopchina.com.cn/editor/c4cf23d04f4d81458e4ca705d0d9e528_w_1040_h_760_.png?x-oss-process=image/resize,w_800/format,webp", note: "一阳指、巨龙锁等武艺的唯一传人" },
      { id: 3, name: "本-华莱士", imageUrl: "https://i1.hoopchina.com.cn/editor/c0dcdca83fbd499ca53448079d740a70_w_1040_h_760_.png", note: "阿泰斯特一生的噩梦" },
      { id: 4, name: "斯图尔特", imageUrl: "https://i3.hoopchina.com.cn/editor/95be9062eb500bc99b94db0355769582_w_1040_h_760_.png?x-oss-process=image/resize,w_800/format,webp", note: "王侯将相，宁有种乎" },
      { id: 5, name: "阿泰斯特", imageUrl: "https://i5.hoopchina.com.cn/editor/1ec941b7210517cf9caa54b45498f096_w_1040_h_760_.png?x-oss-process=image/resize,w_800/format,webp", note: "一肘打穿哈登任督二脉" },
      { id: 6, name: "詹姆斯-约翰逊", imageUrl: "https://i3.hoopchina.com.cn/newsPost/1299bce3ef272d78690a3d1d9a495b6f_w_1040_h_760_.png?x-oss-process=image/resize,w_800/format,webp", note: "格斗之神" },
      { id: 7, name: "卡尔-马龙", imageUrl: "https://i5.hoopchina.com.cn/editor/be6399a8a6bf414e69133c6842e34126_w_1040_h_760_.png?x-oss-process=image/resize,w_800/format,webp", note: "肘昏微笑刺客，脚踹圣城石佛" },
      { id: 8, name: "兰比尔", imageUrl: "https://i3.hoopchina.com.cn/editor/eac02567627689ebf30c1e17f3b349c2_w_720_h_601_.png?x-oss-process=image/resize,w_800/format,webp", note: "号称史上最肮脏的「恶汉」" },
      { id: 9, name: "约基奇", imageUrl: "https://i3.hoopchina.com.cn/editor/f350578222002fab0a0327313993d348_w_1040_h_760_.png?x-oss-process=image/resize,w_800/format,webp", note: "憨态可掬，两个哥哥也是眉清目秀" },
      { id: 10, name: "里克-马洪", imageUrl: "https://i10.hoopchina.com.cn/editor/babb29ca45457abb9fe8c95ec0f362f6_w_263_h_192_.png?x-oss-process=image/resize,w_800/format,webp", note: "「坏孩子军团」中的金牌打手" },
      { id: 11, name: "科米特-华盛顿", imageUrl: "https://i5.hoopchina.com.cn/editor/2fd558d35cf0c27256da89854ab74406_w_388_h_341_.png?x-oss-process=image/resize,w_800/format,webp", note: "一拳打出脑浆的人物" },
      { id: 12, name: "莫宁", imageUrl: "https://i10.hoopchina.com.cn/editor/581ba88fdccb983de411722678b72de2_w_1040_h_760_.png?x-oss-process=image/resize,w_800/format,webp", note: "麦迪逊流传着他的传说" },
      { id: 13, name: "罗德曼", imageUrl: "https://i3.hoopchina.com.cn/editor/8b95bd792447bc99bf73a3b23b831416_w_1040_h_760_.png?x-oss-process=image/resize,w_800/format,webp", note: "让麦当娜腿软的男人" },
      { id: 14, name: "斯蒂芬-杰克逊", imageUrl: "https://i10.hoopchina.com.cn/editor/5fa080e121d37d0f81ca9a54ac69a321_w_600_h_436_.png?x-oss-process=image/resize,w_800/format,webp", note: "「武圣」，无需多言" },
      { id: 15, name: "巴克利", imageUrl: "https://i3.hoopchina.com.cn/editor/1998d8bc7ca56ade8180b52ff194581b_w_1040_h_760_.png?x-oss-process=image/resize,w_800/format,webp", note: "单臂掀翻奥尼尔的恐怖存在" },
      { id: 16, name: "奥克利", imageUrl: "https://i10.hoopchina.com.cn/editor/7eb4b6909de0c7122b972dd029dc3146_w_1040_h_760_.png?x-oss-process=image/resize,w_800/format,webp", note: "乔帮主的黄金保镖" }
    ];

    // ─── 预加载所有选手头像（供海报 Canvas 使用） ───
    const loadedFighterImages = {};
    (function preloadFighterImages() {
      fighters.forEach(f => {
        if (f.imageUrl) {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.src = f.imageUrl;
          loadedFighterImages[f.id] = img;
        }
      });
    })();

    const matchOrderByRound = [
      ["M1","M2","M3","M4","M5","M6","M7","M8"],
      ["M9","M10","M11","M12"],
      ["M13","M14"],
      ["M15"]
    ];

    const positions = {
      M1:{x:17,y:42,w:148,h:73}, M2:{x:175,y:42,w:148,h:73},
      M3:{x:333,y:42,w:148,h:73}, M4:{x:491,y:42,w:148,h:73},
      M9:{x:96,y:162,w:148,h:73}, M10:{x:412,y:162,w:148,h:73},
      M13:{x:254,y:292,w:148,h:73},
      M15:{x:128,y:390,w:400,h:124,final:true},
      M14:{x:254,y:560,w:148,h:73},
      M11:{x:96,y:686,w:148,h:73}, M12:{x:412,y:686,w:148,h:73},
      M5:{x:17,y:808,w:148,h:73}, M6:{x:175,y:808,w:148,h:73},
      M7:{x:333,y:808,w:148,h:73}, M8:{x:491,y:808,w:148,h:73}
    };

    const tournament = document.querySelector("#tournament");
    const poster = document.querySelector("#poster");
    const roundTitle = document.querySelector("#roundTitle");
    const roundCopy = document.querySelector("#roundCopy");

    let matches = {};

    function initials(name) { return name.slice(0, Math.min(2, name.length)); }

    function makeMatch(id, label, a, b, fromA, fromB) {
      return { id, label, a, b, fromA, fromB, winner: null };
    }

    function buildMatches(draw) {
      matches = {};
      for (let i = 1; i <= 8; i++) {
        matches[`M${i}`] = makeMatch(`M${i}`, `M${i}`, draw[(i-1)*2], draw[(i-1)*2+1]);
      }
      matches.M9  = makeMatch("M9","M9",null,null,"M1","M2");
      matches.M10 = makeMatch("M10","M10",null,null,"M3","M4");
      matches.M11 = makeMatch("M11","M11",null,null,"M5","M6");
      matches.M12 = makeMatch("M12","M12",null,null,"M7","M8");
      matches.M13 = makeMatch("M13","M13",null,null,"M9","M10");
      matches.M14 = makeMatch("M14","M14",null,null,"M11","M12");
      matches.M15 = makeMatch("M15","决赛",null,null,"M13","M14");
      resolveAllSlots();
    }

    function resolveAllSlots() {
      ["M9","M10","M11","M12","M13","M14","M15"].forEach(id => {
        const m = matches[id];
        m.a = matches[m.fromA]?.winner || { name: "待定", placeholder: true };
        m.b = matches[m.fromB]?.winner || { name: "待定", placeholder: true };
      });
    }

    function isMatchReady(id) {
      const m = matches[id];
      return m && !m.a?.placeholder && !m.b?.placeholder;
    }

    function getMatchSide(match, side) { return side === "A" ? match.a : match.b; }
    function canClick(match, side) {
      const p = getMatchSide(match, side);
      return isMatchReady(match.id) && !p?.placeholder;
    }

    function percentX(px) { return (px/656*100).toFixed(2); }
    function percentY(px) { return (px/918*100).toFixed(2); }
    function percentW(px) { return (px/656*100).toFixed(2); }
    function percentH(px) { return (px/918*100).toFixed(2); }

    function ballState(match, side) {
      const p = getMatchSide(match, side);
      const cls = [];
      if (p?.placeholder) cls.push("placeholder");
      if (!canClick(match, side)) cls.push("disabled");
      if (match.winner) {
        cls.push(match.winner.id === p?.id ? "winner" : "loser");
      }
      const can = canClick(match, side);
      return { p, cls: cls.join(" "), disabled: !can || (match.winner && match.winner.id === p?.id) };
    }

    function renderBall(match, side) {
      const { p, cls, disabled } = ballState(match, side);
      const inner = p?.placeholder ? "?" : p?.imageUrl ? `<img crossorigin="anonymous" src="${p.imageUrl}" alt="${p.name}">` : initials(p?.name||"");
      return `<div class="ball-side"><button class="ball ${cls}" type="button" data-match="${match.id}" data-side="${side}" ${disabled?"disabled":""}>${inner}</button><span class="ball-name${p?.placeholder?" placeholder":""}">${p?.name||""}</span></div>`;
    }

    function ballRoundClass(id) {
      const n = parseInt(id.slice(1));
      if (n<=8) return "ball-r1";
      if (n<=12) return "";
      if (n<=14) return "ball-r3";
      return "";
    }

    function renderBallMatch(match) {
      const pos = positions[match.id];
      const finalClass = pos.final ? "ball-final" : "";
      const roundClass = ballRoundClass(match.id);
      return `<div class="ball-match ${finalClass} ${roundClass}" style="left:${percentX(pos.x)}%;top:${percentY(pos.y)}%;width:${percentW(pos.w)}%;height:${percentH(pos.h)}%;"><div class="ball-pair">${renderBall(match,"A")}${renderBall(match,"B")}</div></div>`;
    }

    function renderPosterInto(el) {
      el.innerHTML = `${Object.keys(positions).map(id=>renderBallMatch(matches[id])).join("")}`;
    }

    function renderTournament() {
      resolveAllSlots();
      roundTitle.textContent = '首届"天下第一武道会"';
      roundCopy.textContent = "点击你认为武艺更胜一筹的球员头像，使其晋级下一轮";
      renderPosterInto(poster);
      poster.querySelectorAll("[data-match][data-side]").forEach(btn => {
        btn.addEventListener("click", () => pickWinner(btn.dataset.match, btn.dataset.side));
        longPress(btn, () => {
          const m = matches[btn.dataset.match];
          const p = getMatchSide(m, btn.dataset.side);
          if (p && !p.placeholder) showPreview(p);
        });
      });
      // 冠军产生后显示海报按钮和话题链接
      const champion = matches.M15?.winner;
      document.getElementById('posterBtn').style.display = champion ? 'inline-flex' : 'none';
      document.getElementById('topicLinkBtn').style.display = champion ? 'inline-flex' : 'none';
      if (champion) {
        roundCopy.textContent = `🏆 冠军诞生！${champion.name} 荣获「天下第一武道会」总冠军！`;
      }
    }

    /* 长按预览 */
    let _pressTimer = null;
    function longPress(el, cb) {
      el.addEventListener("pointerdown", (e) => { e.stopPropagation(); _pressTimer = setTimeout(cb,500); });
      el.addEventListener("pointerup", cancelPress);
      el.addEventListener("pointerleave", cancelPress);
      el.addEventListener("pointercancel", cancelPress);
    }
    function cancelPress() { clearTimeout(_pressTimer); _pressTimer = null; }

    const previewOverlay = document.querySelector("#playerPreview");
    const previewImg = document.querySelector("#previewImg");
    const previewName = document.querySelector("#previewName");
    const previewNote = document.querySelector("#previewNote");

    function showPreview(player) {
      previewImg.src = player.imageUrl || "";
      previewImg.alt = player.name || "";
      previewName.textContent = player.name || "";
      previewNote.textContent = player.note || "";
      previewOverlay.style.display = "flex";
    }
    function hidePreview() { previewOverlay.style.display = "none"; }
    previewOverlay.addEventListener("click", (e) => { if (e.target===previewOverlay) hidePreview(); });
    previewOverlay.querySelector(".preview-close").addEventListener("click", hidePreview);

    function pickWinner(matchId, side) {
      const match = matches[matchId];
      if (!match || !isMatchReady(matchId)) return;
      const player = getMatchSide(match, side);
      if (!player || player.placeholder) return;
      match.winner = player;
      clearFutureMatches(matchId);
      renderTournament();
    }

    function clearFutureMatches(changedMatchId) {
      Object.values(matches).forEach(m => { if (dependsOn(m.id, changedMatchId)) m.winner = null; });
    }
    function dependsOn(matchId, sourceId) {
      const m = matches[matchId];
      if (!m || !m.fromA) return false;
      if (m.fromA===sourceId || m.fromB===sourceId) return true;
      return dependsOn(m.fromA, sourceId) || dependsOn(m.fromB, sourceId);
    }

    /* 初始化：直接开始对战 */
    function startTournament() {
      buildMatches(fighters);
      renderTournament();
    }

    document.querySelector("#restartBtn").addEventListener("click", () => {
      startTournament();
    });

    startTournament();

    // ─── 海报生成 ───
    const POSTER_W = 500, POSTER_H = 680, POSTER_SCALE = 2;

    function getChampion() {
      return matches.M15?.winner || null;
    }

    function drawPoster(ctx, w, h) {
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#0e0e1e'); bg.addColorStop(.5, '#16162a'); bg.addColorStop(1, '#0e0e1e');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

      // ─── 辅助：在圆形区域内绘制头像（不拉伸） ───
      function drawAvatar(cx, cy, r, player, isWinner, isChamp) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.clip();
        // 背景底色
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
        // 绘制头像（保持比例，填满圆形）
        if (player && !player.placeholder && player.imageUrl) {
          const img = loadedFighterImages[player.id];
          if (img && img.complete && img.naturalWidth > 0) {
            const iw = img.naturalWidth, ih = img.naturalHeight;
            const scale = Math.max(r * 2 / iw, r * 2 / ih);
            const sw = iw * scale, sh = ih * scale;
            ctx.drawImage(img, cx - sw / 2, cy - sh / 2, sw, sh);
          } else {
            // 降级：首字母
            ctx.fillStyle = '#7c3aed';
            ctx.font = `bold ${r}px "Bahnschrift",sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(player.name ? player.name.slice(0, 1) : '?', cx, cy);
          }
        } else if (player && !player.placeholder) {
          ctx.fillStyle = '#7c3aed';
          ctx.font = `bold ${r}px "Bahnschrift",sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(player.name.slice(0, 1), cx, cy);
        } else {
          ctx.fillStyle = '#2a2a3e';
          ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
        }
        ctx.restore();
        // 外圈描边
        let strokeColor = 'rgba(255,255,255,.15)';
        let lineWidth = 1.5;
        if (isChamp) {
          strokeColor = '#ffd166';
          lineWidth = 3;
        } else if (isWinner) {
          strokeColor = 'rgba(162,89,255,.6)';
          lineWidth = 2;
        }
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // ─── 辅助：绘制连接线 ───
      function drawLine(x1, y1, x2, y2, color) {
        ctx.strokeStyle = color || 'rgba(255,255,255,.12)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      // ─── 对战树布局 ───
      // 4轮比赛，从左到右排列
      // 每轮中，选手垂直均匀分布
      const colXs = [44, 150, 256, 362];  // R1, R2, Semi, Final 的 x 坐标
      const champX = 458;                 // 冠军 x 坐标
      const topY = 22, bottomY = h - 22;

      // 定义每轮的对阵：[[matchId, sideA, sideB], ...]
      // sideA/sideB 是选手在该 match 中的位置（'A' 或 'B'）
      const roundMatches = [
        // Round 1: M1~M8, 每对两个选手
        ['M1','M2','M3','M4','M5','M6','M7','M8'],
        // Round 2: M9~M12
        ['M9','M10','M11','M12'],
        // Semi: M13~M14
        ['M13','M14'],
        // Final
        ['M15'],
      ];

      // 每轮需要的选手数量
      const playerCounts = [16, 8, 4, 2];

      // 对每轮计算每个选手的 y 位置
      function getPlayerPositions(roundIdx) {
        const count = playerCounts[roundIdx];
        const spacing = (bottomY - topY) / (count + 1);
        const positions = [];
        for (let i = 0; i < count; i++) {
          positions.push(topY + spacing * (i + 1));
        }
        return positions;
      }

      // 第一轮：直接从 matches 中读取选手
      // M1: fighters[0] vs fighters[1], M2: fighters[2] vs fighters[3], ...
      const r1Pos = getPlayerPositions(0);
      let r1Idx = 0;
      for (let mi = 0; mi < 8; mi++) {
        const mid = `M${mi + 1}`;
        const m = matches[mid];
        if (m) {
          const aPlayer = m.a, bPlayer = m.b;
          const yA = r1Pos[r1Idx], yB = r1Pos[r1Idx + 1];
          // 画选手 A
          drawAvatar(colXs[0], yA, 13, aPlayer, false, false);
          // 画选手 B
          drawAvatar(colXs[0], yB, 13, bPlayer, false, false);
          // 画横线连接两人到下一轮汇聚点
          const midY = (yA + yB) / 2;
          drawLine(colXs[0] + 13, yA, colXs[0] + 26, yA);
          drawLine(colXs[0] + 13, yB, colXs[0] + 26, yB);
          drawLine(colXs[0] + 26, yA, colXs[0] + 26, midY);
          drawLine(colXs[0] + 26, midY, colXs[1] - 13, midY);
          r1Idx += 2;
        }
      }

      // 第2-4轮：从 matches 读取晋级选手
      for (let round = 1; round < 4; round++) {
        const x = colXs[round];
        const mids = roundMatches[round];
        const yPositions = getPlayerPositions(round);
        const pairs = mids.length; // 本轮比赛数量
        const pairSize = playerCounts[round] / pairs; // 每场比赛的选手数 (2)

        for (let pi = 0; pi < pairs; pi++) {
          const mid = mids[pi];
          const m = matches[mid];
          if (!m) continue;
          const yA = yPositions[pi * pairSize];
          const yB = yPositions[pi * pairSize + 1];
          const aPlayer = m.a, bPlayer = m.b;
          // 画选手
          const isAWinner = m.winner && m.winner.id === aPlayer?.id;
          const isBWinner = m.winner && m.winner.id === bPlayer?.id;
          drawAvatar(x, yA, round === 3 ? 19 : round === 2 ? 17 : 15, aPlayer, isAWinner, false);
          drawAvatar(x, yB, round === 3 ? 19 : round === 2 ? 17 : 15, bPlayer, isBWinner, false);
          // 连接线到下一轮
          if (round < 3) {
            const midY = (yA + yB) / 2;
            drawLine(x + (round === 3 ? 19 : round === 2 ? 17 : 15), yA, x + 26, yA);
            drawLine(x + (round === 3 ? 19 : round === 2 ? 17 : 15), yB, x + 26, yB);
            drawLine(x + 26, yA, x + 26, midY);
            drawLine(x + 26, midY, colXs[round + 1] - 13, midY);
          } else {
            // Final 轮连接到冠军
            const midY = (yA + yB) / 2;
            drawLine(x + 19, yA, x + 32, yA);
            drawLine(x + 19, yB, x + 32, yB);
            drawLine(x + 32, yA, x + 32, midY);
            drawLine(x + 32, midY, champX - 26, midY);
          }
        }
      }

      // 冠军
      const champion = getChampion();
      if (champion) {
        drawAvatar(champX, h / 2, 26, champion, true, true);
        // 冠军光晕
        ctx.save();
        const glow = ctx.createRadialGradient(champX, h / 2, 20, champX, h / 2, 42);
        glow.addColorStop(0, 'rgba(255,209,102,.15)');
        glow.addColorStop(1, 'rgba(255,209,102,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(champX, h / 2, 42, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // 水印
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.font = '10px "Bahnschrift","PingFang SC",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('法网男单冠军预测 · 虎扑JRs出品', w / 2, h - 6);
    }

    function roundRectC(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function createPosterCanvas() {
      const canvas = document.getElementById('posterCanvas');
      canvas.width = POSTER_W * POSTER_SCALE;
      canvas.height = POSTER_H * POSTER_SCALE;
      const ctx = canvas.getContext('2d');
      ctx.scale(POSTER_SCALE, POSTER_SCALE);
      drawPoster(ctx, POSTER_W, POSTER_H);
      return canvas;
    }

    function generatePoster() {
      const canvas = createPosterCanvas();
      const img = document.getElementById('posterPreviewImg');
      img.src = canvas.toDataURL('image/png');
      document.getElementById('posterOverlay').classList.add('active');
    }

    function closePoster() {
      resetShareBtn();
      document.getElementById('posterOverlay').classList.remove('active');
    }

    function resetShareBtn() {
      const btn = document.querySelector('#posterOverlay .btn-share');
      if (btn) { btn.disabled = false; btn.textContent = '📤 一键发帖'; }
    }

    // ─── 全局 shim（KaleidoOSS 依赖） ───
    window.require = window.require || function(name) {
      if (name === 'ali-oss') return window.OSS;
      if (name === '@hupu/kaleido-fed-sdk') return window.KaleidoOSS;
      return null;
    };
    window.webGuard = window.webGuard || window.WebGuard || { hupuLog: function() {} };

    // ─── 通过 Colorbox Bridge / 直连 OSS 上传 ───
    let _ossClient = null;
    function getOssClient() {
      if (_ossClient) return _ossClient;
      const K = window.KaleidoOSS || (typeof require === 'function' ? require('@hupu/kaleido-fed-sdk') : null);
      if (K) {
        _ossClient = new K({
          appId: 'b1AcxWKA1u0hyDYv5kXgImZBRSQ=',
          module: 'activity-screenshot-fed',
          path: '/screenshot/activity/fed',
          sk: 'HioGpkmGe9bsW0iqRLJEyGoLr4Q=',
          action: '1',
        });
        if (typeof _ossClient.start === 'function') _ossClient.start();
      }
      return _ossClient;
    }

    function dataURLToBlob(dataURL) {
      const parts = dataURL.split(',');
      const mime = parts[0].match(/:(.*?);/)[1];
      const bstr = atob(parts[1]);
      const n = bstr.length;
      const u8arr = new Uint8Array(n);
      for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
      return new Blob([u8arr], { type: mime });
    }

    function uploadToOSS(file, filename) {
      return new Promise((resolve, reject) => {
        // 1) ColorboxAI API
        if (window.ColorboxAI && window.ColorboxAI.oss && typeof window.ColorboxAI.oss.uploadFile === 'function') {
          window.ColorboxAI.oss.uploadFile({ file, filename })
            .then(res => resolve(res.downloadUrl || ''))
            .catch(reject);
          return;
        }
        // 2) postMessage Bridge（作为 iframe 运行在 Colorbox Shell 中）
        if (window.parent && window.parent !== window) {
          const callbackId = '_cb_up_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
          const timer = setTimeout(() => { cleanup(); reject(new Error('上传超时')); }, 30000);
          const handler = e => {
            const d = e.data;
            if (d && d.protocol === 'colorbox-ai-bridge' && d.type === 'oss.upload.callback' && d.payload && d.payload.callbackId === callbackId) {
              clearTimeout(timer); cleanup();
              d.payload.error ? reject(new Error(d.payload.error)) : resolve(d.payload.downloadUrl || '');
            }
          };
          const cleanup = () => window.removeEventListener('message', handler);
          window.addEventListener('message', handler);
          window.parent.postMessage({
            protocol: 'colorbox-ai-bridge', version: 1, direction: 'frame-to-host',
            type: 'oss.upload',
            payload: { file, filename, callbackId }
          }, '*');
          return;
        }
        // 3) 直连 KaleidoOSS（独立运行时）
        const client = getOssClient();
        if (client) {
          const ext = filename.lastIndexOf('.') >= 0 ? filename.slice(filename.lastIndexOf('.')) : '.png';
          const now = new Date();
          const key = `user-upload/${(now.getFullYear() % 100)}${now.getMonth() + 1}${now.getDate()}-${Math.random().toString(36).slice(-6)}${ext}`;
          client.multipartUpload(key, file, {})
            .then(res => resolve(res.downloadUrl || `https://activity-static.hoopchina.com.cn/${res.name}`))
            .catch(reject);
          return;
        }
        // 4) 没有任何上传能力
        reject(new Error('No upload capability'));
      });
    }

    // ─── 一键发帖 ───
    function sharePoster(btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>上传中...';
      const canvas = createPosterCanvas();
      (async () => {
        try {
          const dataURL = canvas.toDataURL('image/png');
          const blob = dataURLToBlob(dataURL);
          const filename = `法网预测_${Date.now()}.png`;
          const url = await uploadToOSS(blob, filename);
          const imageUrl = url || '';
          const initialValue = {
            syncPost: true,
            appJsonV3: {
              activeTab: 'thread',
              data: {
                title: '',
                imageList: imageUrl ? [imageUrl] : [],
                content: '',
              },
            },
          };
          const tagName = encodeURIComponent('法网男单冠军预测');
          const tagId = '147546';
          const topicName = encodeURIComponent('网球场');
          const topicId = '245';
          const link = `huputiyu://bbs/postImg?tagName=${tagName}&tagId=${tagId}&topicName=${topicName}&topicId=${topicId}&initialValue=${encodeURIComponent(JSON.stringify(initialValue))}`;
          safeNavigate(link);
          closePoster();
        } catch (e) {
          console.error('发帖失败', e);
          // 降级：不带图纯文字发帖
          const initialValue = {
            syncPost: true,
            appJsonV3: {
              activeTab: 'thread',
              data: {
                title: '',
                imageList: [],
                content: '',
              },
            },
          };
          const tagName = encodeURIComponent('法网男单冠军预测');
          const tagId = '147546';
          const topicName = encodeURIComponent('网球场');
          const topicId = '245';
          const link = `huputiyu://bbs/postImg?tagName=${tagName}&tagId=${tagId}&topicName=${topicName}&topicId=${topicId}&initialValue=${encodeURIComponent(JSON.stringify(initialValue))}`;
          safeNavigate(link);
          resetShareBtn();
        }
      })();
    }

    /* ─── 统一跳转工具 ─── */
    const NAV_TARGET = { SELF: '_self', BLANK: '_blank' };

    function safeNavigate(url, target) {
      // 跳转前埋点
      if (window.ColorboxAI && typeof window.ColorboxAI.track === 'function') {
        try {
          window.ColorboxAI.track({ event: 'navigate', url: url, target: target || '_blank' });
        } catch (_) { /* 埋点失败不影响跳转 */ }
      }
      if (window.ColorboxAI && typeof window.ColorboxAI.navigateTo === 'function') {
        return window.ColorboxAI.navigateTo(url, target || '_blank');
      }
      if (window.ColorboxAI && typeof window.ColorboxAI.openUrl === 'function') {
        return window.ColorboxAI.openUrl(url);
      }
      window.open(url, target || '_blank');
    }

    console.log('🏆 天下第一武道会 - 已加载海报发帖模块');
  </script>
